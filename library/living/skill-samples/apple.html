<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>apple-design · 拖动阅读面板</title><link rel="stylesheet" href="base.css"><style>
.scene{position:relative;overflow:hidden;border:1px solid #d8dfd6;border-radius:28px;height:490px;max-width:620px;margin:28px auto;background:#e0e8dd;padding:35px}.scene h2{font-family:Songti SC,serif;font-size:34px}.scene p{max-width:380px;line-height:1.8;color:#526353}.sheet{position:absolute;left:12px;right:12px;top:145px;height:330px;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-radius:24px;box-shadow:0 8px 24px #30422c18;transform:translateY(230px);padding:0 24px 22px;will-change:transform}.handle{width:100%;height:42px;display:flex;justify-content:center;align-items:center;background:none;border:0;touch-action:none;cursor:grab}.handle:after{content:'';width:40px;height:5px;border-radius:6px;background:#bac2b7}.handle:active{cursor:grabbing}.sheet h3{font-size:25px;font-weight:550}.sheet p{font-size:14px}.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.state{text-align:center;font-size:13px;color:#536850}label{font-size:13px;display:block;text-align:center;margin:18px}.sheet .btn{margin-right:8px}@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style><header class="top"><span>01 / apple-design</span><a href="index.html">返回体验目录</a></header><main><div class="eyebrow">手势与反馈</div><h1>面板跟着你的手走。</h1><p class="muted">拖住面板顶部的横条，上下移动、甩一下、回弹时重新抓住。也可以连续点击展开和收起。</p><div class="prompt">你可以这样说：用 apple-design 做一个能拖动、能中途打断的阅读面板。</div><div class="scene"><span class="eyebrow">片刻 / 阅读</span><h2>给今天留一点空白。</h2><p>三篇短文，慢慢读。上拉面板，选择下一篇。</p><div class="sheet" id="sheet"><button class="handle" id="handle" aria-label="拖动阅读面板；按上下方向键展开或收起"></button><h3>光落在桌面的方式</h3><span class="tag">观察 · 示例短文</span><p>午后的光缓慢挪过桌面。杯子的影子从书页退到木纹里，房间没有变，我们注意到的东西却变了。</p><button class="btn" id="save">加入稍后阅读</button><button class="btn outline" onclick="go(230)">收起</button><p id="saved" aria-live="polite"></p></div></div><div class="controls"><button class="btn" onclick="go(0)">展开面板</button><button class="btn outline" onclick="go(230)">收起面板</button></div><label><input type="checkbox" id="reduce"> 减少动态效果</label><p class="state" id="state" aria-live="polite">已收起</p><p class="note">观察：拖动即时响应；松手按速度决定位置；回弹时可重新抓住；按钮按下立即反馈。示例选择只保留在本页。</p></main><script>
const sheet=document.getElementById('sheet'),handle=document.getElementById('handle'),reduce=document.getElementById('reduce'),state=document.getElementById('state');reduce.checked=matchMedia('(prefers-reduced-motion: reduce)').matches;
let y=230,v=0,target=230,frame=0,last=0,drag=null;function draw(){sheet.style.transform=`translateY(${y}px)`}function go(t){target=t;if(reduce.checked){cancelAnimationFrame(frame);frame=0;y=t;v=0;draw();state.textContent=t?'已收起':'已展开';return}if(!frame){last=performance.now();frame=requestAnimationFrame(tick)}}function tick(t){const dt=Math.min((t-last)/1000,.025);last=t;v+=(-490*(y-target)-42*v)*dt;y+=v*dt;draw();if(Math.abs(y-target)<.15&&Math.abs(v)<1){y=target;v=0;draw();frame=0;state.textContent=target?'已收起':'已展开'}else frame=requestAnimationFrame(tick)}
handle.addEventListener('pointerdown',e=>{if(drag||!e.isPrimary)return;cancelAnimationFrame(frame);frame=0;drag={id:e.pointerId,start:e.clientY,origin:y,last:e.clientY,time:e.timeStamp};v=0;handle.setPointerCapture(e.pointerId);state.textContent='拖动中'});handle.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const raw=drag.origin+e.clientY-drag.start;function rb(z){return z*200*.55/(200+.55*Math.abs(z))}y=raw<0?rb(raw):raw>230?230+rb(raw-230):raw;const dt=e.timeStamp-drag.time;if(dt>0)v=(e.clientY-drag.last)/dt*1000;drag.last=e.clientY;drag.time=e.timeStamp;draw()});function release(e){if(!drag||e.pointerId!==drag.id)return;if(e.timeStamp-drag.time>100)v=0;drag=null;const projected=y+v*.998/1000/(1-.998);go(projected>115?230:0)}handle.addEventListener('pointerup',release);handle.addEventListener('pointercancel',e=>{if(drag){drag=null;v=0;go(y>115?230:0)}});handle.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','Enter',' '].includes(e.key)){e.preventDefault();go(e.key==='ArrowUp'?0:e.key==='ArrowDown'?230:target===0?230:0)}});reduce.onchange=()=>go(target);let saved=false;document.getElementById('save').onclick=()=>{saved=!saved;document.getElementById('save').textContent=saved?'移出稍后阅读':'加入稍后阅读';document.getElementById('saved').textContent=saved?'已加入本页的稍后阅读列表':'已移出'};
</script></html>
