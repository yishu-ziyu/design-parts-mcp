</style><header class="top"><span>02 / prototype</span><a href="index.html">返回体验目录</a></header><main><div class="eyebrow">同一任务，三个方向</div><h1>今天，读哪一篇？</h1><p class="muted">底部切换方案，点「阅读」查看示例正文。也可以按 1、2、3 或方向键切换。</p><div class="prompt">你可以这样说：用 prototype 给阅读列表做三种布局，让我实际切换比较。</div><div id="stage"></div><div id="reading" class="surface hidden" tabindex="-1"></div></main><nav class="proto-picker" aria-label="Prototype variants"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item">紧凑列表</button><button class="proto-picker-item">编辑精选</button><button class="proto-picker-item">逐篇挑选</button></nav><script>const articles=[["光落在桌面的方式", "观察 · 4 分钟", "午后的光缓慢挪过桌面。杯子的影子从书页退到木纹里，房间没有变，我们注意到的东西却变了。停下来记录一处细节，比把整天装进相册更容易。"], ["留一点没有安排的时间", "随笔 · 6 分钟", "把日程留出一小块空白，走一条不必抵达什么地方的路。观察发生在空隙里：一个旧招牌，一扇敞开的窗，或者一段刚好听见的对话。"], ["一把椅子与一个角落", "空间 · 5 分钟", "房间里最常用的角落往往不在中心。一把椅子、一盏灯和伸手就能拿到的书，让停留成为一件容易的事。"]];const markup=["<div class=\"tag\">紧凑列表 · 一次扫完三篇，阅读效率高；每篇的展示空间较少。</div><div class=\"surface\"><span class=\"tag\">READING LIST / 03</span><h2>留给今天的三篇</h2><div class=\"row\"><div><h3>光落在桌面的方式</h3><span class=\"tag\">观察 · 4 分钟</span></div><button class=\"btn outline\" onclick=\"read(0)\">阅读 ↗</button></div><div class=\"row\"><div><h3>留一点没有安排的时间</h3><span class=\"tag\">随笔 · 6 分钟</span></div><button class=\"btn outline\" onclick=\"read(1)\">阅读 ↗</button></div><div class=\"row\"><div><h3>一把椅子与一个角落</h3><span class=\"tag\">空间 · 5 分钟</span></div><button class=\"btn outline\" onclick=\"read(2)\">阅读 ↗</button></div></div>", "<div class=\"tag\">编辑精选 · 一篇主打、两篇次要，内容有主次；占用更多空间。</div><div class=\"surface\" style=\"background:#edece3;padding:42px\"><span class=\"tag\">今日选读 / 01</span><h2 style=\"font-family:Songti SC,serif;font-size:clamp(32px,6vw,55px);max-width:500px;line-height:1.3\">光落在<br>桌面的方式</h2><p class=\"reader\">午后的光缓慢挪过桌面。杯子的影子从书页退到木纹里，房间没有变，我们注意到的东西却变了。停下来记录一处细节，比把整天装进相册更容易。</p><button class=\"btn\" onclick=\"read(0)\">开始阅读 · 4 分钟</button></div><div class=\"row\"><h3>留一点没有安排的时间</h3><button class=\"btn outline\" onclick=\"read(1)\">阅读 ↗</button></div><div class=\"row\"><h3>一把椅子与一个角落</h3><button class=\"btn outline\" onclick=\"read(2)\">阅读 ↗</button></div>", "<div class=\"tag\">逐篇挑选 · 一次只看一篇，选择负担小；找指定文章需要切换。</div><div class=\"surface\"><span class=\"tag\">ONE AT A TIME</span><div style=\"display:flex;gap:24px;align-items:center;margin:30px 0\"><span id=\"focus-number\" style=\"font:64px Georgia;color:#a5b1a1\">01</span><div><h2 id=\"focus-title\">光落在桌面的方式</h2><p class=\"tag\" id=\"focus-meta\">观察 · 4 分钟</p></div></div><p class=\"reader\" id=\"focus-copy\">午后的光缓慢挪过桌面。杯子的影子从书页退到木纹里，房间没有变，我们注意到的东西却变了。停下来记录一处细节，比把整天装进相册更容易。</p><div class=\"row\"><button class=\"btn\" onclick=\"read(focusIndex)\">读这一篇</button><button class=\"btn outline\" onclick=\"nextArticle()\">换一篇 →</button></div></div>"];const variants=markup.map(s=>()=>s);let focusIndex=0;function read(i){let e=document.getElementById('reading');e.innerHTML='<span class="tag">示例正文</span><h2>'+articles[i][0]+'</h2><p class="reader">'+articles[i][2]+'</p><button class="btn outline" onclick="closeRead()">收起正文</button>';e.classList.remove('hidden');e.focus();e.scrollIntoView({block:'nearest'})}function closeRead(){document.getElementById('reading').classList.add('hidden')}function nextArticle(){focusIndex=(focusIndex+1)%3;document.getElementById('focus-number').textContent=String(focusIndex+1).padStart(2,'0');document.getElementById('focus-title').textContent=articles[focusIndex][0];document.getElementById('focus-meta').textContent=articles[focusIndex][1];document.getElementById('focus-copy').textContent=articles[focusIndex][2];}// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';closeRead();focusIndex=0;
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
