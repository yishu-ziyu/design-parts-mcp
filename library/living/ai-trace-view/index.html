<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI trace view</title><link rel="icon" href="data:,">
<style>
@font-face{font-family:Inter;src:url(fonts/Inter-normal.woff2) format('woff2');font-weight:100 900;font-display:block}
*{box-sizing:border-box}html,body{margin:0;background:#f0f0f0;color:#141414;font:400 12px/1.3 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1271px;height:953px;margin:0 auto;overflow:hidden;background:#f0f0f0}
#col{position:absolute;left:346px;top:142px;width:540px}#col:before{content:"";position:absolute;left:-77px;top:-18px;width:724px;height:710px;border:.6px solid rgba(0,0,0,.022);pointer-events:none}
.line{display:flex;align-items:center;height:28px;white-space:nowrap;font-size:13.2px;color:#8d8d8d;cursor:pointer;user-select:none}
.line b{font-weight:400;color:#444}
.chip{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px 0 5px;margin:0 5px 0 3px;border-radius:6px;background:#f5f5f5;box-shadow:0 0 0 .6px rgba(0,0,0,.05);color:#222;font-size:11.5px;font-weight:500;transition:color .5s}
.chip i{width:10px;height:10px;display:block;flex:none}
.tail{color:#6a6a6a}
.car{margin-left:6px;width:10px;height:10px;transition:transform .3s;flex:none;stroke:#777;fill:none;stroke-width:1.200;stroke-linecap:round;stroke-linejoin:round}
.open>.line .car{transform:rotate(90deg)}
#top{position:relative}#tl{padding-left:24px}.finished #tl{padding-left:0}
#ico{position:absolute;left:3px;top:9px;width:10px;height:10px}
#lab{display:flex;align-items:center;transition:opacity .28s,filter .28s}#lab.x{opacity:0;filter:blur(4px)}
#lab .fade{color:#8d8d8d}
.sh{background:linear-gradient(100deg,#555 30%,#d0d0d0 50%,#555 70%);background-size:280% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 1.5s linear infinite}
@keyframes sh{from{background-position:130% 0}to{background-position:-60% 0}}
#list{position:relative;padding-left:26px;overflow:hidden;transition:height .5s cubic-bezier(.3,.8,.3,1)}
#list:before{content:"";position:absolute;left:9px;top:2px;bottom:2px;width:1px;background:#e0e0e0}
.step{opacity:0;height:0;overflow:hidden;transition:height .5s cubic-bezier(.3,.8,.3,1),opacity .4s}
.step.in{opacity:1}
.step .line{padding-left:0;position:relative}
.step .si{width:12px;height:12px;margin-right:10px;flex:none;stroke:#8d8d8d;fill:none;stroke-width:1.050;stroke-linecap:round}
.wrap{overflow:hidden;height:0;margin-left:22px;transition:height .55s cubic-bezier(.3,.8,.3,1);padding:0 6px}
.card{background:#f7f7f7;border-radius:13px;box-shadow:0 0 0 .6px rgba(0,0,0,.05),0 2px 6px rgba(0,0,0,.05);margin:4px 0 18px;overflow:hidden;width:465px;margin-left:-6px}
.item{display:flex;padding:0 11px;border-bottom:.6px solid #e8e8e8;align-items:center;min-height:33.4px;gap:9px}
.item .nm{font-weight:500;color:#1a1a1a;font-size:12.2px}.item .mt{color:#8d8d8d;margin-left:6px;font-size:12.2px}.item .tm{margin-left:auto;color:#9d9d9d;font-size:12px}
.item.two{align-items:flex-start;padding-top:8px;padding-bottom:8px;min-height:51px}.item.two .tx{color:#555;font-size:12.2px;margin-top:3px}
.av{width:14px;height:14px;border-radius:4px;background:#e4e4e4;color:#666;font-size:8px;font-weight:600;display:grid;place-items:center;flex:none}
.more{padding:0 11px;height:27px;line-height:27px;color:#a4a4a4;font-size:11px}
#sum{position:relative;margin-top:19px;transition:transform .5s cubic-bezier(.3,.8,.3,1)}
#col.finished #sum{margin-top:9px}#sum h4{margin:0 0 19px;font-size:13.6px;font-weight:600;color:#1a1a1a;line-height:18px}
#sum ul{margin:0 0 7.5px;padding:0;list-style:none}#sum li{position:relative;padding-left:20px;height:28.5px;line-height:18px;font-size:13.5px;color:#1a1a1a;white-space:nowrap}
#sum li:before{content:"";position:absolute;left:6.5px;top:7.2px;width:4px;height:4px;border-radius:50%;background:#222}
.block{display:none}.block.on{display:block}
.c{opacity:0;transition:opacity .25s}.c.v{opacity:1}
.mini{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px 0 4px;background:#f5f5f5;box-shadow:0 0 0 .6px rgba(0,0,0,.04);border-radius:6px;font-size:11.5px;font-weight:500;margin:0 2px 0 6px;vertical-align:1px}.mini i{width:10px;height:10px;display:block}
code{font:500 11.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;background:#e8e8e8;padding:2px 4px;border-radius:4px}
.mail{text-decoration:underline}
#acts{display:flex;gap:11px;align-items:center;height:18px;color:#aaa;transition:opacity .3s}
.note{max-width:760px;margin:26px auto 60px;padding:0 24px;color:#444;font-size:14px;line-height:1.6;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}h3{font-weight:500;font-size:17px;margin:18px 0 6px}dl{margin:0}dt code{font-size:13px;background:none}dd{margin:2px 0 12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.sh{-webkit-text-fill-color:currentColor;background:none}}
#stage,#list,.step,.wrap,.card{overflow:clip}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="k1" viewBox="0 0 10 10"><circle cx="2.800" cy="2.800" r="1.900" fill="#3fb6dc"/><circle cx="7.200" cy="2.800" r="1.900" fill="#3cb07c"/><circle cx="2.800" cy="7.200" r="1.900" fill="#d94a78"/><circle cx="7.200" cy="7.200" r="1.900" fill="#e5ad36"/></symbol>
<symbol id="k2" viewBox="0 0 10 10"><rect width="10" height="10" rx="2.600" fill="#a9c356"/><circle cx="5" cy="5" r="2.500" fill="none" stroke="#2c3a12" stroke-width="1.100"/></symbol>
<symbol id="k3" viewBox="0 0 10 10"><rect x=".9" y="1.900" width="8.200" height="6.200" rx="1" fill="none" stroke="#d94a3a" stroke-width="1.200"/><path d="M1.200 2.400 5 5.300 8.800 2.400" fill="none" stroke="#d94a3a" stroke-width="1"/></symbol>
<symbol id="k4" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4.600" fill="#1b1b1b"/><circle cx="5" cy="5" r="1.500" fill="#f5f5f5"/></symbol>
<symbol id="k5" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#7f8ae0"/><path d="M2.200 2.200A4 4 0 0 1 7.800 7.800Z" fill="#b8bff0"/></symbol>
<symbol id="sr" viewBox="0 0 12 12"><circle cx="5.200" cy="5.200" r="3.600"/><path d="m8 8 2.800 2.800"/></symbol>
<symbol id="dc" viewBox="0 0 12 12"><path d="M3 1.800h4l2 2v6.400H3ZM4.800 6h2.600M4.800 8h2.600"/></symbol>
</defs></svg>
<div id="stage"><div id="col"><div id="top"><svg id="ico" viewBox="0 0 10 10"><circle class="dotA" cx="3" cy="3" r="1.300" fill="#d65a3f"/><circle cx="3" cy="7" r="1.300" fill="#e29a5b"/><circle cx="7" cy="5" r="1.300" fill="#cf4b58"/></svg><div class="line" id="tl"><div id="lab"></div></div>
<div id="list"></div></div>
<div id="sum"></div></div></div>
<div class="note"><h3>可拆</h3><dl>
<dt><code>#top</code></dt><dd>最上面一行永远是正在做的那一步，换步时模糊淡入；结束后变成一句总结加来源小图标。</dd>
<dt><code>#list</code></dt><dd>子步骤列表：每步展开一张结果卡片，新的一张展开时最老的那张收起，始终只露出两张左右。</dd>
<dt><code>#sum</code></dt><dd>答案按字符流式显示，下方的复制和反馈按钮被文字一路推下去。</dd>
</dl></div>
<script>
const CARET='<svg class="car" viewBox="0 0 10 10"><path d="M3.500 2 6.500 5 3.500 8"/></svg>';
const I=k=>`<svg width="11.500" height="11.500" viewBox="0 0 10 10" style="display:block"><use href="#k${k}"/></svg>`;
const two=(a,n,m,tm,tx)=>`<div class="item two">${a}<div style="flex:1"><div style="display:flex"><span class="nm">${n}</span><span class="mt">${m}</span><span class="tm">${tm}</span></div><div class="tx">${tx}</div></div></div>`;
const av=c=>`<span class="av">${c}</span>`, ic=k=>`<span class="av" style="background:none">${I(k)}</span>`;
const one=(g,n,m,tm)=>`<div class="item">${g}<span class="nm">${n}</span><span class="mt" style="margin-left:0">${m}</span>${tm?`<span class="tm">${tm}</span>`:''}</div>`;
const G=(d,c)=>`<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="${c}" stroke-width="1.100" stroke-linecap="round" style="flex:none">${d}</svg>`;
const pr=(c)=>G('<circle cx="3" cy="2.500" r="1.200"/><circle cx="3" cy="9.500" r="1.200"/><circle cx="9" cy="6" r="1.200"/><path d="M3 3.700v4.600M4.200 6h3.600"/>',c);
const st=(c,d)=>G(d,c);
const STEPS=[
{ico:'sr',v:'Searched',k:1,c:'Slack',tail:'for messages since yesterday',on:.55,open:.9,close:4.0,card:two(av('J'),'Jane Doe','#support','9:41','Two tickets this morning, both cold sales emails. Closing them.')+two(av('S'),'Sam Lee','#deploys','11:02','fix: retry failed uploads is on staging, prod after lunch')+two(av('A'),'Alex Kim','#general','14:15','Huddle at 3? My mic is fixed this time, promise.')+'<div class="more">+1 more</div>'},
{ico:'dc',v:'Read the',k:2,c:'Granola',tail:'notes from today\'s calls',on:2.9,open:3.0,close:6.0,card:two(ic(2),'Northwind kickoff','Jane, Sam','10:00','Scope agreed: three sprints, invoice at month end.')+two(ic(2),'Weekly sync','Team','16:00','Launch moves to Nov 3, Alex owns the docs.')},
{ico:'sr',v:'Searched',k:3,c:'Gmail',tail:'for unread threads',on:4.0,open:4.05,close:7.1,card:two('<span class="av" style="background:none"><i style="width:5px;height:5px;border-radius:50%;background:#4d7fe0"></i></span>','Re: Signed contract','Jane Doe','8:12','Attached the signed copy, two small changes on page 4.')+two('<span class="av" style="background:none"></span>','Invoice AC-043','Northwind Billing','Yesterday','Payment scheduled for Oct 28.')+two('<span class="av" style="background:none"><i style="width:5px;height:5px;border-radius:50%;background:#4d7fe0"></i></span>','Your October statement','Acme Bank','Yesterday','Your statement is ready to view.')},
{ico:'dc',v:'Read the',k:4,c:'GitHub',tail:'pull requests',on:5.1,open:5.25,close:8.5,card:one(pr('#7d6bcf'),'Retry failed uploads','acme/app#128','2h')+one(pr('#3f9a55'),'Add the invoice export','acme/app#131','5h')+one(pr('#888'),'New onboarding','acme/web#57','1d')+'<div class="more">+1 more</div>'},
{ico:'dc',v:'Read the',k:5,c:'Linear',tail:'issues',on:7.0,open:7.05,close:8.5,card:one(st('#d9b23e','<circle cx="6" cy="6" r="4.300" stroke-dasharray="1.800 1.600"/>'),'Export invoices as CSV','ENG-142')+one(st('#777','<circle cx="6" cy="6" r="4.300"/>'),'Fix the duplicate invoice number','ENG-139')+one('<svg width="12" height="12" viewBox="0 0 12 12" style="flex:none"><circle cx="6" cy="6" r="5" fill="#6a70c9"/><path d="M3.800 6.100 5.400 7.700 8.300 4.500" fill="none" stroke="#fff" stroke-width="1.100" stroke-linecap="round"/></svg>','Ship the new onboarding','ENG-120')+'<div class="more">+1 more</div>'}];
const list=document.getElementById('list'),lab=document.getElementById('lab'),sum=document.getElementById('sum'),ico=document.getElementById('ico');
STEPS.forEach(s=>{const d=document.createElement('div');d.className='step';d.innerHTML=`<div class="line"><svg class="si"><use href="#${s.ico}"/></svg>${s.v}<span class="chip">${I(s.k)}${s.c}</span><span class="tail">${s.tail}</span>${CARET}</div><div class="wrap"><div class="card">${s.card}</div></div>`;list.append(d);s.el=d;s.wrap=d.querySelector('.wrap');s.line=d.querySelector('.line');s.cardH=()=>d.querySelector('.card').offsetHeight+17;
 s.line.onclick=()=>{manual();s.isOpen=s.isOpen||s.user;s.user=!s.isOpen;s.isOpen=s.user;apply(s,true);syncList()}});
// 答案：逐字显示。块用 data 标记，第一个字到达时才占位。
const BL=[['h','Meetings'],['ul',[['Kickoff with Northwind: scope agreed, invoice at month end','{notes}']]],['h','Slack'],['ul',[['Two support tickets, no reply needed','{one}'],['Shipped ','`fix: retry failed uploads`',' to staging','{commit}']]],['h','Mail'],['ul',[['Jane Doe asked for the signed contract: ','<jane.doe@example.com>','.']]]];
const CH={'{notes}':[2,'notes'],'{one}':[1,'one'],'{commit}':[4,'commit']};
let chars=[];const wrapChars=t=>[...t].map(c=>`<span class="c">${c}</span>`).join('');
function piece(p){if(CH[p]){const[k,n]=CH[p];return `<span class="c"><span class="mini">${I(k)}${n}</span> .</span>`}
 if(p[0]==='`')return `<code>${wrapChars(p.slice(1,-1))}</code>`;
 if(p[0]==='<')return `<span class="mail">${wrapChars(p.slice(1,-1))}</span>`;return wrapChars(p)}
sum.innerHTML=BL.map(([t,v])=>t==='h'?`<h4 class="block">${wrapChars(v)}</h4>`:`<ul class="block">${v.map(l=>`<li>${l.map(piece).join('')}</li>`).join('')}</ul>`).join('')+'<div id="acts"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor"><rect x="1.500" y="3.500" width="7" height="7" rx="1.500"/><path d="M3.500 3.500V2.800a1.300 1.300 0 0 1 1.300-1.300h4A1.300 1.300 0 0 1 10.500 2.800v4A1.300 1.300 0 0 1 9.200 8.100H8.500"/></svg><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M2 6.500 5 3.500 8 6.500"/></svg><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M2 3.500 5 6.500 8 3.500"/></svg></div>';
chars=[...sum.querySelectorAll('.c')];
const SUM0=7.15,SUM1=9.75,HIDE=10.0,END=13;let isManual=false;
function manual(){isManual=true}
function apply(s,anim){const h=s.isOpen||s.user?s.cardH():0;s.el.style.height=(s.vis?28+h:0)+'px';s.wrap.style.height=h+'px';s.el.classList.toggle('open',h>0);s.el.classList.toggle('in',!!s.vis)}
function syncList(){if(list.style.height!=='0px')list.style.height=STEPS.reduce((a,s)=>a+28+(s.isOpen?s.cardH():0),0)+'px'}
let labKey='';
function setLab(html,key){if(key===labKey)return;labKey=key;lab.classList.add('x');clearTimeout(setLab.t);const fn=()=>{lab.innerHTML=html;lab.classList.remove('x')};if(render.static)fn();else setLab.t=setTimeout(fn,180)}
function render(t){
 const done=t>=HIDE;
 let cur=null;STEPS.forEach(s=>{if(t>=s.on)cur=s});
 if(done){setLab(`Ran 2 searches and read 3 sources <span style="display:inline-flex;gap:3px;margin:0 6px 0 6px">${I(1)}${I(2)}${I(3)}</span>${CARET}`,'done');ico.style.opacity=0;document.getElementById('col').classList.add('finished')}
 else{ico.style.opacity=1;document.getElementById('col').classList.remove('finished');
  if(!cur)setLab(`<span class="sh">Working on it…</span>${CARET}`,'w');
  else setLab(`<span class="sh">${cur.v}</span><span class="chip">${I(cur.k)}${cur.c}</span><span class="tail">${cur.tail}</span><svg class="car" style="transform:rotate(90deg)" viewBox="0 0 10 10"><path d="M3.500 2 6.500 5 3.500 8"/></svg>`,'s'+cur.c)}
 STEPS.forEach(s=>{const v=t>=s.on;const o=t>=s.open&&t<s.close;if(v!==s.vis||o!==s.isOpen){s.vis=v;s.isOpen=o;apply(s)}});
 const lh=done?0:STEPS.reduce((a,s)=>{if(!s.vis)return a;return a+28+(s.isOpen?s.cardH():0)},0);
 list.style.height=lh+'px';
 const n=t<SUM0?0:Math.round((t-SUM0)/(SUM1-SUM0)*chars.length);
 chars.forEach((c,i)=>c.classList.toggle('v',i<n));
 sum.querySelectorAll('.block').forEach(b=>{const first=b.querySelector('.c');b.classList.toggle('on',first.classList.contains('v'))});
 sum.style.visibility=t<SUM0?'hidden':'visible';
}
document.getElementById('tl').onclick=()=>{manual();const open=list.style.height!=='0px';if(open){list.style.height='0'}else{list.style.height='1px';syncList()}document.getElementById('tl').classList.toggle('open',!open)};
const fit=()=>{document.getElementById('stage').style.zoom=Math.min(1,innerWidth/1271)};addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search),REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
document.fonts.ready.then(()=>{
 if(q.has('t')){render.static=true;render(+q.get('t'))}
 else if(REDUCE){render.static=true;render(11)}
 else{let t0=performance.now();(function l(n){let t=(n-t0)/1000;if(isManual)return;if(t>END){t0=n;t=0;labKey='';}render(t);requestAnimationFrame(l)})(t0)}
});
</script></body></html>
