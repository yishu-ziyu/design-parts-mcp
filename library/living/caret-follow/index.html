<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>光标跟着书写位置</title>
<style>
:root { --ink:#2f2a22; --quiet:#5a5247; --paper:#f3f4f6; --line:rgba(32,38,46,.12); }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 "PingFang SC","Hiragino Sans GB",sans-serif; }
.stage { width:min(640px,calc(100% - 32px)); margin:32px auto 0; }
#frame { position:relative; height:360px; border-radius:28px; overflow:hidden; background:#fff; box-shadow:0 1px 2px rgba(32,38,46,.04),0 14px 32px -16px rgba(32,38,46,.18); }
#frame::after { content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 1px var(--line); pointer-events:none; }
.chrome { height:44px; display:flex; align-items:center; gap:8px; padding:0 14px; border-bottom:1px solid var(--line); color:var(--quiet); font-size:12px; }
.lights { display:flex; gap:6px; }
.lights i { width:10px; height:10px; border-radius:50%; background:#d7d3cc; }
.art { position:absolute; inset:44px 0 0; background:linear-gradient(#c9d4c4,#8ea38a 40%,#d8d2c4 72%,#efe8dc); }
#summon { position:absolute; left:50%; bottom:18%; transform:translateX(-50%); border:0; border-radius:999px; background:rgba(255,255,255,.9); padding:8px 14px; }
#palette { position:absolute; left:50%; top:72px; width:min(440px,calc(100% - 36px)); transform:translateX(-50%) translateY(8px); opacity:0; border-radius:16px; background:#fff; box-shadow:0 18px 40px -24px rgba(32,38,46,.45), inset 0 0 0 1px var(--line); pointer-events:none; }
#palette.on { opacity:1; transform:translateX(-50%); transition:opacity 180ms, transform 180ms; }
#field { min-height:48px; display:flex; align-items:center; padding:0 14px; border-bottom:1px solid var(--line); }
#typed { font-size:16px; }
#caret { display:inline-block; width:1px; height:1.1em; margin-left:1px; background:var(--ink); vertical-align:-2px; animation:blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity:0; } }
.row { display:grid; grid-template-columns:4.5rem 1fr; gap:8px; padding:10px 14px; color:var(--quiet); }
.row strong { color:var(--ink); font-weight:600; }
.row.on { background:#f3f1ec; }
#pointer { position:absolute; left:0; top:0; width:18px; height:18px; transition:transform 280ms cubic-bezier(.2,0,0,1); }
.doc { width:min(640px,calc(100% - 32px)); margin:28px auto 64px; color:var(--quiet); }
.doc h3 { margin:0 0 8px; color:var(--ink); font-size:15px; }
.doc code { font:12.5px ui-monospace,monospace; }
@media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="stage">
  <div id="frame">
    <div class="chrome"><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>新标签页</div>
    <div class="art"></div>
    <button id="summon" type="button">⌘K</button>
    <div id="palette" hidden>
      <div id="field"><span id="typed"></span><span id="caret"></span></div>
      <div id="list">
        <div class="row" id="row-a"><span>笔记</span><strong>潮水退到可以走的地方</strong></div>
        <div class="row" id="row-b"><span>书签</span><strong>一幅晨湖</strong></div>
      </div>
    </div>
    <svg id="pointer" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 2.2 14.2 8.4 8.8 9.6 7.2 15.2Z" fill="#2f2a22" stroke="#f3f4f6" stroke-width="1.2"/></svg>
  </div>
</div>
<section class="doc"><h3>可拆</h3><dl>
<dt><code>#caret</code></dt><dd>字按 150ms 一个补进输入。光标是字后面 1px 的竖线。</dd>
<dt><code>#pointer</code></dt><dd>指针用 transform 移到当前目标：先是快捷键，再是光标，再是亮起的行。测量的是目标盒子，不是写死的坐标。过渡 280ms。</dd>
<dt><code>#row-a</code></dt><dd>结果行亮起时指针改跟这一行。减少动态效果时直接停在写完的状态。</dd>
</dl>
<p>同目录 <code>origin/hero-demo.tsx</code> 是研究页里的原实现。</p>
</section>
<script>
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const palette = document.getElementById("palette");
const typed = document.getElementById("typed");
const caret = document.getElementById("caret");
const pointer = document.getElementById("pointer");
const frame = document.getElementById("frame");
const summon = document.getElementById("summon");
const word = "潮汐";
let active = 0;
function place(el) {
  const a = frame.getBoundingClientRect();
  const b = el.getBoundingClientRect();
  const x = b.left - a.left + (el === caret ? b.width + 2 : 8);
  const y = b.top - a.top + 4;
  pointer.style.transform = `translate(${x}px, ${y}px)`;
}
function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
async function run() {
  palette.hidden = true;
  palette.classList.remove("on");
  typed.textContent = "";
  document.querySelectorAll(".row").forEach((n) => n.classList.remove("on"));
  place(summon);
  if (reduce) {
    palette.hidden = false;
    palette.classList.add("on");
    typed.textContent = word;
    document.getElementById("row-a").classList.add("on");
    place(document.getElementById("row-a"));
    return;
  }
  await sleep(700);
  palette.hidden = false;
  requestAnimationFrame(() => palette.classList.add("on"));
  await sleep(280);
  place(caret);
  for (let i = 1; i <= word.length; i++) {
    typed.textContent = word.slice(0, i);
    place(caret);
    await sleep(150);
  }
  await sleep(220);
  const rows = ["row-a", "row-b", "row-a"];
  for (const id of rows) {
    document.querySelectorAll(".row").forEach((n) => n.classList.remove("on"));
    const row = document.getElementById(id);
    row.classList.add("on");
    place(row);
    await sleep(700);
  }
  run();
}
run();
</script>
</body>
</html>
