<div class="notes"><h3>可拆</h3><dl>
<dt><code>#ring</code></dt><dd>整圈是一个全屏片元着色器画的距离场：smin 让卡片互相融化，桥形距离场拉丝，顶底玻璃边折射。</dd>
<dt><code>#mName</code></dt><dd>文字融化：新旧两层各自模糊，再过一次对比度阈值，两团软边交叉成一个形状。</dd>
<dt><code>#index</code></dt><dd>索引列：按卡片离正前方的格数渐变亮度，点击转到该卡。</dd>
<dt><code>#heading</code></dt><dd>入场标题：逐字从遮罩里升起，环落位前再升走。</dd>
<dt><code>#view</code></dt><dd>悬停标签：指针在卡上才出现，弹出后跟随指针。</dd>
