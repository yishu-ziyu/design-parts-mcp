const R=document.documentElement.style;
function fit(){const s=Math.min(innerWidth/1440,innerHeight/800);R.setProperty('--fit-scale',s);R.setProperty('--fit-box-h',Math.max(innerHeight,800*s)+'px');R.setProperty('--fit-mt',Math.max(0,(innerHeight-800*s)/2)+'px')}
fit();addEventListener('resize',fit);
const els=[...document.querySelectorAll('[data-m]')];const base=els.map(e=>e.getAttribute('style'));
const chaos=document.querySelector('[aria-label="chaos mode"]'),tidy=document.querySelector('[aria-label="cleaned-up mode"]');
function setMode(t){els.forEach((e,i)=>e.setAttribute('style',t?MODE[+e.dataset.m]:base[i]));chaos.classList.toggle('hero14-toggle-btn--active',!t);tidy.classList.toggle('hero14-toggle-btn--active',t);chaos.setAttribute('aria-pressed',!t);tidy.setAttribute('aria-pressed',t)}
chaos.onclick=()=>setMode(false);tidy.onclick=()=>setMode(true);
document.querySelector('.hero14-scene').addEventListener('click',e=>{const a=e.target.closest('a');if(a)e.preventDefault()});
/* 唱片机：点击后叠一层旋转的圆锥高光，复刻原站的 sheen；不接音频 */
const vinyl=document.querySelector('.hero14-vinyl');let sheen=null;
vinyl.onclick=()=>{if(sheen){sheen.remove();sheen=null;vinyl.title='music — click to spin';vinyl.setAttribute('aria-label','play music');return}
 sheen=document.createElement('div');sheen.className='vinyl-sheen-clip';sheen.style.cssText='left:5.95238%;top:12.9712%;width:74.6753%';sheen.innerHTML='<div class="vinyl-sheen"></div>';vinyl.firstElementChild.firstElementChild.appendChild(sheen);vinyl.title='music — playing';vinyl.setAttribute('aria-label','pause music')};
const q=new URLSearchParams(location.search);if(q.get('mode')==='tidy')setMode(true);if(q.get('vinyl'))vinyl.click();
