<style>

/* timeline */
#tb{left:0;top:1030px;width:100%;height:143px;background:#19191b}

#tc{position:absolute;left:59px;top:14px;font:500 15.5px/20px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:#b5b5b9;white-space:pre}

#trk{left:0;top:87px;width:100%;height:56px;background:#111113}
.tick{position:absolute;top:50px;bottom:0;width:1px;background:#28282b}
#bar2{position:absolute;left:135px;top:115px;width:1372px;height:9px;background:#a9561f;border-radius:1px}
#bar2 u{position:absolute;top:0;height:100%;background:#d4792c;display:block}
.dia{position:absolute;top:113.500px;width:12px;height:12px;background:#f2f2f2;transform:translateX(-50%) rotate(45deg)}
#ph{position:absolute;top:49px;bottom:0;width:2px;background:#5b6edb;cursor:ew-resize}
#ph:before{content:"";position:absolute;left:-9px;top:0;width:20px;height:16px;background:#5b6edb;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
#st,#en{position:absolute;top:50px;height:36px;background:#3a4274}
#st{left:126px;width:20px}#en{left:1838px;width:18px}
#scrub{position:absolute;left:0;top:49px;right:0;bottom:0;cursor:ew-resize}
.fld{position:absolute;top:10px;height:28px;background:#232325;border-radius:4px;color:#d0d0d3;font-size:15.5px;line-height:28px;padding-left:12px;font-weight:500}
#cur{position:absolute;left:816px;top:1062px;width:50px;height:80px;pointer-events:none}
section.notes{max-width:760px;margin:0 auto;padding:40px 20px 80px}
h3{font-weight:600;margin:0 0 12px}dt code{color:#e6d94a}dd{margin:0 0 12px;color:#aaa}
</style></head><body>
<div id="fit"><div id="stage"><div id="win">
 <div id="bar" class="abs"><span class="tl" style="left:13px;background:#ee5a50"></span><span class="tl" style="left:47px;background:#f4bd2f"></span><span class="tl" style="left:81px;background:#5fc454"></span>
  <svg style="left:122px" viewBox="0 0 20 20"><path d="M16 10H4M9 5l-5 5 5 5"/></svg>
  <b>project-a</b><i>project-a</i>
  <svg style="left:367px" viewBox="0 0 20 20"><path d="M2.500 5h5l2 2h8v9h-15z"/></svg>
  <svg style="left:1740px" viewBox="0 0 20 20"><path d="M7 2v5H2M13 2v5h5M7 18v-5H2M13 18v-5h5"/></svg>
  <svg style="left:1778px" viewBox="0 0 20 20"><circle cx="10" cy="11" r="7.500"/><path d="M10 6.500V11l3 2"/><circle cx="17.500" cy="2.800" r="2.800" fill="#e8e8ea" stroke="none"/></svg>
  <svg style="left:1817px" viewBox="0 0 20 20"><path d="M10 3v10M6 9.500l4 4 4-4M3 17h14"/></svg>
  <svg style="left:1855px" viewBox="0 0 20 20"><path d="M3.500 17l1-3.500a7.500 7.500 0 1 1 3 2.500z"/><circle cx="7.500" cy="10" r=".6"/><circle cx="10.500" cy="10" r=".6"/><circle cx="13.500" cy="10" r=".6"/></svg>
 </div>
 <div id="lv"><div id="lgw"></div><div id="lg"></div><img class="raw" id="lraw" alt=""></div>
 <div id="sep"></div>
 <div id="rv"><img class="raw" id="rraw" alt=""></div>

 <div id="tb" class="abs">
  <div id="hdr" class="abs"><button id="play" aria-label="播放或暂停"><svg viewBox="0 0 18 18" width="18" height="18" fill="#c8c8cc"><rect id="p1" x="2" y="1" width="4.500" height="16"/><rect id="p2" x="10" y="1" width="4.500" height="16"/></svg></button><div id="tc">00 : 00 : 00</div>
   <div class="abs" style="left:1501px;top:23px;width:188px;height:4px;background:#46464a;border-radius:2px"></div><div class="abs" style="left:1512px;top:17.500px;width:16px;height:16px;background:#d9d9dc;border-radius:50%"></div>
   <div class="fld" style="left:1702px;width:68px">0</div><div class="fld" style="left:1773px;width:68px">5.74</div>
   <svg class="abs" style="left:1858px;top:15px" width="20" height="20" viewBox="0 0 20 20" fill="#b5b5b9"><path d="M9 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg></div>
  <div id="rul" class="abs"></div>
  <div id="trk" class="abs"></div>
  <div id="st"></div><div id="en"></div>
  <div id="bar2"></div>
  <div id="ph"></div>
  <div id="scrub" aria-label="拖动时间轴"></div>
 </div>
 <svg id="cur" viewBox="0 0 50 80"><path d="M3 2v68l16-16h27z" fill="#111" stroke="#fff" stroke-width="3.500" stroke-linejoin="round"/></svg>
</div></div></div>
<section class="notes">
<h3>可拆</h3>
<dl>
<dt><code>#lv</code></dt><dd>侧面灰度视图：相机不动，整个世界在相机后面移动。</dd>
<dt><code>#rv</code></dt><dd>相机真正看到的彩色画面，和左边共用同一张世界图。</dd>
<dt><code>#fr</code></dt><dd>黄色线框相机视锥和经过关键帧的虚线路径。</dd>
<dt><code>#tb</code></dt><dd>时间轴：拖动播放头，两个视图一起跟着走。</dd>
</dl>
</section>
<script src="cam-data.js"></script>
<script>
(()=>{const C=window.CAM,$=id=>document.getElementById(id),DUR=4.99,X0=135,PX=299;
const stage=$('stage'),fit=$('fit');
function fitStage(){const k=Math.min(innerWidth/1900,innerHeight/1176);stage.style.transform=`scale(${k})`;fit.style.height=1176*k+'px';}addEventListener('resize',fitStage);fitStage();
const mk=(par,img,w,h)=>{const d=document.createElement('div');d.className='world';d.style.cssText+=`width:${w}px;height:${h}px;background-image:url(${img})`;par.appendChild(d);return d};
const lw0=mk($('lgw'),'source-assets/left-world.jpg',C.LS[0],C.LS[1]);
const lw=mk($('lg'),'source-assets/world-left.webp',C.WS[0],C.WS[1]);
const rw=mk($('rv'),'source-assets/world.webp',C.WS[0],C.WS[1]);$('rv').appendChild($('rraw'));
const brs=[lw,rw].map(w=>{const b=document.createElement('div');b.className='bread';b.style.cssText+=`width:${C.bread.w}px;height:${C.bread.h}px;background-image:url(source-assets/bread.png)`;w.appendChild(b);return b});
const brs2=[lw,rw].map(w=>{const b=document.createElement('div');b.className='bread';b.style.cssText+=`width:${C.bread2.w}px;height:${C.bread2.h}px;background-image:url(source-assets/bread2.png)`;w.appendChild(b);return b});
const clamp01=v=>Math.max(0,Math.min(1,v));
const mat3=(M,i,f)=>{const a=M[Math.min(i,M.length-1)],b=M[Math.min(i+1,M.length-1)];const m=a.map((v,k)=>v+(b[k]-v)*f);const d=m[8];return m.map(v=>v/d)};
const css=m=>`matrix3d(${m[0]},${m[3]},0,${m[6]},${m[1]},${m[4]},0,${m[7]},0,0,1,0,${m[2]},${m[5]},0,1)`;
const app=(m,x,y)=>{const w=m[6]*x+m[7]*y+m[8];return[(m[0]*x+m[1]*y+m[2])/w,(m[3]*x+m[4]*y+m[5])/w]};
/* keyframe track */
const KT=[0,.98,2,3,3.73,4.59];
['0.00','1.00','2.00','3.00','4.00','5.00'].forEach((s,i)=>{const e=document.createElement('span');e.textContent=s;e.style.left=(X0+i*298)+'px';$('rul').appendChild(e)});
for(let i=0;i<6;i++){const e=document.createElement('div');e.className='tick';e.style.left=(X0+i*298)+'px';$('trk').appendChild(e)}
[[.78,1.2],[1.8,2.2],[2.85,3.15],[3.6,3.8]].forEach(([a,b])=>{const u=document.createElement('u');u.style.left=(a*299)+'px';u.style.width=((b-a)*299)+'px';$('bar2').appendChild(u)});
KT.forEach(k=>{const d=document.createElement('div');d.className='dia';d.style.left=(X0+k*299)+'px';$('tb').appendChild(d)});
/* frustum */
const AP=[262,683],Q=[[357,406],[565,462],[555,677],[367,605]];
const hex=(x,y,r)=>{let s='';for(let i=0;i<6;i++){const a=Math.PI/3*i+Math.PI/6;s+=(i?'L':'M')+(x+r*Math.cos(a)).toFixed(1)+' '+(y+r*Math.sin(a)).toFixed(1)}return s+'z'};
const Y='#f7f03c';
function frust(t,Lw){const sp=$('fr');let h='';
  if(t>=4.15){sp.innerHTML='';return}
  const apS=t<.1?27:Math.max(13,27-(t-.1)*140);
  const i0=Math.min(41,Math.round(t*10));const rays=C.rays[i0]||[],dots=C.dots[i0]||[];
  rays.forEach(a=>{h+=`<path d="M${AP[0]} ${AP[1]}L${(AP[0]+Math.cos(a)*1700).toFixed(1)} ${(AP[1]+Math.sin(a)*1700).toFixed(1)}" stroke="${Y}" stroke-width="3.600" stroke-linecap="round" stroke-dasharray=".1 7"/>`});
  dots.forEach(p=>{h+=`<path d="${hex(p[0],p[1],11)}" fill="${Y}"/>`});
  h+=`<g stroke="${Y}" stroke-width="3">`+Q.map(q=>`<path d="M${AP[0]} ${AP[1]}L${q[0]} ${q[1]}"/>`).join('')+`<path d="M${Q.map(q=>q.join(' ')).join('L')}z"/></g>`;
  h+=`<path d="M432 416L456 400 478 430z" fill="${Y}"/>`;
  h+=`<path d="${hex(AP[0],AP[1],apS)}" fill="${Y}"/>`;
  sp.innerHTML=h;
}
const rraw=$('rraw'),lraw=$('lraw');const cache={};
function pre(){for(let i=34;i<50;i++){const a=new Image();a.src=`source-assets/r${i}.jpg`;cache['r'+i]=a}for(let i=41;i<50;i++){const a=new Image();a.src=`source-assets/l${i}.jpg`;cache['l'+i]=a}}pre();
let cur=0,playing=true,last=null;
function render(t){cur=t;const i=Math.floor(Math.min(t,4.1)*10),f=Math.min(t,4.1)*10-i;
  const Rm=mat3(C.Rm,i,f),Lw=mat3(C.Lw,i,f),Lm=mat3(C.Lm,i,f);
  rw.style.transform=css(Rm);lw.style.transform=css(Lw);lw0.style.transform=css(Lm);
  const tr=C.bread.tr,p0=tr[Math.min(i,41)],p1=tr[Math.min(i+1,41)];const mix=k=>p0[k]+(p1[k]-p0[k])*f;const bx=mix(0)+C.bread.ox,by=mix(1)+C.bread.oy;
  brs.forEach(b=>{b.style.left=bx+'px';b.style.top=by+'px';b.style.transformOrigin=`${-C.bread.ox}px ${-C.bread.oy}px`;b.style.transform=`rotate(${mix(2)}deg) scale(${mix(3)})`;b.style.opacity=1-clamp01((t-.2)/.15)});
  const B2=C.bread2,bx2=mix(0)+B2.ox,by2=mix(1)+B2.oy;brs2.forEach(b=>{b.style.left=bx2+'px';b.style.top=by2+'px';b.style.transformOrigin=`${-B2.ox}px ${-B2.oy}px`;b.style.transform=`rotate(${mix(2)-B2.a0}deg) scale(${mix(3)/B2.s0})`;b.style.opacity=clamp01((t-.2)/.15)});
  const useR=t>=3.4,useL=t>=4.1;
  rraw.style.display=useR?'block':'none';rw.style.visibility=useR?'hidden':'visible';
  if(useR){const n=Math.min(49,Math.round(t*10));const s=`source-assets/r${n}.jpg`;if(!rraw.src.endsWith(s))rraw.src=s}
  lraw.style.display=useL?'block':'none';if(useL){const n=Math.max(41,Math.min(49,Math.round(t*10)));const s=`source-assets/l${n}.jpg`;if(!lraw.src.endsWith(s))lraw.src=s}
  frust(t,Lw);
  $('ph').style.left=(X0+t*299-1)+'px';
  const s=Math.floor(t),fr=Math.floor((t-s)*60);$('tc').textContent=`00 : ${String(s).padStart(2,'0')} : ${String(fr).padStart(2,'0')}`;
}
window.seek=render;
function setIcon(){$('p1').setAttribute('width',playing?4.5:0);$('p2').setAttribute('width',playing?4.5:0);}
const q=new URLSearchParams(location.search).get('t');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(q!==null){playing=false;render(+q)}else if(reduce){playing=false;render(3)}else render(0);
function tick(ts){if(playing){if(last!==null){let n=cur+(ts-last)/1000;if(n>DUR)n=0;render(n)}last=ts}else last=null;requestAnimationFrame(tick)}requestAnimationFrame(tick);
$('play').onclick=()=>{playing=!playing;setIcon()};
const sc=$('scrub');let drag=false;const fromE=e=>{const r=sc.getBoundingClientRect();const k=r.width/1891;return Math.max(0,Math.min(DUR,((e.clientX-r.left)/k-X0)/299))};
sc.addEventListener('pointerdown',e=>{drag=true;playing=false;sc.setPointerCapture(e.pointerId);render(fromE(e))});
sc.addEventListener('pointermove',e=>{if(drag)render(fromE(e))});sc.addEventListener('pointerup',()=>{drag=false;setIcon()});
Promise.all([document.fonts.load('600 18px IV'),...['world.webp','world-left.webp','left-world.jpg','bread.png','bread2.png'].map(n=>new Promise(r=>{const a=new Image();a.onload=a.onerror=r;a.src='source-assets/'+n})),new Promise(r=>{if(q!==null&&+q>=3.4){rraw.onload=r;setTimeout(r,1500)}else r()})]).then(()=>setTimeout(()=>{window.__ready=true},60));
})();
</script>
</body></html>
