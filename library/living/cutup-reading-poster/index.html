*{box-sizing:border-box}html,body{margin:0;background:#6f604e}

.p{position:absolute;display:block;background-image:url(source-assets/poster-4096.jpg);background-size:2048px 1536px;background-repeat:no-repeat;transition:transform .18s cubic-bezier(.2,.8,.2,1),filter .18s;will-change:transform}
.p:hover,.p.lift{transform:translateY(-3px) scale(1.5);filter:drop-shadow(0 8px 14px rgba(40,30,60,.38));z-index:5}
.hw:hover,.hw.lift,.hl:hover,.hl.lift{transform:translateY(-2px) scale(1.25)}
.fig:hover,.fig.lift{transform:translateY(-2px) scale(1.25)}

.notes{background:#f6f4f9;padding:32px max(16px,calc(50vw - 400px)) 64px;font:16px/1.55 Georgia,serif;color:#333}.notes h3{margin:0 0 8px;font-size:17px}.notes dl{margin:0;display:grid;grid-template-columns:130px 1fr;gap:6px 12px}.notes dd{margin:0}.notes code{font:13px ui-monospace,Menlo,monospace}.notes p{margin:16px 0 0;font-size:14px;color:#666}

<section class="notes"><h3>可拆</h3><dl>
<dt><code>#sheet</code></dt><dd>纸条：每块是从原作照片裁出的剪报，指针移上去放大来读。首行留空说明它是从段落中间剪下来的。</dd>
<dt><code>#highlight</code></dt><dd>四色荧光笔分工：黄标观点、青标术语、绿标对象、粉标机会；下划线标细节。</dd>
<dt><code>#hand</code></dt><dd>手写评论穿插在纸条之间，绿色笔是第二轮追问。</dd>
<dt><code>#figure</code></dt><dd>论文的四象限图放中央，四周纸条用箭头指回图上具体位置。</dd>
</dl><p>整张是原作照片（只留本机），裁切块的放大是本页加的读取方式，原作是实体海报，没有交互。纯 CSS 的纸条和荧光笔写法看 <a href="rebuilt.html">rebuilt.html</a>。</p></section>
