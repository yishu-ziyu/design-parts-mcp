 n2:{x:495,y:0,h:300,title:'raw sensory data',body:`<div class="fig" style="margin-top:-10px;padding:0 16px 10px"><span class="bx blue" style="display:inline-block;padding:4px 18px">Representation</span><div class="arr" style="font-size:7px">predicts ↓</div><span class="bx blue" style="display:inline-block;padding:11px 22px">Predictive Dynamics</span><div class="arr" style="font-size:7px">informs ↓</div><span class="bx teal" style="display:inline-block;padding:8px 22px;border-radius:14px">Decision / Action</span><div style="height:12px"></div></div><p class="tx">Instead of reacting blindly, a world model maps these raw inputs into a compressed latent space to test counterfactual scenarios internally. This capability shifts artificial intelligence and cognitive systems from reactive pattern-matching toward genuine anticipatory reasoning and planning.</p>`},
 n3:{x:0,y:390,h:270,title:'difference with LLMs?',body:`<div class="bub"><b>difference with LLMs?</b></div><div class="fig" style="padding:10px 18px"><h4>World Models vs LLMs</h4><div class="col"><span class="bx blue">World Model</span><span class="bx olive">Large Language Model</span><span class="bx">Physics and dynamics</span><span class="bx">Linguistic patterns</span><span class="bx">Simulated future states</span><span class="bx">Next token probabilities</span><span class="bx">Spatio-temporal pixels</span><span class="bx">Text and code corpora</span><span class="bx">Action-consequence loops</span><span class="bx">Stateless prompt response</span></div><div class="gold-b">Both have</div></div>`},
 n4:{x:973,y:0,h:509,title:'who are the key players in world models?',body:`<div class="fig" style="margin-top:-7px;padding:0 16px 10px;text-align:left"><div class="who c1"><i></i><b>AMI Labs</b> JEPA and VL-JEPA</div><div class="who c2"><i></i><b>NVIDIA</b> Nvidia Cosmos</div><div class="sublab">APPROACH</div><div class="who c3"><i></i><b>Google DeepMind</b> Generative video &amp; environments</div><div class="who c4"><i></i><b>World Labs</b> Perceiving &amp; reasoning in 3D</div><div class="who c1"><i></i><b>AMI Labs</b> Representation-space prediction</div><div class="who c2"><i></i><b>NVIDIA</b> Physics-grounded engines</div><div class="gold-b" style="margin-top:9px;font-weight:500;padding:7px;line-height:13px"><b>All have</b><br>Moving beyond text-based LLMs · Focus on physics and causality</div></div><p class="tx">The world model landscape is divided between major tech labs scaling infrastructure and specialized startups pioneering new architectures for spatial and physical reasoning.</p><p class="tx" style="padding-left:9px"><b>The Visionaries &amp; Research Labs:</b> Pioneering figures like Fei-Fei Li (World Labs) focus on spatial intelligence to give AI a 3D understanding of the world, while Yann LeCun (AMI Labs) champions the JEPA architecture, which learns physical dynamics without generating raw pixels.</p><p class="tx" style="padding-left:9px"><b>The Scale Players:</b> Google DeepMind develops interactive, generative world simulators like the Genie series, and NVIDIA builds foundational physics and simulation engines (such as Cosmos) to train robotics and autonomous vehicles.</p>`},
 n5:{x:1455,y:0,h:285,title:"what's the world model frontier?",body:`<p class="tx" style="margin-top:-7px">The world model frontier represents a paradigm shift in AI: moving beyond systems that merely pattern-match text or pixels to systems that explicitly learn <b>physics, rules, and causal dynamics</b> of their environment. Instead of just reacting reflexively, a world model has a compressed mental simulator to forecast how future states will unfold given specific actions.</p><p class="tx">Key capabilities defining this frontier include:</p><p class="tx"><b>Latent Space Simulation:</b> Compressing massive sensory data into compact internal states before long-horizon future prediction.</p><p class="tx"><b>Model-Based Reinforcement Learning:</b> Allowing agents and robotic hands to "dream" thousands of trial trajectories before real-world trial and error.</p>`}
};
const C={
 c1:{x:0,y:213,h:467,w:434,title:'Wishbone Chair',body:`<img class="img" src="source-assets/chair-wishbone.jpg" width="190" alt="椅子（原视频截图）"><p class="tx">The Wishbone Chair (CH24), designed by Hans Wegner in 1949, remains a masterpiece of organic minimalism and meticulous craftsmanship. Its steam-bent solid wood backrest and distinctive Y-shaped support combine structural strength with exceptional seating comfort.</p><div class="fig" style="padding:9px"><h4 style="margin-bottom:8px">Anatomy of the Wishbone Chair</h4><div class="col" style="gap:7px"><span class="bx blue" style="text-align:left;font-size:9.6px;padding:5px"><b>1949</b><br><span style="font-size:6.5px">Year Designed</span></span><span class="bx olive" style="background:#e4e0b8;text-align:left;font-size:9.6px;padding:5px"><b>120m</b><br><span style="font-size:6.5px">Cords Required</span></span></div></div>`},
 c2:{x:570,y:0,h:297,w:430,title:'iconic danish chairs',body:`<div class="bub" style="margin-bottom:5px"><b>iconic danish chairs</b></div><div class="fig" style="padding:8px 12px"><h4 style="margin-bottom:7px">Pillars of Danish Modern Seating</h4><div class="col" style="grid-template-columns:1fr 1fr 1fr;gap:5px 14px"><span class="bx blue">Wishbone Chair</span><span class="bx olive">The Egg Chair</span><span class="bx red">Chieftain Chair</span><span class="bx">Hans J. Wegner</span><span class="bx">Arne Jacobsen</span><span class="bx">Finn Juhl</span><span class="bx">1949</span><span class="bx">1958</span><span class="bx">1949</span><span class="bx">Solid wood &amp; paper cord</span><span class="bx">Molded foam &amp; upholstery</span><span class="bx">Exotic wood &amp; leather</span></div><div class="gold-b" style="font-weight:500">All have · Powered the Mid-Century Modern movement</div></div>`},
 c3:{x:1080,y:0,h:526,w:335,title:'The Egg Chair',body:`<img class="img" src="source-assets/chair-egg.jpg" width="290" alt="蛋椅（原视频截图）"><p class="tx">Designed by Arne Jacobsen in 1958 for the SAS Royal Hotel in Copenhagen, The Egg Chair revolutionized lounge seating by using an innovative interior molded foam shell beneath its upholstery rather than traditional heavy wooden framing.</p><div class="fig" style="padding:8px"><h4 style="margin-bottom:7px">Design Innovation vs. Traditional Seating</h4><div class="col"><span class="bx blue">Traditional Chair</span><span class="bx olive">The Egg Chair</span><span class="bx">Rigid wooden frame</span><span class="bx">Organic continuous curves</span><span class="bx">Rectangular and angular</span><span class="bx">Creates a secluded nook</span></div><div class="gold-b">Both have</div></div>`},
 c4:{x:640,y:383,h:560,w:330,title:'Finn Juhl',body:`<img class="img" src="source-assets/chair-finn.jpg" width="240" alt="椅子插画（原视频截图）"><p class="tx" style="text-align:center;color:#8a887f;font-size:7px">Finn Juhl's Chieftain Chair</p><p class="tx">Finn Juhl revolutionized Danish design by treating furniture as free-form modern art rather than strict functional craftsmanship. Unlike his contemporaries who focused on mass production and structural rationalism, Juhl introduced sculptural, organic shapes inspired by modern abstract art.</p>`}

function clear(){nodes.forEach(n=>n.el.remove());nodes=[];wires.innerHTML=''}
function scene(name,noAnim){clear();hello.style.opacity=name==='empty'?1:0;
 if(name==='empty'){cam={x:0,y:0,z:1};apply();return}
 if(name==='world'){const o={};for(const k in W)o[k]=add(W[k]);wire(o.n1,o.n2,'r');wire(o.n1,o.n3,'b');overview(114,64,.55,noAnim);sel(o.n3)}
 if(name==='chairs'){const o={};for(const k in C)o[k]=add(C[k]);wire(o.c2,o.c1,'l');wire(o.c2,o.c3,'r');wire(o.c2,o.c4,'b');overview(30,18,.525,noAnim)}
}
function overview(x,y,z,noAnim){cam={x,y,z};apply(!noAnim)}
function ask(text){const seed=!nodes.length;hello.style.opacity=0;
 const anchor=nodes[nodes.length-1];
 const pos=seed?{x:0,y:0}:{x:anchor.x+(anchor.w||400)+95,y:anchor.y};
 const n=add({x:pos.x,y:pos.y,h:282,title:text,body:`<div class="bub"><b>${text}</b></div><p class="creating">Creating a visual...</p><p class="tx" data-s></p><div data-f style="opacity:0;transition:opacity .4s">${COMP}</div>`});
 if(!seed)wire(anchor,n,'r');focus(n,1.14);cam.y=120-n.y*1.14;apply(true);const el=n.el;stream(el.querySelector('[data-s]'),ANSWER,()=>{el.querySelector('[data-f]').style.opacity=1})}
const form=$('#ask');form.addEventListener('submit',e=>{e.preventDefault();const v=q.value.trim();if(!v)return;q.value='';go.classList.remove('live');ask(v)});
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
q.addEventListener('input',()=>go.classList.toggle('live',!!q.value.trim()));
$('#toggle').onclick=()=>win.classList.toggle('open');
$('#list').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('#list').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));scene(b.dataset.s)});
let drag=null;main.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;sel(null);drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};main.classList.add('grabbing');main.setPointerCapture(e.pointerId)});
main.addEventListener('pointermove',e=>{if(!drag)return;const s=fit.getBoundingClientRect().width/1134;cam.x=drag.cx+(e.clientX-drag.x)/s;cam.y=drag.cy+(e.clientY-drag.y)/s;apply()});
main.addEventListener('pointerup',()=>{drag=null;main.classList.remove('grabbing')});
main.addEventListener('wheel',e=>{e.preventDefault();const r=main.getBoundingClientRect(),s=r.width/main.offsetWidth,mx=(e.clientX-r.left)/s,my=(e.clientY-r.top)/s;const z=Math.max(.3,Math.min(1.6,cam.z*Math.exp(-e.deltaY*.0015)));cam.x=mx-(mx-cam.x)*z/cam.z;cam.y=my-(my-cam.y)*z/cam.z;cam.z=z;apply()},{passive:false});
const p=new URLSearchParams(location.search);
scene('empty',true);
const S=p.get('s');if(S==='world'){scene('world',true)}
if(S==='focus'){scene('world',true);const n=nodes[3];cam={x:249-973*1.245,y:104,z:1.245};nodes[3].el.querySelector('.scroll').style.paddingTop='7px';apply();n.el.querySelector('.scroll').scrollTop=0;q.value="what's the world model fronit";go.classList.add('live')}
if(S==='chairs'){win.classList.add('open');scene('chairs',true);$('#list').querySelectorAll('button')[3].classList.add('on')}
window.__ask=ask;
})();
</script>
