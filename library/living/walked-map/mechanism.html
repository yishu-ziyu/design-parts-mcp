<dt><code>#sheet</code></dt><dd>点地图上的地点：地图移动让地点靠上，底部卡片弹起，贴纸压在照片左下角，标签压在右上角。</dd>
<dt><code>#sky</code></dt><dd>开场从夜到白天：天空和地面亮度一起变，角色从剪影亮起，最后才出标题和按钮。</dd>
<dt><code>#chat</code></dt><dd>消息逐条进入，整列向上顶，头像和名字固定在顶部。</dd>
<dt><code>#track</code></dt><dd>城市卡片一屏一张，两侧露出相邻卡片；地图先空着，再逐个弹出贴纸，最后出一句总结。</dd>
