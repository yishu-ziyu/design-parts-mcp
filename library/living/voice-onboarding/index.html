<style>
@font-face{font-family:Inter;src:url(fonts/InterVariable-latin.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"EB Garamond";src:url(fonts/EBGaramond-latin-var.woff2) format("woff2");font-weight:400 600;font-display:block}
:root{--ink:#1f1d19;--orange:#e44914;--bg:#e6e5e1;--paper:#fdfdfc;--theme:#f1d16d;--tint:#f8e6ae;--on:#2b2612;--onsub:#5b5128;--done:#1f1d19;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/21px Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:grid;place-items:center;padding:0}
#stage{position:relative;width:1080px;height:1080px;max-width:100%;overflow:hidden;background:var(--bg)}

#q{position:absolute;left:21px;top:21px;width:340px;font:400 33px/33.500px "EB Garamond",serif;letter-spacing:-.012em;transition:opacity .28s,filter .28s,translate .28s}

#ctrl{position:absolute;left:0;right:0;bottom:41px;height:68px;z-index:3;pointer-events:auto}

.t:last-child{border:0}.t b{font-weight:600}.t span{color:#55534d}.t:hover,.t.press{background:#ecebe6}
#next{position:absolute;left:19px;top:772px;width:358px;height:55px;border-radius:28px;background:var(--ink);color:#fff;border:0;font:600 16.500px Inter;cursor:pointer}

#scrim{position:absolute;inset:0;background:rgba(20,18,14,.32);opacity:0;pointer-events:none;transition:opacity .3s;z-index:7}

.open #scrim{opacity:1;pointer-events:auto}.open #sheet{translate:0 0}
#sheet u{position:absolute;left:180px;top:7px;width:36px;height:4px;border-radius:2px;background:#d9d8d2}
#sheet h3{position:absolute;left:20px;top:31px;margin:0;font:600 19px/26px Inter;letter-spacing:-.01em}
#done{position:absolute;right:22px;top:33px;border:0;background:none;font:600 16.500px/22px Inter;color:#55534d;cursor:pointer;padding:0}
.st{position:absolute;left:20px;width:356px;height:71px;border-radius:15px;background:#f6f5f3;box-shadow:inset 0 0 0 1px #e4e3de;padding:16px 17px}
.st b{display:block;font:500 16.500px/20px Inter}.st small{display:block;font:400 12.500px/16px Inter;color:#77756f;margin-top:1px}
.st button{position:absolute;top:16px;width:38px;height:38px;border-radius:50%;background:#fdfdfc;box-shadow:0 0 0 1px #d4d3cd;border:0;font:500 18px Inter;color:var(--ink);cursor:pointer;padding:0}
.st .m{left:214px}.st .p{left:302px}.st output{position:absolute;left:252px;width:50px;top:21px;text-align:center;font:500 21px/28px Inter}
#touch{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(150,150,145,.32);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 1px 3px #0002;pointer-events:none;opacity:0;z-index:20;transition:opacity .2s}
#stage>h3,#stage>dl{display:none}
footer{width:1080px;max-width:100%;padding:32px 24px 60px;color:#55534d;font:400 14px/22px Inter}footer h3{font-size:15px;color:var(--ink);margin:0 0 8px}footer dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:6px 12px}footer dd{margin:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 <section id="card"><div id="q"></div><div id="h"></div></section>

<footer><h3>可拆</h3><dl>

<script>
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
// 主题：取色自原视频逐题采样。done 是已完成项用的颜色，tint 是高亮底色
const T={yellow:{bg:'#f1d16d',on:'#2b2612',sub:'#5e5426',tint:'#f7e3a4',done:'#6b5a10'},olive:{bg:'#5b622f',on:'#f1eecb',sub:'#cfd0ab',tint:'#e1e6b8',done:'#4a5126'},orange:{bg:'#e44914',on:'#fbe4d4',sub:'#fbcdb4',tint:'#f7d3c2',done:'#c43c0f'},plum:{bg:'#522534',on:'#f4e4df',sub:'#d8bfc2',tint:'#f0d7dc',done:'#522534'},black:{bg:'#1f1d19',on:'#f3f1ea',sub:'#c6c4bd',tint:'#e6e4dd',done:'#1f1d19'},moss:{bg:'#6d7344',on:'#f1eecb',sub:'#d8d9b6',tint:'#dfe6bb',done:'#5a6134'}};
// [文字, 主题, 名称, 值的累积]。[[…]] 标记关键词，{n} 表示此时把第 n 个值加上
const Q=[
{t:'Who is in your<br>household?',h:'Tell us about partners, kids, roommates,<br>or anyone else at home.',c:'yellow',n:'Household',v:['2 adults, 1 kid'],s:'Um, so it’s [[me, my partner, and our son.]]{0} He’s six, so he’s in a pretty picky phase right now.'},
{t:'Are there any<br>dietary restrictions<br>to be aware of ?',h:'Tell us about allergies or diets like<br>vegetarian, gluten-free, or halal.',c:'olive',n:'Diet',v:['Gluten-free (partner)','Not too spicy'],s:'Hmm, nothing too strict. My [[partner is gluten-free,]]{0} so we’re always checking labels. And [[nothing too spicy]]{1} because of the little one.'},
{t:'What are your<br>household’s priorities<br>when cooking?',h:'Tell us about time, budget, leftovers,<br>or eating healthier.',c:'orange',n:'Priorities',v:['Quick weeknights','Leftovers'],s:'Honestly, during the week [[it has to be quick,]]{0} like thirty minutes tops. And [[we love leftovers for lunch,]]{1} so bigger batches are always good.'},
{t:'What cuisines does your<br>household like to cook?',h:'Tell us about the regions or dishes<br>you make most.',c:'plum',n:'Cuisines',v:['Japanese','Mexican','Italian'],s:'We cook a lot of [[Japanese.]]{0} Like rice bowls and stuff. [[Mexican]]{1} too. And [[Italian]]{2} when we want something cozy.'},
{t:'Which ingredients<br>does your household<br>like most?',h:'Tell us about the proteins, vegetables,<br>and flavors you love.',c:'black',n:'Likes',v:['Chicken thighs','mushrooms','leeks'],s:'Oh, [[chicken thighs,]]{0} for sure, we have those all the time. And I’ll put [[mushrooms]]{1} in basically anything. Oh, and [[leeks,]]{2} I’ve been really into leeks lately.'},
{t:'Which ingredients<br>does your household<br>dislike most?',h:'Tell us about anything someone won’t eat.',c:'yellow',n:'Dislikes',v:['Olives','cilantro'],s:'I can’t do [[olives.]]{0} Like, at all. And my partner thinks [[cilantro]]{1} tastes like soap.'},
{t:'What resources does<br>your household<br>use to find recipes?',h:'Tell us about the sites, magazines,<br>or accounts you use.',c:'moss',n:'Resources',v:['NYT Cooking','Bon Appétit'],s:'Mostly [[NYT Cooking.]]{0} I’m on there all the time. And I get the [[Bon Appétit]]{1} newsletter, so stuff from that.'},
{t:'Which chefs does<br>your household<br>like to cook from?',h:'Tell us about cookbook authors,<br>TV chefs, or food creators.',c:'orange',n:'Chefs',v:['Samin Nosrat','Yotam Ottolenghi'],s:'Oh, [[Samin Nosrat.]]{0} We cook out of her book a lot. And [[Ottolenghi]]{1} when I have more time.'},
{t:'Where are your<br>household’s<br>recipes saved?',h:'Tell us about apps, notes, screenshots,<br>or cookbooks.',c:'plum',n:'Saved in',v:['Screenshots','Notes app','Pinterest'],s:'Honestly? All over the place. I [[screenshot]]{0} a lot, so those, and some are in my [[Notes app,]]{1} and then a bunch on [[Pinterest]]{2} from a while ago.'}];
const SUM=[['Household','2 adults, 1 kid'],['Diet','Gluten-free (partner), Not too spicy'],['Priorities','Quick weeknights, Leftovers'],['Cuisines','Japanese, Mexican, Italian'],['Likes','Chicken thighs, Mushrooms, Leeks'],['Dislikes','Olives, Cilantro'],['Resources','NYT Cooking, Bon Appétit'],['Chefs','Samin Nosrat, Yotam Ottolenghi'],['Saved in','Screenshots, Notes app, Pinterest']];
const PAUSE='<svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><rect x="1" y="0" width="5" height="16" rx="1" fill="#fff"/><rect x="8" y="0" width="5" height="16" rx="1" fill="#fff"/></svg>',
MIC='<svg width="18" height="24" viewBox="0 0 18 24" fill="none" aria-hidden="true"><rect x="5" y="1" width="8" height="14" rx="4" fill="#fff" opacity=".8"/><path d="M1.500 11a7.500 7.500 0 0 0 15 0M9 18.500V23" stroke="#fff" stroke-width="1.800" stroke-linecap="round" opacity=".85"/></svg>';
const ring=p=>{const C=2*Math.PI*9.500;return `<circle cx="11" cy="11" r="9.500" fill="none" stroke="#cfcec8" stroke-width="1.600"/>${p>0?`<circle cx="11" cy="11" r="9.500" fill="none" stroke="var(--ink)" stroke-width="1.800" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 11 11)"/>`:''}`};
const CHECK='<circle class="f" cx="11" cy="11" r="11"/><path d="M6.500 11.300l3 3 6-6.500" fill="none" stroke="#fff" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"/>';
let cur=0,run=0,timers=[],done=[];
const later=(f,ms)=>{const id=setTimeout(f,reduce?Math.min(ms,1):ms);timers.push(id);return id};
function theme(q){const t=T[q.c],r=document.documentElement.style;r.setProperty('--theme',t.bg);r.setProperty('--on',t.on);r.setProperty('--onsub',t.sub);r.setProperty('--tint',t.tint);r.setProperty('--done',t.done)}
function words(s){ // 拆成 {w,mark,val}
 const out=[];let inM=false;s.split(' ').forEach(tok=>{let val=null;const m=tok.match(/\{(\d)\}/);if(m){val=+m[1];tok=tok.replace(m[0],'')}
  const open=tok.includes('[['),close=tok.includes(']]');tok=tok.replace('[[','').replace(']]','');if(open)inM=true;out.push({w:tok,mark:inM,val,end:close});if(close)inM=false});return out}
function place(){ // 文本区在问题卡和列表之间居中，略偏上
 const say=$('#say'),midTop=317,listTop=$('#list').getBoundingClientRect().top-$('#screen').getBoundingClientRect().top;
 const h=Math.min(say.querySelector('.in').offsetHeight,90);say.style.top=((listTop-midTop)-h)/2-12+'px'}
function renderSay(ws,n){let html='',open=false,spoken=false;for(let i=0;i<n;i++){const w=ws[i];const age=n-1-i;const cl=age<2?'new':age<4?'mid':'';
  if(w.mark&&!open){const end=ws.findIndex((x,j)=>j>=i&&x.end);const complete=end>-1&&end<n;html+=`<mark class="${complete?'':'off'}">`;open=true}
  html+=`<span class="w ${cl}">${w.w}</span>`;if(open&&w.end){html+='</mark>';open=false}html+=i<n-1?' ':''}
 if(open)html+='</mark>';html+='<span id="caret"></span>';const inn=$('#say .in');inn.innerHTML=html;
 const over=inn.offsetHeight-90;inn.style.marginTop=(over>0?-over:0)+'px';place()}
function listRender(){$('#stack').innerHTML=done.map((d,i)=>`<div class="row" style="opacity:${i<done.length-4?0:1}"><svg class="ic" viewBox="0 0 22 22">${CHECK}</svg><b>${d.n}</b><span>${d.v}</span></div>`).join('')}
function setCur(n,v,p){$('#curn').textContent=n;$('#curv').textContent=v||'';$('#curic').innerHTML=p>=1?CHECK:ring(p);$('#curv').style.alignSelf='start';const two=$('#curv').offsetHeight>25;$('#cur').classList.toggle('tall',two);
 const cs=$('#cur').offsetHeight;$('#list').style.bottom=(143+cs+7)+'px';place()}
function ask(i,opt={}){cur=i;const q=Q[i];theme(q);$('#q').innerHTML=q.t;$('#h').innerHTML=q.h;$('#say .in').innerHTML='<span id="caret"></span>';$('#say .in').style.marginTop='0';setCur(q.n,'',0);listRender();place()}
function fill(q,ws,n){const got=ws.slice(0,n).filter(w=>w.val!==null).map(w=>w.val);if(!got.length)return '';const last=q.v.slice(0,Math.max(...got)+1);return last.join(', ')}
function speak(i){const my=++run;ask(i);const q=Q[i],ws=words(q.s);const per=reduce?1:300;let n=0;
 const step=()=>{if(my!==run)return;n++;renderSay(ws,n);const p=n/ws.length;setCur(q.n,fill(q,ws,n),p*.98);
  if(n<ws.length){later(step,per+((n%5===0)?120:0))}else later(finish,800)};
 const finish=()=>{if(my!==run)return;setCur(q.n,q.v.join(', '),1);$('#cur b').style.color='var(--done)';later(()=>{if(my!==run)return;$('#screen').classList.add('swap');
   later(()=>{if(my!==run)return;done.push({n:q.n,v:q.v.join(', ')});$('#cur b').style.color='';$('#screen').classList.remove('swap');if(i+1<Q.length)speak(i+1);else summary()},300)},700)};
 later(step,500)}
function buildSum(){$('#tbl').innerHTML=SUM.map(([a,b])=>`<button class="t"><b>${a}</b><span>${b}</span></button>`).join('')}
function summary(){$('#ctrl').classList.add('idlewave');$('#sum').classList.add('on');$('#tbl').querySelectorAll('.t').forEach((t,j)=>t.onclick=()=>openSheet(j))}
function openSheet(j){$('#sh').textContent=SUM[j][0];$('#screen').classList.add('open')}
$('#done').onclick=()=>{$('#screen').classList.remove('open');const a=$('#oa').textContent,k=$('#ok').textContent;SUM[0][1]=`${a} adult${a=='1'?'':'s'}, ${k} kid${k=='1'?'':'s'}`;buildSum();summary()};
document.querySelectorAll('.st button').forEach(b=>b.onclick=()=>{const o=b.dataset.k=='a'?$('#oa'):$('#ok');o.textContent=Math.max(0,+o.textContent+ +b.dataset.d)});
function clearAll(){timers.forEach(clearTimeout);timers=[];run++}
function start(){clearAll();done=[];$('#sum').classList.remove('on');$('#screen').classList.remove('open');$('#ctrl').classList.remove('idlewave');$('#btn').classList.remove('idle');$('#btn').innerHTML=PAUSE;$('#btn').setAttribute('aria-label','Pause');speak(0)}
function reset(){clearAll();done=[];$('#ctrl').classList.add('idlewave');$('#btn').classList.add('idle');$('#btn').innerHTML=MIC;$('#btn').setAttribute('aria-label','Start talking');$('#sum').classList.remove('on');ask(0);$('#say .in').innerHTML=''}
$('#btn').onclick=()=>{$('#btn').classList.contains('idle')?start():reset()};
buildSum();reset();
// 核对用：跳到第 i 题第 n 个词；不影响正常使用
window.__jump=(i,n)=>{clearAll();$('#ctrl').classList.remove('idlewave');$('#btn').classList.remove('idle');$('#btn').innerHTML=PAUSE;done=Q.slice(0,i).map(q=>({n:q.n,v:q.v.join(', ')}));ask(i);const q=Q[i],ws=words(q.s);if(n){renderSay(ws,n);setCur(q.n,fill(q,ws,n),n/ws.length)}};
const scr=$('#screen'),touch=$('#touch');scr.addEventListener('pointerdown',e=>{const r=scr.getBoundingClientRect();touch.style.left=e.clientX-r.left-26+'px';touch.style.top=e.clientY-r.top-26+'px';touch.style.opacity=1});addEventListener('pointerup',()=>touch.style.opacity=0);
window.__sum=()=>{clearAll();$('#sum').classList.add('on');summary()};
</script></body></html>
