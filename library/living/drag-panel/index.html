<h1>跟手阅读面板</h1><p>从原有阅读标本提炼的原生 JavaScript 零件。此目录是正式源码；原标本保持不变。本地预览，尚未公开发布。</p>
<iframe src="example.html?lang=zh" title="跟手阅读面板的实际源码预览"></iframe>
<p>通过 HTTP 打开本页。示例与分发使用同一份源码，不包含外部字体、图片或运行时依赖。</p>
<h2>使用范围</h2><p>适合页面区域内的两段式阅读、详情面板。不是模态弹层，没有焦点约束、页面滚动锁定或真实手机验收。</p>
<h3>可拆</h3><dl><dt><code id="panel">#panel</code></dt><dd>Pointer Events 跟手；松手速度投影 0.499 秒；弹簧刚度 490、阻尼 42；回弹可打断；键盘操作即时切换；减少动态效果时不播放回弹。</dd></dl>
