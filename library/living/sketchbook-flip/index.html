<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketchbook Flip</title>
<style>
:root{--accent:#4a2fd0;--dim:#8b8b88;--ghost:#e1e2f2;--ease:cubic-bezier(.7,0,.25,1);--tri:"Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:#0e0e0e;font-family:var(--tri);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sbx{position:absolute;z-index:30;top:16px;right:20px;padding:6px;font:300 22px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#8d8d8d}.sbx:hover{color:#555}
#lib{position:fixed;inset:0;overflow:hidden;--edge:6px}
#libview{position:absolute;z-index:30;top:16px;left:20px;display:flex;gap:4px}
#libview button{width:24px;height:24px;padding:4px;color:var(--dim);transition:color .2s}#libview button:hover,#libview button[aria-pressed=true]{color:var(--accent)}
#libview svg{display:block;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#car,#shelf{position:absolute;inset:0;transition:opacity .35s ease,visibility 0s linear 0s}
#car.off,#shelf.off{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease,visibility 0s linear .35s}
#car{--W:min(58vw,1120px);--R:106vh;--cx:calc(38% + var(--R))}
#car::before,#car::after{content:"";position:absolute;left:0;right:0;height:8vh;z-index:20;pointer-events:none}
#car::before{top:0;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0))}#car::after{bottom:0;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.6))}
.ci{position:absolute;width:calc(var(--W)*var(--kk));aspect-ratio:var(--a);left:calc(var(--cx) - var(--W)*var(--kk)/2);top:calc(50% - var(--W)*var(--kk)/var(--a)/2);
 transform:rotate(calc(var(--th,0deg)*-1)) translateX(calc(var(--R)*-1)) rotate(calc(var(--th,0deg) + var(--abs)*6.5deg - var(--off)*3.5deg)) scale(calc(1 - var(--abs)*.05));opacity:calc(1.6 - var(--abs)*.6);z-index:calc(10 - var(--abs));cursor:pointer;transition:transform 1s var(--ease),opacity .6s ease}
.ci.far{opacity:0;pointer-events:none}.ci.jump{transition:none}
#titles{position:absolute;inset:0;margin:0;padding:0;list-style:none;pointer-events:none}
#titles li{position:absolute;right:var(--edge);top:50%;translate:0 -50%;text-align:right;transform:translateY(calc(var(--ty,0)*1px));pointer-events:auto;cursor:pointer;white-space:nowrap;font-weight:600;letter-spacing:-.03em;line-height:1.16;font-size:clamp(22px,2.6vw,44px);color:var(--ghost);user-select:none;transition:transform 1s var(--ease),color .16s linear,opacity 1s var(--ease)}
#titles li.on{color:#9488ea}#titles li.far{opacity:0;pointer-events:none}#titles li.jump{transition:none}
#arrows{position:absolute;z-index:30;left:24px;top:50%;translate:0 -50%;display:flex;flex-direction:column;gap:14px}
#arrows button{width:36px;height:36px;border-radius:4px;background:#ece9fc;color:#7c6ce8;display:grid;place-items:center;transition:color .2s,background .2s}#arrows button:hover{background:#e0dbfa;color:var(--accent)}
#arrows svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* book */
.bk{position:absolute;inset:0;perspective:2600px;--rad:0px}
.bk .pg{position:absolute;top:0;bottom:0;width:50%;background-size:100% 100%;background-color:#f1ece1}
.bk .l{left:0;border-radius:var(--rad) 0 0 var(--rad)}.bk .r{right:0;border-radius:0 var(--rad) var(--rad) 0}
.bk .sh{position:absolute;inset:0;border-radius:var(--rads);box-shadow:0 18px 44px -8px rgba(40,36,48,.14),0 3px 8px rgba(40,36,48,.08);pointer-events:none}
.bk .band{position:absolute;left:100%;top:21.9%;width:11.7%;height:55.7%;pointer-events:none}
.leaf{position:absolute;left:50%;top:0;height:100%;transform-style:preserve-3d;transform-origin:0 50%;pointer-events:none}
.st{position:absolute;left:0;top:0;height:100%;transform-style:preserve-3d;transform-origin:0 50%}
.st>.a,.st>.b{position:absolute;inset:0;backface-visibility:hidden;background-repeat:no-repeat;background-color:#f1ece1}.st>.b{transform:rotateY(180deg)}
.st i{position:absolute;inset:0;background:#2b2520;opacity:0}
/* reader */
#read{position:fixed;inset:0;z-index:100;background:#fff;opacity:0;transition:opacity .25s ease-out}#read.on{opacity:1}#read[hidden]{display:none}
#all{position:absolute;z-index:3;top:16px;left:20px;height:34px;font-weight:300;font-size:14px;letter-spacing:.02em;color:#a6a6a3;transition:color .2s}#all:hover{color:var(--accent)}
#stage{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(48vw,calc((100vh - 300px)*var(--a,2)));aspect-ratio:var(--a,2);cursor:grab;touch-action:none;user-select:none;transition:transform .7s var(--ease)}
#stage:active{cursor:grabbing}
#dial{position:absolute;left:96px;top:50%;translate:0 -50%;display:flex;flex-direction:column;gap:9px;padding:6px 18px 6px 0;cursor:ns-resize;touch-action:none}
#dial span{display:block;width:13px;height:2px;background:#dcdcda;transition:width .2s,background .2s}#dial span.on{width:22px;background:#111}
#caps{position:absolute;left:0;top:calc(100% + 47px);width:100%;display:flex;justify-content:space-between;gap:24px;font-size:14px;line-height:21px;opacity:1;transition:opacity .2s}
#caps b{display:block;font-weight:600;font-size:15px;letter-spacing:.03em}#caps i{font-style:normal;font-weight:300;font-size:15.5px;letter-spacing:.03em;color:#6f6f6c;display:block}#caps .d{font-weight:300;font-size:15.5px;letter-spacing:.03em;color:#6f6f6c;text-align:right;max-width:46%}
/* shelf */
#shelf{display:flex;overflow-y:auto;padding:4.6rem clamp(1.5rem,6vw,5rem) 3rem}
#grid{flex:1;display:flex;flex-wrap:wrap;align-items:flex-end;align-content:center;justify-content:center;gap:2.4rem 2.8rem}
.gi{display:block;position:relative;perspective:750px;cursor:pointer}
.gb{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .25s cubic-bezier(.22,1,.36,1)}
.gb .bc{position:absolute;inset:0;transform:translateZ(-9px);box-shadow:0 10px 22px rgba(0,0,0,.18);background:#222}
.gb .pb{position:absolute;top:1.5%;bottom:1.5%;left:4%;right:1%;transform:translateZ(-4px);background:linear-gradient(to right,#e9e6e0,#fbfaf6 22%,#f4f2ec 96%,#dedacf) ;border-radius:0 3px 3px 0;overflow:hidden;background-size:cover;transition:right .25s cubic-bezier(.22,1,.36,1)}
.gi:hover .pb,.gi:focus-visible .pb{right:-3.5%}
.gb .fr{position:absolute;inset:0;transform:translateZ(1px);transform-origin:left center;transition:transform .3s cubic-bezier(.22,1,.36,1);box-shadow:0 2px 6px rgba(0,0,0,.12);background-size:cover;transform-style:preserve-3d;backface-visibility:hidden}
.gi:hover .fr,.gi:focus-visible .fr{transform:translateZ(1px) rotateY(-34deg)}
#after{position:fixed;left:-9999px}
@media (max-width:820px){#car{--W:96vw;--R:70vh;--cx:calc(47% + var(--R))}#arrows,#titles,#libview{display:none}#dial{left:6px}#stage{width:92vw}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style></head><body>
<div id="lib">
 <button class="sbx" id="libx" aria-label="Back to the wheel">×</button>
 <div id="libview" role="group" aria-label="Library view"><button data-v="wheel" aria-label="Wheel" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 2h18"/><rect width="18" height="12" x="3" y="6" rx="2"/><path d="M3 22h18"/></svg></button><button data-v="shelf" aria-label="Shelf" aria-pressed="false"><svg viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></button></div>
 <div id="car"><div id="books"></div><ol id="titles"></ol><div id="arrows"><button data-d="-1" aria-label="Previous sketchbook"><svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button><button data-d="1" aria-label="Next sketchbook"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg></button></div></div>
 <div id="shelf" class="off"><div id="grid"></div></div>
</div>
<div id="read" hidden role="dialog" aria-modal="true" aria-label="Sketchbook"><button class="sbx" id="rx" aria-label="Close">×</button><button id="all">View all</button><div id="dial" role="slider" tabindex="0" aria-label="Spread"></div><div id="stage"><div id="caps"><div><b id="c1"></b><i id="c2"></i></div><div class="d" id="c3"></div></div></div></div>
<section id="after"><h3>可拆</h3><dl>
 <dt><code>#car</code></dt><dd>素描本转盘：书沿圆心在屏幕右外的大圆走，前后各露半本，右侧淡色书名跟着转。</dd>
 <dt><code>#shelf</code></dt><dd>书架视图：按真实纸张比例排列封面，底部对齐；悬停时封面翻开 34 度露出内页。</dd>
 <dt><code>#stage</code></dt><dd>阅读器里的书：拖动翻页，纸沿竖条分段弯曲，手放开后按进度完成或退回。</dd>
 <dt><code>#dial</code></dt><dd>竖向刻度：每个跨页一格，按住上下拖就逐页翻过去。</dd>
</dl></section>
<script src="art.js"></script>
<script>
const $=id=>document.getElementById(id),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* cover ratios and paper areas measured from the original library; book names genericised */
const BOOKS=[
 {id:'handy',seed:2,title:'Handy Notebook',coverA:.669,pixels:13490,start:1},
 {id:'travel',seed:5,title:'Travel',coverA:1,pixels:10404,band:1,rad:14,start:3},
 {id:'fy',seed:1,title:'First Year',coverA:.676,pixels:29820,dark:1,start:0},
 {id:'d3',seed:3,title:'Design 3',coverA:.724,pixels:31920,dark:1,start:0},
 {id:'d1',seed:4,title:'Design 1',coverA:.756,pixels:30552,dark:1,start:0}];
const most=Math.max(...BOOKS.map(b=>b.pixels));
BOOKS.forEach(b=>{b.pageA=b.coverA;b.a=2*b.coverA;b.k=Math.sqrt(.42*Math.sqrt(b.pixels/most)*b.a);b.spread=b.start;b.n=SPREAD_DATA[b.id].n;b.caps=SPREAD_DATA[b.id].caps});
/* one book on the page: two static sides plus, while turning, a bent leaf */
function mkBook(book,host,opts={}){const el=document.createElement('div');el.className='bk';el.style.setProperty('--rad',book.rad?'6.1%':'0');el.style.setProperty('--rads',book.rad?'3.05%/6.1%':'0');
 el.innerHTML=`<div class="sh"></div><div class="pg l"></div><div class="pg r"></div>${book.band?'<img class="band" src="source-assets/band.png" alt="">':''}`;
 host.appendChild(el);const L=el.querySelector('.l'),R=el.querySelector('.r');
 const api={el,book,s:book.spread,set(s){this.s=s;[2*s-2,2*s-1,2*s+2,2*s+3].forEach(i=>{if(i>=0)new Image().src=pageURL(book,i)});L.style.backgroundImage=`url(${pageURL(book,2*s)})`;R.style.backgroundImage=`url(${pageURL(book,2*s+1)})`},
  leaf:null,
  beginTurn(dir){const s=this.s,N=12,W=el.clientWidth/2,sw=W/N+.4;const fr=dir>0?2*s+1:2*s-1,bk=dir>0?2*s+2:2*s;const urlF=pageURL(book,fr),urlB=pageURL(book,bk);
   L.style.backgroundImage=`url(${pageURL(book,dir>0?2*s:2*s-2)})`;R.style.backgroundImage=`url(${pageURL(book,dir>0?2*s+3:2*s+1)})`;
   const leaf=document.createElement('div');leaf.className='leaf';let par=leaf;const strips=[];for(let i=0;i<N;i++){const st=document.createElement('div');st.className='st';st.style.width=sw+'px';if(i)st.style.left=(W/N)+'px';
    st.innerHTML=`<div class="a" style="background-image:url(${urlF});background-size:${W}px 100%;background-position:${-i*W/N}px 0"><i></i></div><div class="b" style="background-image:url(${urlB});background-size:${W}px 100%;background-position:${-(N-1-i)*W/N}px 0"><i></i></div>`;par.appendChild(st);par=st;strips.push(st)}
   el.appendChild(leaf);this.leaf={leaf,strips,dir,s,N}},
  pose(p){const f=this.leaf;if(!f)return;const A=78*Math.sin(Math.PI*p),th=p*180;f.leaf.style.transform=`rotateY(${-th}deg)`;const b=A/f.N;f.strips.forEach((st,i)=>{st.style.transform=i?`rotateY(${b}deg)`:'none';const local=th-b*i,sh=Math.abs(Math.sin(local*Math.PI/180));st.querySelectorAll('i').forEach(x=>x.style.opacity=(sh*.2).toFixed(3))})},
  endTurn(p){const f=this.leaf;if(!f)return;f.leaf.remove();this.leaf=null;const ns=f.dir>0?(p>.5?f.s+1:f.s):(p>.5?f.s:f.s-1);this.set(ns);book.spread=ns;return ns}};
 api.set(book.spread);return api}
/* wheel */
const n=BOOKS.length;let cur=1;const items=BOOKS.map((b,i)=>{const it=document.createElement('div');it.className='ci';it.style.setProperty('--a',b.a);it.style.setProperty('--kk',b.k);$('books').appendChild(it);const li=document.createElement('li');li.textContent=b.title;$('titles').appendChild(li);
 let down=null;it.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);it.addEventListener('pointerup',e=>{if(!down)return;if(Math.hypot(e.clientX-down[0],e.clientY-down[1])<6)pick(i);down=null});li.addEventListener('click',()=>pick(i));
 return{it,li,b,api:null}});
function offset(i){let d=i-cur;d=((d%n)+n)%n;if(d>n/2)d-=n;return d}
function layout(){items.forEach((t,i)=>{const o=offset(i),abs=Math.abs(o),prev=t.o;if(prev!==undefined&&Math.abs(o-prev)>2){t.it.classList.add('jump');t.li.classList.add('jump');void t.it.offsetWidth}else{t.it.classList.remove('jump');t.li.classList.remove('jump')}t.o=o;
  t.it.style.setProperty('--off',o);t.it.style.setProperty('--abs',abs);t.it.style.setProperty('--th',(o>0?o*27.4:o*25.5)+'deg');t.it.classList.toggle('far',abs>1);t.li.classList.toggle('far',abs>1);t.li.classList.toggle('on',o===0);t.li.style.setProperty('--ty',o*396*Math.min(1,innerHeight/962));
  if(abs<=1&&!t.api)t.api=mkBook(t.b,t.it)})}
function turnWheel(d){cur=(cur+d+n)%n;layout()}
function pick(i){if(offset(i)===0)openReader(BOOKS[i],items[i].it);else{cur=i;layout()}}
$('arrows').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b)turnWheel(+b.dataset.d)});
let wheelLock=0;$('car').addEventListener('wheel',e=>{e.preventDefault();const t=performance.now();if(t<wheelLock||Math.abs(e.deltaY)<8)return;wheelLock=t+520;turnWheel(Math.sign(e.deltaY))},{passive:false});
addEventListener('keydown',e=>{if(!$('read').hidden){if(e.key==='ArrowRight'||e.key==='ArrowDown')step(1);if(e.key==='ArrowLeft'||e.key==='ArrowUp')step(-1);if(e.key==='Escape')closeReader();return}if(e.key==='ArrowDown')turnWheel(1);if(e.key==='ArrowUp')turnWheel(-1);if(e.key==='Enter'&&!$('car').classList.contains('off'))pick(cur)});
layout();
/* shelf: sizes are the original's px at a 1495 wide window */
const SIZE={fy:[142,210],d3:[152,210],d1:[152,201],handy:[102,142],travel:[102,102]},ORDER=['fy','d3','d1','handy','travel'];
$('grid').innerHTML=ORDER.map(id=>{const b=BOOKS.find(x=>x.id===id),[w,h]=SIZE[id];return`<button class="gi" data-id="${id}" aria-label="Open ${b.title}" style="width:${w}px;height:${h}px"><span class="gb"><span class="bc"></span><span class="pb" style="background-image:url(${pageURL(b,1,220)})"></span><span class="fr" style="background-image:url(${coverURL(b)});${b.rad?'border-radius:0 5px 5px 0':''}"></span></span></button>`}).join('');
$('grid').addEventListener('click',e=>{const g=e.target.closest('.gi');if(g)openReader(BOOKS.find(x=>x.id===g.dataset.id),g)});
function setView(v){$('car').classList.toggle('off',v!=='wheel');$('shelf').classList.toggle('off',v!=='shelf');[...$('libview').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))}
$('libview').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)setView(b.dataset.v)});$('libx').onclick=()=>setView('wheel');
/* reader */
let rb=null,book=null,busy=false;
function maxS(){return book.n-1}
function markDial(){[...$('dial').children].forEach((s,i)=>s.classList.toggle('on',i===rb.s));const c=book.caps[rb.s]||[];$('c1').textContent=c[0]||'';$('c2').textContent=c[1]||'';$('c3').textContent=c[2]||'';$('dial').setAttribute('aria-valuenow',rb.s)}
function openReader(b,from){book=b;const r=$('read');r.hidden=false;$('stage').style.setProperty('--a',b.a);$('dial').innerHTML=Array.from({length:b.n},()=>'<span></span>').join('');rb&&rb.el.remove();rb=mkBook(b,$('stage'),{});$('stage').insertBefore(rb.el,$('caps'));markDial();const st=$('stage');
 const a=from.getBoundingClientRect();st.style.transition='none';const s=st.getBoundingClientRect();st.style.transform=`translate(${a.left+a.width/2-s.left-s.width/2}px,${a.top+a.height/2-s.top-s.height/2}px) scale(${a.width/s.width})`;void st.offsetWidth;requestAnimationFrame(()=>{r.classList.add('on');st.style.transition='';st.style.transform='none'})}
function closeReader(){$('read').classList.remove('on');setTimeout(()=>{$('read').hidden=true;items.forEach(t=>t.api&&t.api.set(t.b.spread))},reduce?0:260)}
$('rx').onclick=closeReader;$('all').onclick=closeReader;
function run(from,to,ms,done){if(reduce||ms<20){done();return}const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;rb.pose(from+(to-from)*e);if(k<1)requestAnimationFrame(f);else done()})(t0)}
function step(d,ms=620,then){if(busy||!rb)return;const s=rb.s;if((d>0&&s>=maxS())||(d<0&&s<=0))return;busy=true;rb.beginTurn(d);rb.pose(d>0?0:1);run(d>0?0:1,d>0?1:0,ms,()=>{rb.endTurn(d>0?1:0);markDial();busy=false;then&&then()})}
/* drag the page */
let dr=null;$('stage').addEventListener('pointerdown',e=>{if(busy)return;const r=$('stage').getBoundingClientRect(),right=e.clientX>r.left+r.width/2,d=right?1:-1,s=rb.s;if((d>0&&s>=maxS())||(d<0&&s<=0))return;dr={d,x:e.clientX,W:r.width,started:false,p:d>0?0:1};$('stage').setPointerCapture(e.pointerId)});
$('stage').addEventListener('pointermove',e=>{if(!dr)return;const dx=e.clientX-dr.x;if(!dr.started){if(Math.abs(dx)<4)return;dr.started=true;busy=true;rb.beginTurn(dr.d)}const q=Math.max(0,Math.min(1,-dr.d*dx/dr.W));dr.p=dr.d>0?q:1-q;rb.pose(dr.p)});
$('stage').addEventListener('pointerup',e=>{if(!dr)return;const a=dr;dr=null;if(!a.started){step(a.d);return}const goal=a.d>0?(a.p>.33?1:0):(a.p<.67?0:1);run(a.p,goal,360,()=>{rb.endTurn(goal);markDial();busy=false})});
/* the dial scrubs: each tick crossed turns one leaf */
let want=null;function chase(){if(want===null||busy||want===rb.s)return;step(Math.sign(want-rb.s),Math.max(170,420-Math.abs(want-rb.s)*40),chase)}
function dialTo(e){const r=$('dial').getBoundingClientRect(),i=Math.floor((e.clientY-r.top-6)/11);want=Math.max(0,Math.min(maxS(),i));chase()}
$('dial').addEventListener('pointerdown',e=>{$('dial').setPointerCapture(e.pointerId);$('dial').dragging=true;dialTo(e)});$('dial').addEventListener('pointermove',e=>{if($('dial').dragging)dialTo(e)});$('dial').addEventListener('pointerup',()=>$('dial').dragging=false);
$('dial').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){step(1);e.stopPropagation()}if(e.key==='ArrowUp'){step(-1);e.stopPropagation()}});
</script></body></html>
