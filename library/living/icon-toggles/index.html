/* 颜色工具 */
const hsl=hex=>{const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,M=Math.max(r,g,b),m=Math.min(r,g,b),L=(M+m)/2,d=M-m;let h=0,s=d?d/(1-Math.abs(2*L-1)):0;if(d){h=M===r?((g-b)/d)%6:M===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,s,L]};
const toHex=(h,s,l)=>{const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};return('#'+f(0)+f(8)+f(4)).toUpperCase()};
function setColor(c,fromKnob){st.color=c;$('#swatch').style.background=c;$('#hex').value=c;document.querySelectorAll('.citem').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c));const bl=root.querySelector('.bloom');if(bl)bl.style.background=c;if(st.open&&!fromKnob){drawArc()}else if(fromKnob){const k=root.querySelector('.core');if(k)k.setAttribute('fill',c)}}
const lo=a=>`color-mix(in srgb,color-mix(in srgb,${a},#000 30%) 14%,transparent)`;
/* 弧形明度滑杆：半径 170，±26°，旋钮角度与 1-明度 成线性 */
const A0=-.4583,A1=.4583,arcPt=f=>{const a=A0+(A1-A0)*f;return[180+170*Math.cos(a),180+170*Math.sin(a)]};
function drawArc(){const old=root.querySelector('.arc');if(!old)return;const[h,s,l]=hsl(st.color);const base=toHex(h,1,.5),f=1-l,[kx,ky]=arcPt(f),[x0,y0]=arcPt(0),[x1,y1]=arcPt(1);old.querySelector('#ag').innerHTML=`<stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="${base}"/><stop offset=".65" stop-color="${base}"/><stop offset="1" stop-color="#000"/>`;old.querySelector('.tr').setAttribute('stroke',lo(st.color));old.querySelectorAll('.halo,.core').forEach(c=>{c.setAttribute('cx',kx);c.setAttribute('cy',ky)});old.querySelector('.core').setAttribute('fill',st.color)}
function openBloom(){if(st.disabled)return;st.open=true;root.dataset.state='open';root.classList.remove('closing');const slot=$('#slot'),p=PALS[st.palette],[x0,y0]=arcPt(0),[x1,y1]=arcPt(1);const u=v=>`calc(${v}px*var(--s))`;
 let html=`<svg class="arc" viewBox="0 0 360 360" fill="none"><defs><linearGradient id="ag" gradientUnits="userSpaceOnUse" x1="180" y1="${y0}" x2="180" y2="${y1}"></linearGradient></defs><path class="tr" d="M${x0} ${y0}A170 170 0 0 1 ${x1} ${y1}" stroke-width="24" stroke-linecap="round"/><path d="M${x0} ${y0}A170 170 0 0 1 ${x1} ${y1}" stroke="url(#ag)" stroke-width="20" stroke-linecap="round"/><g class="knob"><circle class="halo" fill="#fff"/><circle class="core"/></g></svg><div class="bloom" style="background:${st.color};outline:calc(2px*var(--s)) solid ${lo(st.color)};outline-offset:calc(-2px*var(--s))"><div class="dish" style="outline:calc(2px*var(--s)) solid ${lo(st.color)};outline-offset:calc(-2px*var(--s))"></div></div>`;
 const pet=(c,r,a,d)=>{const x=r*Math.sin(a),y=-r*Math.cos(a);return`<button type="button" class="petal" aria-label="${c}" data-c="${c}" style="width:${u(54)};height:${u(54)};margin:${u(-27)} 0 0 ${u(-27)};left:calc(50% + ${u(x)});top:calc(50% + ${u(y)});background:${c};outline:calc(2px*var(--s)) solid color-mix(in srgb,color-mix(in srgb,${c},#000 30%) 18%,transparent);outline-offset:calc(-2px*var(--s));--fx:${u(-x)};--fy:${u(-y)};--d:${d}s"></button>`};
 p.o.split(' ').forEach((c,i)=>html+=pet(c,78,i*Math.PI/6,OD[i]));p.i.split(' ').forEach((c,i)=>html+=pet(c,42,i*Math.PI/3,ID[i]));html+=pet('#FFFFFF',0,0,.06);
 const holder=document.createElement('div');holder.id='flower';holder.innerHTML=html;slot.append(holder);$('#swatch').setAttribute('aria-expanded','true');drawArc();spreadShift(true)}
function closeBloom(now){if(!st.open)return;st.open=false;const f=$('#flower');$('#swatch').setAttribute('aria-expanded','false');spreadShift(false);if(now||reduce||st.motion==='none'&&false){f.remove();root.dataset.state='closed';root.classList.remove('closing');return}root.classList.add('closing');setTimeout(()=>{f.remove();root.dataset.state='closed';root.classList.remove('closing')},220)}
/* 关着时色块和输入框整体居中；开花时色块滑到预览正中 */
let shX=0,shStop=()=>{};function spreadShift(open){const w=$('#hex').parentElement.offsetWidth-$('#swatch').offsetWidth;const to=open?0:-w/2;shStop();shStop=spring(x=>{shX=x;$('#shift').style.transform=`translateX(${x}px)`},shX,to,420,38)}
$('#swatch').onclick=e=>{e.stopPropagation();openBloom()};
document.addEventListener('pointerdown',e=>{if(st.open&&!e.target.closest('#flower'))closeBloom()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBloom()});
$('#slot').addEventListener('click',e=>{const p=e.target.closest('.petal');if(p){setColor(p.dataset.c);closeBloom()}});
$('#slot').addEventListener('pointerdown',e=>{const k=e.target.closest('.knob');if(!k)return;e.preventDefault();root.classList.add('dragging');const[h,s]=hsl(st.color);const arc=root.querySelector('.arc');const mv=ev=>{const r=arc.getBoundingClientRect();const a=Math.atan2(ev.clientY-(r.top+r.height/2),ev.clientX-(r.left+r.width/2));const f=Math.max(0,Math.min(1,(a-A0)/(A1-A0)));setColor(toHex(h,s||1,1-f),true);const[kx,ky]=arcPt(f);arc.querySelectorAll('.halo,.core').forEach(c=>{c.setAttribute('cx',kx);c.setAttribute('cy',ky)})};const up=()=>{root.classList.remove('dragging');removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)});
$('#hex').addEventListener('change',e=>{const v=e.target.value.trim();if(/^#?[0-9a-f]{6}$/i.test(v))setColor((v[0]==='#'?v:'#'+v).toUpperCase());else e.target.value=st.color});
function sync(){root.dataset.input=st.input;root.dataset.motion=st.motion;root.dataset.theme=st.theme==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):st.theme;$('#swatch').disabled=$('#hex').disabled=st.disabled;if(st.disabled)closeBloom();updateSnippet();if(!st.open)spreadShift(false)}
function updateSnippet(){$('#snippet').textContent=`<BloomColorPicker\n  defaultValue="${st.color}"\n  palette="${st.palette}"\n  size={${st.size}}\n  motion="${st.motion}"\n  inputVariant="${st.input}"\n  theme="${st.theme}"${st.disabled?'\n  disabled':''}\n/>`}
$('#codeBtn').onclick=()=>{const p=$('#codePanel'),o=!p.hasAttribute('data-open');p.toggleAttribute('data-open',o);$('#codeBtn').setAttribute('aria-expanded',o);updateSnippet()};
/* 滚动渐隐：离边 0 到 10% 滚动进度时拉满，高度 20% */
const sc=$('#scroll');function maskUpdate(){const m=sc.scrollHeight-sc.clientHeight,p=m>0?sc.scrollTop/m:0,H=sc.clientHeight*.2;sc.style.setProperty('--mt',Math.min(1,p/.1)*H+'px');sc.style.setProperty('--mb',Math.min(1,(1-p)/.1)*H+'px')}sc.addEventListener('scroll',maskUpdate,{passive:true});
document.fonts.ready.then(()=>{setSize(30);setColor('#FFB1EE');sync();maskUpdate();const b=palR.querySelector('.pal-opt[data-active]');uX=b.offsetLeft+6;uW=b.offsetWidth-12;palU.style.transform=`translateX(${uX}px)`;palU.style.width=uW+'px';shX=-($('#hex').parentElement.offsetWidth-$('#swatch').offsetWidth)/2;$('#shift').style.transform=`translateX(${shX}px)`;
 const q=new URLSearchParams(location.search);if(q.get('open'))openBloom();});
</script></body></html>
