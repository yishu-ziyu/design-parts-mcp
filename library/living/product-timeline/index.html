<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">

<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#171717;background:#fff;--bg:#fff;--ink:#171717;--muted:#747474;--line:#dedede;color-scheme:light dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:5px}
main{max-width:1000px;margin:auto;padding:10px 48px 0;min-height:calc(100svh - 68px);display:flex;flex-direction:column;justify-content:center}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:440px;min-width:0}
.big-year{position:absolute;top:45px;font-size:clamp(100px,22vw,270px);font-weight:600;letter-spacing:-.08em;color:var(--line);line-height:1;user-select:none;pointer-events:none}
#device{position:relative;width:390px;max-width:80vw;height:350px;z-index:1;user-select:none;pointer-events:none}
#device img{display:block;width:100%;height:100%;object-fit:contain}
.identity{text-align:center;min-height:76px;margin-top:20px;z-index:2;width:100%;min-width:0}
h1{font-size:19px;font-weight:400;margin:0 0 12px}
#date{display:inline-block;max-width:100%;white-space:nowrap;font:11px monospace;color:var(--muted);text-decoration:none;line-height:1.6}
.timeline{width:100%;max-width:620px;margin:24px auto 0}
.rail{height:94px;position:relative;touch-action:none;cursor:ew-resize;user-select:none;border-radius:8px}
.rail:has(input:focus-visible):not(.pointer-focused){outline:2px solid var(--muted);outline-offset:8px}
.rail.dragging{cursor:grabbing}
#ticks{height:100%;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none;padding:0 8px}
#ticks i{width:3px;border-radius:2px;background:var(--ink);height:14px;opacity:.18}
input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;touch-action:none}
#years{position:relative;height:42px;margin:14px 8px 0}
#years button{position:absolute;transform:translateX(-50%);font:11px monospace;color:var(--muted);padding:12px 0;min-width:44px;min-height:44px}
.votes{display:flex;justify-content:center;gap:12px;margin:8px auto 0}
.vote-option{display:flex;flex-direction:column;align-items:center;gap:8px}
.votes button{display:flex;align-items:center;gap:16px;min-height:44px;min-width:114px;justify-content:space-between;padding:10px 16px;border:1px solid var(--line);border-radius:8px;font-size:14px;transition:background-color .15s,color .15s,transform .15s,opacity .15s}
.votes button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.votes button:active{transform:scale(.97)}
.vote-count{font:11px monospace;font-variant-numeric:tabular-nums;opacity:.7;min-width:3ch;text-align:right}
.vote-shortcut{display:flex;justify-content:center;gap:4px;height:24px;color:var(--muted)}
.vote-shortcut kbd{display:inline-flex;align-items:center;justify-content:center;min-width:25px;height:23px;padding:0 5px;border:1px solid var(--line);border-bottom-width:3px;border-radius:5px;background:var(--bg);font:13px monospace;line-height:1;user-select:none}
#vote-status{min-height:18px;margin:10px 0 0}
footer{display:flex;justify-content:center;align-items:center;gap:28px;text-align:center;padding:18px;max-width:560px;margin:auto}
footer a,footer button{display:inline-flex;align-items:center;min-height:44px;font-size:11px;color:var(--muted);text-decoration:none}
dialog{width:min(700px,calc(100% - 32px));max-height:85svh;border:1px solid var(--line);border-radius:8px;padding:24px;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:#0008}
.dialog-header{display:flex;justify-content:space-between;align-items:center;gap:16px}.dialog-header h2{font-size:20px;font-weight:400;margin:0}.dialog-header button{font-size:26px;min-width:44px;min-height:44px}
.source-row{padding:12px 0;border-top:1px solid var(--line)}.source-row h3{font-size:14px;font-weight:500;margin:0 0 4px}.source-row span{font:11px monospace;color:var(--muted)}
.tail{max-width:620px;margin:40px auto 60px;padding:0 24px;font-size:13px;line-height:1.7;color:var(--muted)}.tail h3{color:var(--ink);font-weight:500}.tail dt{margin-top:10px}.tail dd{margin:0}.tail code{color:var(--ink)}
@media(hover:hover) and (pointer:fine){.votes button:not([aria-pressed=true]):hover{background:var(--line)}.votes button[aria-pressed=true]:hover{opacity:.85}#years button:hover,footer button:hover,footer a:hover{color:var(--ink)}#date:hover{text-decoration:underline;text-underline-offset:4px}}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--ink:#eee;--line:#333;--muted:#aaa;background:var(--bg);color:var(--ink)}}
@media(max-width:600px){main{padding:0 24px}.stage{min-height:350px}#device{height:285px}.big-year{font-size:clamp(130px,40vw,230px);top:50px}.identity{margin-top:16px;min-height:65px}h1{font-size:18px}.timeline{margin-top:12px}.rail{height:86px}#years button{font-size:10px}footer{padding:12px}dialog{padding:18px}}
@media(max-height:720px){.stage{min-height:310px}#device{height:240px}.big-year{font-size:160px;top:28px}.timeline{margin-top:10px}.rail{height:70px}main{padding-top:10px;padding-bottom:10px}}

</style></head><body>
<main>
<section class="stage" id="stage" aria-label="Selected device"><div class="big-year" id="year" aria-hidden="true"></div><div id="device"></div>
<div class="identity" aria-live="polite" aria-atomic="true"><h1 id="name"></h1><a id="date" href="#sources-open"></a></div></section>
<section class="timeline" aria-label="Device timeline">
<div class="rail" id="rail"><div id="ticks" aria-hidden="true"></div><input id="scrubber" type="range" min="0" value="0" step="1" aria-label="Device timeline"></div>
<div id="years"></div>
<div class="votes" id="votes" aria-label="Your vote">

<div class="vote-option"><button id="vote-wanted" type="button" aria-pressed="false" title="Wanted · Shift+Return"><span>wanted</span><span class="vote-count"></span></button><span class="vote-shortcut"><kbd>⇧</kbd><kbd>↵</kbd></span></div>
</div><p id="vote-status" role="status"></p></section></main>
<footer><a href="#rail">Leaderboard</a><button id="about">Dates &amp; sources</button></footer>
<dialog id="sources"><div class="dialog-header"><h2>Dates &amp; sources</h2><button id="close" aria-label="Close">×</button></div><div id="source-list"></div></dialog>
<section class="tail"><h3>可拆</h3><dl>
<dt><code>#rail</code></dt><dd>99 根竖条的标尺：离当前位置越近越高越深，拖动时连续变化。</dd>
<dt><code>#stage</code></dt><dd>巨大的灰色年份压在物件后面，物件和文字整体一格一换。</dd>
<dt><code>#votes</code></dt><dd>两个计数按钮，下面放键帽提示：回车、Shift+回车。</dd>
</dl><p>设备图是从原站逐张截图得到的素材，只留本机。投票数是占位数，只存在本机浏览器。</p></section>

/* 设备图：从原站 bentossell.com/devices 逐张截图（白底黑底各一张算出透明），只留本机 */
const FILES=["00-fairchild-channel-f.webp", "01-canon-ae1.webp", "02-apple-ii-original.webp", "03-simon-original.webp", "04-speak-spell-original.webp", "05-walkman-tps-l2.webp", "06-game-watch-ball.webp", "07-walkman-wm2.webp", "08-watchman-resolved.webp", "09-walkman-resolved.webp", "10-game-watch-mario-bros.webp", "11-famicom-original.webp", "12-casio-watch-resolved.webp", "13-handycam-resolved.webp", "14-pager.webp", "15-quicksnap-resolved.webp", "16-pc-engine-original.webp", "17-organiser-resolved.webp", "18-gameboy-original.webp", "19-spellmaster-resolved.webp", "20-game-gear.webp", "21-hp-95lx.webp", "22-polaroid.webp", "23-talkboy.webp", "24-newton-messagepad.webp", "25-yakbak.webp", "26-playstation.webp", "27-discman.webp", "28-startac.webp", "29-gb-pocket.webp", "30-tamagotchi.webp", "31-bopit.webp", "32-psion.webp", "33-digimon.webp", "34-mavica.webp", "35-gb-camera.webp", "36-palm.webp", "37-nokia5110.webp", "38-rio.webp", "39-furby.webp", "40-gameboy.webp", "41-neo-geo.webp", "42-nokia3210.webp", "43-ericsson.webp", "44-minidisc.webp", "45-visor.webp", "46-calculator.webp", "47-nokia.webp", "48-gba.webp", "49-ipod-classic.webp", "50-blackberry-5810.webp", "51-camera.webp", "52-gba-sp.webp", "53-t610.webp", "54-iriver.webp", "55-ipod.webp", "56-razr.webp", "57-sidekick.webp", "58-zen-micro.webp", "59-ds.webp", "60-psp.webp", "61-ipod-shuffle.webp", "62-ipod-nano.webp", "63-blackberry.webp", "64-wii.webp", "65-iphone-original.webp", "66-flip.webp", "67-kindle-original.webp", "68-htc-dream.webp", "69-palm-pre.webp", "70-pokewalker.webp", "71-ipad-original.webp", "72-nintendo-3ds.webp", "73-kindle-paperwhite.webp", "74-chromecast-original.webp", "75-fire-phone.webp", "76-apple-watch-original.webp", "77-airpods-original.webp", "78-switch.webp", "79-oculus-go.webp", "80-galaxy-fold.webp", "81-surface-duo.webp", "82-airtag.webp", "83-steam-deck.webp", "84-ray-ban-meta.webp", "85-vision-pro.webp", "86-switch-2.webp", "87-iphone-duo.webp"];
const imgFor=i=>'source-assets/devices/'+FILES[i];
function show(i){const im=new Image();im.alt='';im.draggable=false;im.src=imgFor(i);$('#device').replaceChildren(im);[i-1,i+1,i-2,i+2].forEach(k=>{if(FILES[k])new Image().src=imgFor(k)})}
const $=s=>document.querySelector(s),slider=$('#scrubber'),rail=$('#rail'),last=devices.length-1;slider.max=last;
let index=-1,position=0,active=null;
const dates=new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}),months=new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});
function label(d){const p=d.date.split('-').map(Number),t=new Date(Date.UTC(p[0],(p[1]||1)-1,p[2]||1));const v=d.precision==='day'?dates.format(t):d.precision==='month'?months.format(t):String(d.year);return `${d.kind} ${v}${d.region?' · '+d.region:''}`}
const ticks=Array.from({length:99},()=>{const t=document.createElement('i');$('#ticks').append(t);return t});
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}};
function seed(s,m){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h%m}
function votes(){const d=devices[index],mine=store.get('pt-vote:'+d.id);[['had',seed(d.id,70)],['wanted',seed(d.id+'w',30)]].forEach(([k,n])=>{const b=$('#vote-'+k),on=mine===k;b.setAttribute('aria-pressed',on);b.querySelector('.vote-count').textContent=n+(on?1:0)})}
function vote(k){const key='pt-vote:'+devices[index].id;store.set(key,store.get(key)===k?null:k);votes()}
function select(v){position=Math.max(0,Math.min(last,v));const n=Math.round(position);slider.value=n;
 ticks.forEach((t,i)=>{const dist=Math.abs(i-position/last*(ticks.length-1));t.style.height=(13+62*Math.exp(-dist/9))+'px';t.style.opacity=.14+.86*Math.exp(-dist/8)});
 if(n===index)return;index=n;const d=devices[n];show(n);$('#name').textContent=d.name;$('#year').textContent=d.year;$('#date').textContent=label(d);slider.setAttribute('aria-valuetext',d.name+'. '+label(d));votes()}
function scrub(x){const b=rail.getBoundingClientRect();select((x-b.left-8)/(b.width-16)*last)}
rail.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;e.preventDefault();rail.classList.add('pointer-focused');active=e.pointerId;rail.setPointerCapture(active);slider.focus({preventScroll:true});rail.classList.add('dragging');scrub(e.clientX)});
rail.addEventListener('pointermove',e=>{if(e.pointerId!==active)return;e.preventDefault();scrub(e.clientX)});
function end(e){if(e.pointerId!==active)return;if(e.type==='pointerup')scrub(e.clientX);active=null;rail.classList.remove('dragging');if(rail.hasPointerCapture(e.pointerId))rail.releasePointerCapture(e.pointerId)}
rail.addEventListener('pointerup',end);rail.addEventListener('pointercancel',end);rail.addEventListener('lostpointercapture',end);
slider.addEventListener('input',()=>select(+slider.value));
const stops=devices.flatMap((d,i)=>i===0||d.year!==devices[i-1].year?[{year:d.year,index:i}]:[]);
function drawYears(){$('#years').replaceChildren();const w=rail.clientWidth-16;let prev=-Infinity;for(const s of stops){const x=s.index/last*w;if(s.index!==last&&(x-prev<58||w-x<48))continue;const b=document.createElement('button');b.textContent=s.year;b.style.left=s.index/last*100+'%';b.setAttribute('aria-label','Jump to '+s.year);b.onclick=()=>select(s.index);$('#years').append(b);prev=x}}
new ResizeObserver(drawYears).observe(rail);
document.addEventListener('keydown',e=>{rail.classList.remove('pointer-focused');if($('#sources').open||e.altKey||e.ctrlKey||e.metaKey)return;const m={ArrowLeft:index-1,ArrowRight:index+1,Home:0,End:last};if(e.key in m){e.preventDefault();select(m[e.key])}if(e.key==='Enter'&&!(document.activeElement&&document.activeElement.tagName==='BUTTON')){e.preventDefault();vote(e.shiftKey?'wanted':'had')}});
$('#vote-had').onclick=()=>vote('had');$('#vote-wanted').onclick=()=>vote('wanted');
for(const d of devices){const r=document.createElement('section');r.className='source-row';r.innerHTML=`<h3></h3><span></span>`;r.children[0].textContent=d.name;r.children[1].textContent=label(d);$('#source-list').append(r)}
$('#about').onclick=()=>$('#sources').showModal();$('#date').onclick=e=>{e.preventDefault();$('#sources').showModal()};$('#close').onclick=()=>$('#sources').close();
const req=devices.findIndex(d=>d.id===decodeURIComponent(location.hash.slice(1)));select(req>=0?req:devices.findIndex(d=>d.id==='gameboy'));
</script></body></html>
