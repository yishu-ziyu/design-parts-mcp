<div class="mode"><button id="m" type="button" aria-pressed="false">看代码重画的版本</button><span id="mt">现在显示的是原帖四张图（含原作素材，只留本机）。</span></div>
<section class="notes"><h3>可拆</h3><dl>
<dt><code>#fans</code></dt><dd>圆珠笔排线：同心圈的小扇子，离太阳越远越大、颜色从红渐变到蓝。</dd>
<dt><code>#rays</code></dt><dd>针线感的放射条：每条光线一种纹样（排线、点列、菱形、波浪、人字）。</dd>
<dt><code>#moon</code></dt><dd>黑纸粉笔：颗粒月亮，外面一圈圈点列、三角团和羽毛状涡旋。</dd>
<dt><code>#crayon</code></dt><dd>蜡笔涂鸦贴满胶带纸片，中央一块点涂的蓝。</dd>
</dl><p>默认显示原帖截图（@kevin_t_ngo）。下面的按钮切到 Canvas 2D 重画版，机制和参数都在那一版里，点任意一幅换一个随机种子；原作代码没有公开，重画版只是按成图反推，和原图有明显差距。</p></section>
<script>
function RNG(s){return ()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
const lerp=(a,b,t)=>a+(b-a)*t,sm=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
const hex=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join()})`};
function Kit(ctx,seed){const r=RNG(seed);const R=(a=1,b)=>b===undefined?r()*a:a+r()*(b-a);
 const pen=(x0,y0,x1,y1,col,w=.8,wob=1)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x0,y0);const mx=(x0+x1)/2+R(-wob,wob),my=(y0+y1)/2+R(-wob,wob);ctx.quadraticCurveTo(mx,my,x1,y1);ctx.stroke()};
 const clip=(path,fn)=>{ctx.save();ctx.beginPath();path();ctx.clip();fn();ctx.restore()};
 const hatch=(x,y,w,h,ang,gap,col,lw=.7,wob=1)=>{const c=Math.cos(ang),s=Math.sin(ang),D=Math.hypot(w,h),cx=x+w/2,cy=y+h/2;for(let d=-D/2;d<D/2;d+=gap*R(.75,1.25)){const a=cx-s*d-c*D/2,b=cy+c*d-s*D/2;pen(a,b,a+c*D,b+s*D,col,lw*R(.7,1.2),wob)}};
 const grain=(amt=.05,n=1)=>{const W=ctx.canvas.width,H=ctx.canvas.height,img=ctx.getImageData(0,0,W,H),d=img.data;for(let i=0;i<d.length;i+=4){const v=(r()-.5)*255*amt;d[i]+=v;d[i+1]+=v;d[i+2]+=v}ctx.putImageData(img,0,0)};
 return {R,pen,clip,hatch,grain,r}}

 for(let i=0;i<9000;i++){const x=R(W),y=R(687),d=Math.hypot(x-S[0],y-S[1]);if(d<430||R()>sm(430,760,d))continue;const a=R(-.9,-.5)+(R()<.5?1.3:0),l=R(30,80);pen(x,y,x+Math.cos(a)*l,y+Math.sin(a)*l,BLUE,R(.6,.9),1)}

 ctx.strokeStyle=RED;ctx.lineWidth=.8;ctx.beginPath();ctx.arc(S[0],S[1],12,Math.PI,0);ctx.stroke();
 /* 海 */
 for(let y=688;y<H;y+=1.7){const u=(y-687)/232,hw=300*Math.sqrt(Math.max(0,1-u*u));let x=S[0]-hw;while(x<S[0]+hw){const l=R(28,120);if(R()<.86)pen(x,y+R(-.8,.8),Math.min(x+l,S[0]+hw),y+R(-.8,.8),RED,R(.6,1.1),.9);x+=l+R(0,8)}}

 /* 烟囱与屋顶 */

const draws={fans,rays,moon,crayon};let seed=+(new URLSearchParams(location.search).get('seed')||7);
function render(id,s){const cv=document.getElementById(id),ctx=cv.getContext('2d',{willReadFrequently:true});ctx.setTransform(1,0,0,1,0,0);draws[id](ctx,s);cv.dataset.done='1'}
const ids=Object.keys(draws);const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* 默认显示原帖图；第一次切到代码版时才画，一幅画完再画下一幅，不让页面整体卡住 */
let drawn=false,code=false;const mb=document.getElementById('m'),mt=document.getElementById('mt');
function drawAll(done){if(drawn)return done&&done();(function next(i){if(i>=ids.length){drawn=true;return done&&done()}render(ids[i],seed+i);setTimeout(()=>next(i+1),reduce?0:30)})(0)}
function setMode(c){code=c;mb.setAttribute('aria-pressed',c);mb.textContent=c?'看原帖四张图':'看代码重画的版本';mt.textContent=c?'现在显示的是代码重画版，点任意一幅换随机种子。':'现在显示的是原帖四张图（含原作素材，只留本机）。';document.querySelectorAll('.w').forEach(f=>{f.querySelector('img').hidden=c;f.querySelector('canvas').hidden=!c})}
mb.onclick=()=>{const c=!code;mb.disabled=true;drawAll(()=>{setMode(c);mb.disabled=false})};
if(new URLSearchParams(location.search).has('code'))drawAll(()=>{setMode(true);document.body.dataset.ready='1'});else Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>{document.body.dataset.ready='1'});
ids.forEach((id,i)=>document.getElementById(id).addEventListener('click',()=>render(id,Date.now()%100000+i)));
