<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map Essay</title>
<style>

:root{--s:1px;--paper:#e3e3e3;--ink:#1c1c1c}

html,body{background:#000}

.t{position:absolute;left:0;right:0;text-align:center;white-space:pre;transform:translateY(-50%)}
.layer{position:absolute;inset:0;display:none}.layer.on{display:block}
#grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:multiply;pointer-events:none}
#invert{background:#111;color:#f1f1f1}
.big{font-family:"EB Garamond",serif;font-weight:400}
#foot{max-width:720px;margin:0 auto;padding:64px 24px 80px;background:#000;color:#bbb;font:14px/1.6 system-ui}
#foot h3{color:#fff;font-size:15px}#foot dt{margin-top:12px}#foot code{color:#fff}#foot dd{margin:2px 0 0}
</style></head><body>
<div id="view"><div id="stage" role="img" aria-label="Video ensayo tipográfico sobre el cuento Del rigor en la ciencia">
  <img id="frame" alt="">
  <section class="layer" id="title"></section>
  <section class="layer" id="imperio"></section>
  <section class="layer" id="doc"></section>
  <section class="layer" id="invert"></section>
  <section class="layer" id="final"></section>
  <section class="layer" id="stamp"></section>
  <svg id="grain" width="100%" height="100%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .55 0 0 0 0 .55 0 0 0 0 .55 0 0 0 2.4 -1.1"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div></div>
<section id="foot">
<h3>可拆</h3>
<dl>
<dt><code>#title</code></dt><dd>扉页一块块硬切出现，字距拉得很开，和正文的小号打字机字形成强烈落差。</dd>
<dt><code>#doc</code></dt><dd>整页文献只占版心一小块，其余留白；大字母和单词压在文献上，再硬切消失。</dd>
<dt><code>#invert</code></dt><dd>全黑反相一拍，只留一个词，文献隐约透出来。</dd>
<dt><code>#final</code></dt><dd>打字机逐字打出结尾，文本变长时整段往上走。</dd>
</dl>
</section>

$('stage').addEventListener('click',()=>{if(reduce){t=(Math.floor(t/TICK)+1)*TICK;if(t>=N*TICK)t=0}else playing=!playing});
