<h3>可拆</h3>
<dl>
<dt><code>#particles</code></dt><dd>一组组点从尘团凝聚成球、透视卡片、文字和立方体，再散开。</dd>

</dl>

/* ---------- shapes: each returns screen points {x,y,a,r,c}; c=0 white, 1 lavender ---------- */

function fib(i,n){const y=1-(i+.5)/n*2,r=Math.sqrt(1-y*y),th=i*GA;return[Math.cos(th)*r,y,Math.sin(th)*r]}
function rotP([x,y,z],ry,rx){const c=Math.cos(ry),s=Math.sin(ry);let X=x*c+z*s,Z=-x*s+z*c;const c2=Math.cos(rx),s2=Math.sin(rx);return[X,y*c2-Z*s2,y*s2+Z*c2]}
function sphereDot(i,n,cx,cy,R,ry,rx,base=1,dot=1){const p=rotP(fib(i,n),ry,rx),d=(p[2]+1)/2;
  const g=clamp(Math.pow(R/323,.8),1,3.1);return{x:cx+p[0]*R,y:cy+p[1]*R,a:base*(.4+.6*Math.pow(d,1.1))*(R>420?.6:1),r:dot*g*(.68+.62*d)*(R>420?1.25:1),c:0,z:p[2],u:p[0],v:p[1]}}
/* cube wireframe as dots */
function cubeVerts(cx,cy,s,ry,rx,tp=.09){const v=[];for(const x of[-1,1])for(const y of[-1,1])for(const z of[-1,1]){const p=rotP([x,y,z],ry,rx);v.push([cx+p[0]*s*(1-p[1]*tp),cy+p[1]*s,p[2]])}return v}
const EDGES=[[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
function CubeDots(cx,cy,s){return t=>{const q=eio(prog(t,28.35,29.2)),ry=lerp(.42,.785,q),v=cubeVerts(cx,cy,s,ry,lerp(-.34,-.6,q)),o=[];
  const per=110;for(const[a,b]of EDGES)for(let i=0;i<per;i++){const f=i/per;o.push({x:lerp(v[a][0],v[b][0],f),y:lerp(v[a][1],v[b][1],f),a:.55+.4*((lerp(v[a][2],v[b][2],f)+1.7)/3.4),r:.86,c:0})}return o}}

/* ---------- film states: [t0,t1,shape]; between them particles travel and scatter ---------- */
const sphereCx=t=>lerp(640,843,eio(prog(t,1.0,2.0)))+40*eio(prog(t,2,3));
const sphereR=t=>{if(t<1.0)return lerp(1200,850,eo(prog(t,.55,1.0)));const e=eio(prog(t,1.0,2.0));return lerp(850,323,e)-lerp(0,67,eio(prog(t,2.0,3)))};
const lavT=(t,q)=>{const e=prog(t,3.4,4.4);if(e<=0)return 0;return (q.u*-.7+q.v*-.7)>(1.05-e*1.05)&&(hash(q.x|0,3)>.25)?1:0};
/* ---------- helpers for the choreography ---------- */
const smooth=x=>x*x*(3-2*x);
/* piecewise keyframes: [[t,[...numbers]],...] */
function kf(keys,t){if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const[a,va]=keys[i-1],[b,vb]=keys[i],x=(t-a)/(b-a);return va.map((v,j)=>lerp(v,vb[j],x))}}return keys[keys.length-1][1]}
const kf1=(keys,t)=>kf(keys.map(([a,b])=>[a,[b]]),t)[0];
/* perspective mapping of the unit square onto a quad TL,TR,BR,BL */
function quadMap([x0,y0,x1,y1,x2,y2,x3,y3]){const dx1=x1-x2,dx2=x3-x2,sx=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,sy=y0-y1+y2-y3,den=dx1*dy2-dx2*dy1,
  g=(sx*dy2-dx2*sy)/den,h=(dx1*sy-sx*dy1)/den,a=x1-x0+g*x1,b=x3-x0+h*x3,d=y1-y0+g*y1,e=y3-y0+h*y3;
  return(u,v)=>{const w=g*u+h*v+1;return[(a*u+b*v+x0)/w,(d*u+e*v+y0)/w]}}
/* a soft cloud of dust; keys give [x,y,w,h,alpha] over time */
const cloud=keys=>t=>{const[x,y,w,h,a]=kf(keys,t);return{x,y,w,h,a}};
function cloudPt(c,i,s){return{x:c.x+(hash(i,s)*.72+hash(i,s+1)*.28-.5)*2*c.w,y:c.y+(hash(i,s+2)*.72+hash(i,s+3)*.28-.5)*2*c.h}}

/* text as dots */
const tc=document.createElement('canvas').getContext('2d',{willReadFrequently:true});

  try{tc.letterSpacing='-1px'}catch(e){}

  const w=Math.ceil(tc.measureText(str).width),d=tc.getImageData(0,0,1000,tc.canvas.height).data,o=[];
  for(let y=0;y<tc.canvas.height;y+=step)for(let x=0;x<w+4;x+=step){if(d[(Math.round(y)*1000+Math.round(x))*4+3]>128)o.push([x,y-size*1.05])}
  return{pts:o,w}}
const MOVE=textPts('move',288,600,9.9),MORE=textPts('more',288,600,9.9),moW=textPts('mo',288,600,9.9).w;
/* word box, measured at 14.0, 14.4, 15.0 s; ends flat */
const WX=536,WY=442,bb=T=>{const xs=T.pts.map(p=>p[0]),ys=T.pts.map(p=>p[1]);return[Math.min(...xs),Math.max(...xs),Math.min(...ys),Math.max(...ys)]};

const WORD=[[13.7,[760,356,1120,180,1150,300,796,497]],[14.0,[692,356,1075,222,1105,346,728,497]],[14.4,[604,353,1073,250,1101,367,638,494]],[15.0,[560,302,1190,290,1195,440,564,448]],[15.3,flat]];

const wordForms=[

];

const P5=[[[4.9,[330,60,48]],[5.3,[370,70,48]],[5.6,[505,125,48]],[5.9,[537,169,48]],[6.2,[540,173,48]]],
 [[4.9,[1320,330,80]],[5.3,[1330,345,80]],[5.6,[985,420,80]],[5.9,[820,430,80]],[6.2,[807,422,80]]],

 [[4.9,[1330,300,50]],[5.3,[1340,320,50]],[5.6,[1040,378,50]],[5.9,[890,385,50]],[6.2,[880,377,50]]]];
const smallAt=t=>P5.map(k=>kf(k,t));

const CL67=cloud([[6.3,[825,415,80,80,1]],[6.5,[850,400,90,90,1]],[6.8,[900,380,230,180,1]],[7.2,[900,500,320,220,.2]]]);
const pre=(()=>{const a=[];for(let i=0;i<N;i++){const p=rotP(fib(i,N),5.05*.32*0+1.84,-.28);const k=(p[1]<-.32&&p[0]<.42)?0:(p[0]<-.1&&p[1]>-.32)?2:(p[2]<-.42&&p[0]>.05)?3:1;a.push(k)}const cnt=[0,0,0,0],idx=a.map(k=>cnt[k]++);return{a,idx,cnt}})();
/* the big sphere: holds until 4.5, then streams into four small spheres, which then leave one by one */
function sphereFilm(t){if(t<.55||t>7.25)return[];const res=[];const cx=sphereCx(Math.min(t,4.5)),R=sphereR(Math.min(t,4.5));const small=smallAt(t);
