<div class="notes"><h3>可拆</h3><dl>
<dt><code>#p1</code></dt><dd>蜡笔线条引擎和票据节点：抖动重采样、两遍描边、带颗粒的影线，每秒换 5 次随机种子让线条微微颤动。</dd>
<dt><code>#p2</code></dt><dd>状态图回环：[条件] 红字，走线描出来、圆点沿线走、到站票据弹一下。</dd>
<dt><code>#p3</code></dt><dd>并行区域：天气和院子两条泳道同时点亮，互相影响插画。</dd>
<dt><code>#ui</code></dt><dd>贴底控制条：上下步、暂停、倍速，当前步一句话说明。</dd>
<dt><code>#scroll</code></dt><dd>长卷自动跟随：活动节点离开视口中段才滚动，用户一动手就停。</dd>
</dl></div>
<script>
const TAU=Math.PI*2,PI=Math.PI,REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const C={ink:'#2140d6',inkD:'#1a2c9c',navy:'#16246e',pink:'#e8175d',red:'#d81b4a',redD:'#b80f3c',rose:'#ff5a8c',straw:'#f5c935',ochre:'#e39a1c',orange:'#ff7f1e',flame:'#ffb31f',yolk:'#ffd84a',green:'#8fd65f',greenD:'#3fa748',leaf:'#62c24e',blue:'#2c4fe0',blueL:'#8fb6f5',sky:'#bcd6fb',lilac:'#a7a2ee',violet:'#5b4fe0',cream:'#fbeccb',creamD:'#f2d9a6',peach:'#f6c99a',teal:'#55dfc0',mint:'#9ff0d4',skin:'#f7c6a0',skinD:'#e9a27c',white:'#fdfcf8',paper:'#f5f1e8',grey:'#b9b6d6',tan:'#c98b4e',brown:'#9a5a2c'};
/* --- 蜡笔引擎：同一种子重画完全一样；换种子线条就颤 --- */
const hash=s=>{let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
let R=Math.random,BOIL=0;const seed=id=>{R=mul(hash(String(id))+BOIL*7919)};const rnd=(a=0,b=1)=>a+(b-a)*R();
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<0?0:t>1?1:t*t*(3-2*t),back=t=>{t=clamp(t);return 1+2.7*(t-1)**3+1.7*(t-1)**2};
const pats={};function grain(col,holes=.42){const k=col+holes;if(pats[k])return pats[k];const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d');g.fillStyle=col;g.fillRect(0,0,96,96);g.globalCompositeOperation='destination-out';const r=mul(hash(k));for(let i=0;i<96*96*holes;i++){g.globalAlpha=r()*.95;g.fillRect(r()*96|0,r()*96|0,r()<.2?2:1,1)}const p=document.createElement('canvas').getContext('2d').createPattern(c,'repeat');p.setTransform(new DOMMatrix().scale(.62));return pats[k]=p}
function resample(pts,step,closed){const P=closed?pts.concat([pts[0]]):pts,o=[];for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/step));for(let k=0;k<n;k++)o.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}if(!closed)o.push(P[P.length-1]);return o}
function wob(P,amp){const a=rnd(0,TAU),b=rnd(0,TAU),c=rnd(0,TAU),d=rnd(0,TAU),f=rnd(.05,.1),g=rnd(.18,.32);return P.map((p,i)=>[p[0]+amp*(Math.sin(i*f+a)*.7+Math.sin(i*g+b)*.3+rnd(-.25,.25)),p[1]+amp*(Math.sin(i*f+c)*.7+Math.sin(i*g+d)*.3+rnd(-.25,.25))])}
const ell=(x,y,rx,ry,n=30,a0=0,a1=TAU)=>{const o=[];for(let i=0;i<n;i++){const a=a0+(a1-a0)*i/(a1-a0===TAU?n:n-1);o.push([x+Math.cos(a)*rx,y+Math.sin(a)*ry])}return o};
const rect=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
const bez=(a,b,c,d,n=14)=>{const o=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push([u*u*u*a[0]+3*u*u*t*b[0]+3*u*t*t*c[0]+t*t*t*d[0],u*u*u*a[1]+3*u*u*t*b[1]+3*u*t*t*c[1]+t*t*t*d[1]])}return o};
const qb=(a,b,c,n=10)=>{const o=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push([u*u*a[0]+2*u*t*b[0]+t*t*c[0],u*u*a[1]+2*u*t*b[1]+t*t*c[1]])}return o};
function chaikin(p,it=1,closed=true){for(let k=0;k<it;k++){const o=[],n=p.length;for(let i=0;i<(closed?n:n-1);i++){const a=p[i],b=p[(i+1)%n];o.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}if(!closed){o.unshift(p[0]);o.push(p[n-1])}p=o}return p}
function rounded(pts,r=14){const o=[pts[0]];for(let i=1;i<pts.length-1;i++){const a=pts[i-1],b=pts[i],c=pts[i+1],d1=Math.hypot(b[0]-a[0],b[1]-a[1]),d2=Math.hypot(c[0]-b[0],c[1]-b[1]),rr=Math.min(r,d1/2,d2/2);o.push(...qb([b[0]+(a[0]-b[0])*rr/d1,b[1]+(a[1]-b[1])*rr/d1],b,[b[0]+(c[0]-b[0])*rr/d2,b[1]+(c[1]-b[1])*rr/d2],6))}o.push(pts[pts.length-1]);return o}
/* 沿折线造一根两头圆的管子，手脚身体都用它 */
function tube(pl,w,w2=w){const n=pl.length,A=[],B=[];for(let i=0;i<n;i++){const a=pl[Math.max(0,i-1)],b=pl[Math.min(n-1,i+1)];let tx=b[0]-a[0],ty=b[1]-a[1];const d=Math.hypot(tx,ty)||1;tx/=d;ty/=d;const h=lerp(w,w2,i/(n-1))/2;A.push([pl[i][0]-ty*h,pl[i][1]+tx*h]);B.push([pl[i][0]+ty*h,pl[i][1]-tx*h])}const cap=(c,p,r)=>{const o=[],a0=Math.atan2(p[1]-c[1],p[0]-c[0]);for(let k=1;k<6;k++){const a=a0-PI*k/6;o.push([c[0]+Math.cos(a)*r,c[1]+Math.sin(a)*r])}return o};return A.concat(cap(pl[n-1],A[n-1],w2/2),B.reverse(),cap(pl[0],B[n-1],w/2))}
const bbox=p=>{let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const q of p){a=Math.min(a,q[0]);c=Math.max(c,q[0]);b=Math.min(b,q[1]);d=Math.max(d,q[1])}return{x0:a,y0:b,x1:c,y1:d,w:c-a,h:d-b,cx:(a+c)/2,cy:(b+d)/2}};
const pth=p=>{const o=new Path2D();p.forEach((q,i)=>i?o.lineTo(q[0],q[1]):o.moveTo(q[0],q[1]));o.closePath();return o};
const off=(p,dx,dy)=>p.map(q=>[q[0]+dx,q[1]+dy]);
function line(c,pts,o={}){const col=o.color||C.ink,w=o.w||2.6,amp=o.amp??1.1,closed=!!o.closed;let P=resample(pts,4,closed);if(closed)P=P.concat(P.slice(1,Math.min(P.length,3+(rnd()*5|0))));if(o.progress!=null&&o.progress<1){if(o.progress<=0)return P;P=P.slice(0,Math.max(2,Math.ceil(P.length*o.progress)))}c.save();c.lineCap=c.lineJoin='round';c.strokeStyle=grain(col,o.holes??.3);const passes=o.passes||2;for(let k=0;k<passes;k++){const J=wob(P,amp*(k?1.5:1)),ph=rnd(0,TAU);c.globalAlpha=(o.alpha??1)*(k?.5:.95);for(let s=0;s<J.length-1;s+=10){c.lineWidth=w*(k?.55:1)*(.78+.38*(.5+.5*Math.sin(s*.07+ph)));c.beginPath();c.moveTo(J[s][0],J[s][1]);for(let i=s+1;i<=Math.min(J.length-1,s+10);i++)c.lineTo(J[i][0],J[i][1]);c.stroke()}}c.restore();return P}
function hatch(c,pts,o={}){const col=o.color||C.ink,b=bbox(pts),path=pth(pts);c.save();c.clip(path);if(o.solid){c.fillStyle=o.solid;c.fill(path)}if(o.base!==0){c.globalAlpha=o.base??.5;c.fillStyle=grain(col,.5);c.fill(path)}for(const l of(o.layers||[{}])){const cc=l.color||col,gap=l.gap||o.gap||3.4,ang=(l.angle??o.angle??-1.05)+rnd(-.08,.08),dx=Math.cos(ang),dy=Math.sin(ang),nx=-dy,ny=dx,L=Math.hypot(b.w,b.h)/2+6;c.strokeStyle=grain(cc,.35);c.lineCap='round';for(let d=-L;d<L;d+=gap*rnd(.65,1.35)){c.globalAlpha=rnd(.45,.95)*(l.alpha??o.alpha??1);c.lineWidth=(l.w||o.w||1.9)*rnd(.7,1.3);const ox=b.cx+nx*d,oy=b.cy+ny*d;let t=-L-rnd(0,12);c.beginPath();while(t<L){const t2=Math.min(L,t+rnd(20,140)),wb=rnd(-1.6,1.6);c.moveTo(ox+dx*t,oy+dy*t);c.quadraticCurveTo(ox+dx*(t+t2)/2+nx*wb,oy+dy*(t+t2)/2+ny*wb,ox+dx*t2,oy+dy*t2);t=t2+(rnd()<.5?rnd(0,7):0)}c.stroke()}}c.restore()}
function rays(c,pts,hx,hy,o){const b=bbox(pts),path=pth(pts),Rm=Math.hypot(Math.max(Math.abs(b.x0-hx),Math.abs(b.x1-hx)),Math.max(Math.abs(b.y0-hy),Math.abs(b.y1-hy)))+4;c.save();c.clip(path);if(o.solid){c.fillStyle=o.solid;c.fill(path)}c.globalAlpha=o.base??.6;c.fillStyle=grain(o.color,.5);c.fill(path);const cols=o.cols||[o.color],n=o.n||60,a0=o.a0??-PI,a1=o.a1??0;c.lineCap='round';for(let i=0;i<n;i++){const a=a0+(a1-a0)*(i+rnd(-.4,.4))/n,r0=rnd(0,Rm*(o.inner??.1)),r1=Rm*rnd(.75,1.05);c.strokeStyle=grain(cols[rnd()*cols.length|0],.35);c.globalAlpha=rnd(.5,1);c.lineWidth=(o.w||1.8)*rnd(.7,1.4);c.beginPath();c.moveTo(hx+Math.cos(a)*r0,hy+Math.sin(a)*r0);c.lineTo(hx+Math.cos(a)*r1,hy+Math.sin(a)*r1);c.stroke()}c.restore()}
function shape(c,pts,o={}){if(o.fill){if(o.ray)rays(c,pts,o.ray[0],o.ray[1],{color:o.fill,solid:o.solid,...o.r});else hatch(c,pts,{color:o.fill,solid:o.solid,...o.h})}if(o.stroke!==null)line(c,pts,{color:o.stroke||C.ink,w:o.w||2.6,closed:true,amp:o.amp,alpha:o.alpha})}
const dot=(c,x,y,r,fill,o={})=>shape(c,ell(x,y,r,r,Math.max(10,r*2|0)),{fill,w:o.w||2.2,h:{gap:2.4,base:.7},...o});
const FT='"Special Elite","Courier Prime",monospace',FL='"Courier Prime",monospace';
function txt(c,s,x,y,o={}){c.save();c.font=o.font||`22px ${FT}`;c.textAlign=o.align||'left';c.fillStyle=grain(o.color||C.inkD,o.holes??.18);c.globalAlpha=o.alpha??1;c.fillText(s,x,y);if(o.double){c.globalAlpha*=.35;c.fillText(s,x+.7,y+.4)}c.restore()}
function label(c,s,x,y,o={}){const size=o.size||19,lh=o.lh||size*1.22;c.save();c.font=`italic ${size}px ${FL}`;let used=0;const total=o.chars??1e9;s.split('\n').forEach((ln,li)=>{const parts=ln.split(/(\[[^\]]*\]?)/).filter(Boolean),wt=c.measureText(ln).width;let cx=o.align==='right'?x-wt:o.align==='center'?x-wt/2:x;for(const p of parts){const g=p[0]==='[',vis=Math.max(0,Math.min(p.length,total-used));used+=p.length;if(vis>0){c.fillStyle=grain(g?C.red:C.inkD,.15);c.fillText(p.slice(0,vis),cx,y+li*lh)}cx+=c.measureText(p).width}});c.restore()}
/* --- 自绘道具 --- */
function petals(c,x,y,r,a){c.save();c.fillStyle=grain(C.blue,.25);c.globalAlpha=.95;for(let k=0;k<4;k++){const n=a+k*PI/2;c.beginPath();c.ellipse(x+Math.cos(n)*r*.95,y+Math.sin(n)*r*.95,r*.78,r*.58,n,0,TAU);c.fill()}c.fillStyle=C.white;c.beginPath();c.arc(x,y,r*.3,0,TAU);c.fill();c.restore()}
function blouse(c,pts,s=1){const b=bbox(pts);hatch(c,pts,{color:'#dfe3ff',solid:C.white,base:.25,gap:5,w:1.2,layers:[{color:C.lilac,alpha:.3,gap:7}]});c.save();c.clip(pth(pts));const g=15*s;let row=0;for(let y=b.y0-g;y<b.y1+g;y+=g*.9,row++)for(let x=b.x0-g+row%2*g/2;x<b.x1+g;x+=g)petals(c,x+rnd(-2,2)*s,y+rnd(-2,2)*s,3.1*s,rnd(0,1.5));c.restore();line(c,pts,{closed:true,w:2.4})}
function hat(c,x,y,r,tilt=0){const W=1.75*r,H=2.2*r,by=y-.42*r,apex=[x+tilt*H,by-H];const pts=[apex].concat(qb([x+W,by+.1*r],[x,by+.62*r],[x-W,by+.1*r],14));shape(c,pts,{fill:C.straw,ray:apex,r:{cols:[C.ochre,C.orange,'#f0a92a'],n:30,w:2.3,base:.8,inner:0,a0:PI/2-.95,a1:PI/2+.95,solid:C.white},w:2.6})}
function head(c,x,y,r,f,o={}){shape(c,ell(x-f*r*.18,y-r*.12,r*1.02,r,20),{fill:C.navy,h:{gap:2.2,base:.85},w:2});shape(c,ell(x+f*r*.12,y+r*.05,r*.86,r*.92,20),{fill:C.skin,solid:C.white,h:{gap:3,base:.7,layers:[{color:C.skinD,alpha:.35}]},w:2});dot(c,x+f*r*.5,y-r*.08,1.6,C.navy,{w:1.4});if(o.mask!==false)shape(c,[[x+f*r*.02,y+r*.12],[x+f*r*1.02,y+r*.1],[x+f*r*.86,y+r*.78],[x+f*r*.15,y+r*.86]],{fill:'#eef0ff',solid:C.white,h:{gap:4,base:.2,w:1.2},w:1.8});else dot(c,x+f*r*.45,y+r*.32,2.6,C.rose,{stroke:null})}
function villager(c,P,o={}){const s=P.s||1,f=P.f||1,r=15*s,N=P.neck,H=P.hip;let vx=H[0]-N[0],vy=H[1]-N[1];const vl=Math.hypot(vx,vy);vx/=vl;vy/=vl;const px=-vy,py=vx,sh=[N[0]+vx*7*s,N[1]+vy*7*s];
 const leg=(k,ft)=>{shape(c,tube([H,k,ft],25*s,20*s),{fill:C.blue,h:{angle:-1.3,gap:2.8,base:.7,solid:C.white},w:2.4});shape(c,ell(ft[0]+f*6*s,ft[1]+3*s,13*s,6.5*s,14),{fill:C.navy,h:{gap:2.2,base:.8},w:2})};
 const arm=(e,h,fr)=>{blouse(c,tube([[sh[0]+f*(fr?3:-3)*s,sh[1]],e,h],18*s,14*s),s*.85);shape(c,ell(h[0],h[1],8.5*s,7.5*s,12),{fill:C.blue,h:{gap:2.3,base:.8},w:2})};
 leg(P.knB,P.ftB);leg(P.knF,P.ftF);if(P.elB)arm(P.elB,P.haB,false);
 const T=chaikin([[N[0]+px*14*s,N[1]+py*14*s],[N[0]-px*14*s,N[1]-py*14*s],[H[0]-px*19*s+vx*14*s,H[1]-py*19*s+vy*14*s],[H[0]+px*19*s+vx*14*s,H[1]+py*19*s+vy*14*s]]);
 if(o.shirt)shape(c,T,{fill:o.shirt,h:{gap:3,base:.7,solid:C.white},w:2.4});else blouse(c,T,s);
 head(c,P.head[0],P.head[1],r,f,o);if(o.hat!==false)hat(c,P.head[0],P.head[1],r,P.tilt||0);if(P.elF)arm(P.elF,P.haF,true)}
