<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>manga-flip</title><link rel="icon" href="data:,">
<style>
:root{--paper:#f1eee6;--ink:#141310;--mute:#8d8a80}
*{box-sizing:border-box}html{background:#000}body{margin:0;background:#000;color:#eee;font:13px/1.6 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#film{display:block;width:874px;max-width:100%;margin:0 auto;background:#000;aspect-ratio:874/983}
.ctl{width:874px;max-width:100%;margin:0 auto;display:flex;gap:12px;align-items:center;padding:8px 12px;font-variant-numeric:tabular-nums;color:#bbb}
.ctl input{flex:1;accent-color:#fff}#pp{width:44px;height:28px;border:1px solid #444;border-radius:4px}
.lab{background:var(--paper);color:var(--ink);padding:48px 16px 72px}.lab>*{max-width:874px;margin-inline:auto}
.lab h2{margin:44px auto 12px;font:600 14px/20px inherit}
.page{position:relative;aspect-ratio:874/491;overflow:hidden;background:var(--paper) linear-gradient(90deg,transparent 46%,rgba(30,25,15,.28) 50%,transparent 54%)}
.shot{position:absolute;inset:0;background-size:100% 200%;background-position:bottom}
/* page turn */
#turn{perspective:1800px;background:#201c15}
#turn .under,#turn .leaf{position:absolute;inset:0}
#turn .leaf{transform-origin:left center;left:50%;width:50%;transform-style:preserve-3d;transform:rotateY(0deg)}
#turn.go .leaf{transition:transform var(--dur) cubic-bezier(.45,.05,.25,1);transform:rotateY(-180deg)}
#turn .f,#turn .b{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden}
#turn .f .shot{left:-100%;right:0}#turn .b{transform:rotateY(180deg)}#turn .b .shot{left:0;right:-100%}
#turn .sh{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,0) 34%);opacity:0;transition:opacity var(--dur)}
#turn.go .sh{opacity:1}#turn .gut{position:absolute;left:47%;width:6%;top:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(20,15,5,.42),transparent);pointer-events:none}
/* sfx */
#sfx .burst{position:absolute;left:69%;top:52%;width:66%;aspect-ratio:1;translate:-50% -50%;transform:scale(0);opacity:0;filter:drop-shadow(0 0 1px #111)}#sfx .burst i{position:absolute;inset:0;clip-path:polygon(var(--poly))}#sfx .burst i:nth-child(1){background:#f57a12}#sfx .burst i:nth-child(2){inset:13%;background:#ffc81f;rotate:11deg}#sfx .burst i:nth-child(3){inset:30%;background:#fff6c8;rotate:-6deg}
#sfx .word{position:absolute;left:3%;top:9%;width:60%;transform:skewX(-8deg) rotate(-5deg);font:900 clamp(26px,8.8vw,82px)/1.08 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#d8232a;paint-order:stroke fill;-webkit-text-stroke:.13em #0d0d0d;filter:drop-shadow(.045em .06em 0 #f6f1e6) drop-shadow(-.03em -.03em 0 #f6f1e6)}
#sfx .word b{display:inline-block;font-weight:900;opacity:0;transform:scale(1.9) rotate(-18deg)}
#sfx.go .burst{animation:bur .22s cubic-bezier(.2,1.5,.4,1) forwards}
#sfx.go .word b{animation:pop .16s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:calc(var(--i)*var(--step))}
@keyframes bur{to{transform:scale(1);opacity:1}}@keyframes pop{to{opacity:1;transform:scale(1) rotate(calc(var(--r)*1deg))}}
/* reveal */
#reveal .over{clip-path:inset(0 calc(100% - var(--x)) 0 0)}#reveal .line{position:absolute;top:0;bottom:0;left:var(--x);width:2px;background:#111;opacity:.75}
.tool{display:flex;gap:10px;align-items:center;margin-top:8px;color:#55524a}.tool button{height:30px;padding:0 12px;border:1px solid #bbb6a8;border-radius:4px;background:#fbfaf5;color:var(--ink)}.tool input{flex:1;accent-color:#141310}
h3.k{margin:56px auto 8px;font:600 14px/20px inherit}dl{margin:0 auto;font-size:13px;color:#55524a}dt{margin-top:8px}dd{margin:0}code{font:12px ui-monospace,monospace;color:var(--ink)}
@media(prefers-reduced-motion:reduce){#turn .leaf,#turn .sh{transition:none!important}#sfx.go .burst,#sfx.go .word b{animation-duration:.001s;animation-delay:0s}}
</style></head><body>
<canvas id="film" role="img" aria-label="Anime on top, the same scenes rebuilt as a flippable manga below"></canvas>
<div class="ctl"><button id="pp" aria-label="Play or pause">▶</button><input id="scrub" type="range" min="0" max="170" value="0" aria-label="Frame"><span id="time">0.0 / 34.2s</span></div>
<div class="lab">
<h2>翻页</h2>
<div class="page" id="turn" style="--dur:.75s"><div class="under"><div class="shot" style="background-image:url(source-assets/f/f0066.jpg)"></div></div><div class="leaf"><div class="f"><div class="shot" style="background-image:url(source-assets/f/f0060.jpg)"></div></div><div class="b"><div class="shot" style="background-image:url(source-assets/f/f0066.jpg)"></div><div class="sh"></div></div></div><div class="gut"></div></div>
<div class="tool"><button id="turnbtn">翻一页</button><span>750ms，书脊在正中</span></div>
<h2>拟声词逐字落下</h2>
<div class="page" id="sfx" style="--step:90ms;--poly:50% 0,55% 28%,64% 4%,64% 31%,80% 10%,72% 36%,97% 22%,76% 43%,100% 42%,78% 52%,100% 64%,74% 60%,90% 86%,66% 68%,70% 100%,56% 74%,48% 96%,44% 73%,28% 98%,34% 68%,6% 84%,26% 60%,0 58%,24% 49%,3% 30%,28% 39%,17% 10%,37% 31%,34% 3%,46% 27%"><div class="shot" style="background-image:url(source-assets/f/f0050.jpg)"></div><div class="burst"><i></i><i></i><i></i></div><div class="word" aria-label="ハックション"></div></div>
<div class="tool"><button id="sfxbtn">再来一次</button><span>每字间隔 90ms</span></div>
<h2>草稿到上色</h2>
<div class="page" id="reveal" style="--x:50%"><div class="shot" style="background-image:url(source-assets/f/f0002.jpg)"></div><div class="shot over" style="background-image:url(source-assets/f/f0004.jpg)"></div><div class="line"></div></div>
<div class="tool"><input id="rev" type="range" min="0" max="100" value="50" aria-label="Reveal"></div>
<h3 class="k">可拆</h3><dl>
<dt><code>#film</code></dt><dd>171 张截图按 5 帧每秒播放，可拖动。</dd>
<dt><code>#turn</code></dt><dd>半张书页绕书脊转 180 度，背面是下一页，加阴影。</dd>
<dt><code>#sfx</code></dt><dd>爆炸形弹出，拟声词每字错开 90ms 落下。</dd>
<dt><code>#reveal</code></dt><dd>用裁切线在草稿和上色稿之间划过。</dd>
</dl></div>
<script src="player.js"></script>
<script>
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const pp=document.getElementById('pp'),sc=document.getElementById('scrub'),time=document.getElementById('time');
const P=Player({canvas:document.getElementById('film'),n:171,fps:5,onframe:i=>{sc.value=i;time.textContent=(i/5).toFixed(1)+' / 34.2s'},onstate:s=>pp.textContent=s?'❚❚':'▶'});
pp.onclick=()=>P.toggle();sc.oninput=()=>{P.pause();P.seek(+sc.value)};
const q=new URLSearchParams(location.search);if(q.get('f'))P.seek(+q.get('f'));else if(!REDUCE)P.play();
const T=document.getElementById('turn');function turn(){T.classList.remove('go');T.offsetWidth;T.classList.add('go')}document.getElementById('turnbtn').onclick=turn;
const S=document.getElementById('sfx'),w=S.querySelector('.word'),R=[-12,6,-8,10,-6,8];let ci=0;
w.innerHTML=[...'ハッ'].concat(['<br>'],[...'クション']).map(c=>c==='<br>'?c:`<b style="--i:${ci};--r:${R[ci++%6]}">${c}</b>`).join('');
function sfx(){S.classList.remove('go');S.offsetWidth;S.classList.add('go')}document.getElementById('sfxbtn').onclick=sfx;sfx();
const X=document.getElementById('reveal');document.getElementById('rev').oninput=e=>X.style.setProperty('--x',e.target.value+'%');
</script></body></html>
