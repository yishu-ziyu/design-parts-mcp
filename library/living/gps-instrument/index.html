function renderStep(){const S=STEPS[step];$('#ttl').textContent=S.t;$('#num').textContent=step+'/5';$('#copy').innerHTML=S.c();
 if(step===1){$('#act').innerHTML=`<span class="prompt"><span>PLACE THE RECEIVER ON THE GLOBE</span><span>OR</span><button id="geo">USE YOUR LOCATION</button></span>`;$('#geo').onclick=()=>{if(!navigator.geolocation)return place(40.71,-74.0);navigator.geolocation.getCurrentPosition(p=>place(p.coords.latitude,p.coords.longitude),()=>place(40.71,-74.0),{timeout:4000})}}
 else{$('#act').innerHTML=`<button class="b" id="pv">${ARL}PREV</button><button class="b go" id="nx" ${step===5?'disabled':''}>NEXT${ARR}</button><button class="b rs" id="rs">RESET</button>`;$('#pv').onclick=()=>go(step-1);$('#nx').onclick=()=>go(step+1);$('#rs').onclick=reset}
 const tp=$('#tip');tp.style.display='none';
 $('#copy').querySelectorAll('[data-tip]').forEach(b=>{const show=()=>{tp.textContent=TIPS[b.dataset.tip];tp.style.display='block';tp.style.bottom=(innerHeight-$('#lesson').getBoundingClientRect().top+0)+'px'},hide=()=>tp.style.display='none';b.onmouseenter=show;b.onmouseleave=hide;b.onfocus=show;b.onblur=hide})}
function place(lat,lon){const seed=Math.abs(Math.sin(lat*12.9+lon*78.2)*43758.5)%1;rx={lat,lon};bias=(150+seed*300)*1e-6;step=2;retarget();renderStep();lock=null}
function pick(){const g=gmst(simT),rv=eciOf(rx.lon,rx.lat,g);const us=sats.map(s=>({s,p:satPos(s,simT)})).filter(o=>elev(rv,o.p)>=5);let best=null;for(let a=0;a<us.length;a++)for(let b=a+1;b<us.length;b++)for(let c=b+1;c<us.length;c++)for(let d=c+1;d<us.length;d++){const set=[us[a],us[b],us[c],us[d]],D=dop(rv,set.map(o=>o.p));if(D&&(!best||D.g<best.D.g))best={set,D}}
 if(!best)return null;const set=best.set.sort((x,y)=>norm(sub(x.p,rv))-norm(sub(y.p,rv)));const ds=set.map(o=>norm(sub(o.p,rv)));const cb=C*bias;const fx=fix3(set.map(o=>o.p),ds.map(d=>d+cb),rv);const off=norm(sub(fx,rv));const u=[fx[0]/norm(fx),fx[1]/norm(fx),fx[2]/norm(fx)];const a=Math.atan2(u[1],u[0])-g;let lo=(a/D2R+540)%360-180;return{set,ds,D:best.D,cb,fx,off,fl:{lat:Math.asin(u[2])/D2R,lon:lo},t:simT,rv}}
function go(n){if(n<1)return;if(n===1){reset();return}if(n>=3&&!lock){lock=pick();tl3=performance.now();if(!lock){lock=null;return}}if(n<3)lock=null;step=n;if(n===3)tl3=performance.now();retarget();renderStep();biasGo=performance.now()}
function reset(){step=1;rx=null;lock=null;retarget();renderStep()}
svg.addEventListener('click',e=>{if(step!==1)return;const q=unview(e.clientX,e.clientY);if(q)place(q.lat,q.lon)});
document.querySelectorAll('.sec').forEach(b=>b.onclick=()=>{b.classList.toggle('open');$('#'+b.dataset.b).classList.toggle('open');table()});
/* cap ring on Earth */
function ringPts(sp,rho){const s=norm(sp),ca=(s*s+RE*RE-rho*rho)/(2*s*RE);if(ca>=1||ca<=-1)return null;const A_=Math.acos(ca),ax=sp.map(v=>v/s);const h=Math.abs(ax[2])<.9?[0,0,1]:[1,0,0];let e1=[ax[1]*h[2]-ax[2]*h[1],ax[2]*h[0]-ax[0]*h[2],ax[0]*h[1]-ax[1]*h[0]];const l=norm(e1);e1=e1.map(v=>v/l);const e2=[ax[1]*e1[2]-ax[2]*e1[1],ax[2]*e1[0]-ax[0]*e1[2],ax[0]*e1[1]-ax[1]*e1[0]];const pts=[];for(let i=0;i<=240;i++){const t=i/240*2*Math.PI;pts.push([0,1,2].map(n=>RE*(Math.cos(A_)*ax[n]+Math.sin(A_)*(Math.cos(t)*e1[n]+Math.sin(t)*e2[n]))))}return pts}
function drawRing(r,pts,dashed,showFill){let stroke='',fill='',pen=false;for(const p of pts){const v=view(p);const xy=v.x.toFixed(1)+' '+v.y.toFixed(1);if(v.z>=0){stroke+=(pen?'L':'M')+xy;pen=true;fill+=(fill?'L':'M')+xy}else{pen=false;const dx=v.x-cx,dy=v.y-cy,l=Math.hypot(dx,dy)||1;fill+=(fill?'L':'M')+(cx+dx/l*cam.R).toFixed(1)+' '+(cy+dy/l*cam.R).toFixed(1)}}
 r.ground.setAttribute('d',stroke);r.ground.setAttribute('stroke-dasharray',dashed?'3 3':'');r.fill.setAttribute('d',showFill?fill+'Z':'')}
function table(){let a='ID    X·KM    Y·KM    Z·KM   EL\n';const g=gmst(simT),rv=rx?eciOf(rx.lon,rx.lat,g):null;const f=(v)=>(v>=0?'+':'-')+String(Math.abs(Math.round(v))).padStart(5,'0');
 const b=$('#b1');if(b.classList.contains('open')){b.innerHTML='<span style="opacity:.6">ID    X·KM    Y·KM    Z·KM   EL</span>\n'+sats.map(s=>{const p=satPos(s,simT);const c=Math.cos(g),n=Math.sin(g);const e=[p[0]*c+p[1]*n,-p[0]*n+p[1]*c,p[2]];const E=rv?Math.round(elev(rv,p)):null;return`<span style="color:${col(s.k)}">${s.id}  ${f(e[0])}  ${f(e[1])}  ${f(e[2])}  ${E===null?'   —':String(E).padStart(4)}</span>`}).join('\n')}
 const r3=$('#b3');if(r3.classList.contains('open')){let rows='<span style="opacity:.6">ID EL  TOF·MS MOVE·M SAG·M</span>';if(rv)sats.forEach(s=>{const p=satPos(s,simT),E=elev(rv,p);if(E<0)return;const d=norm(sub(p,rv)),tof=d/C*1e3,mv=3874*tof/1e3,sag=465*Math.cos(rx.lat*D2R)*tof/1e3;rows+=`\n<span style="color:${col(s.k)}">${s.id} ${String(Math.round(E)).padStart(2,'0')}   ${tof.toFixed(1).padStart(5)} ${mv.toFixed(0).padStart(6)} ${sag.toFixed(0).padStart(5)}</span>`});r3.innerHTML=rows}}
let tickRow=0;
let settled=0,sized=innerWidth+'x'+innerHeight,lastStep=0;
function frame(now){
 /* once time is frozen and the camera has landed nothing moves: stop rewriting huge paths */
 const sz=innerWidth+'x'+innerHeight;const still=lock&&!cam.from&&lastStep===step&&sz===sized&&(step!==3||(now-tl3)/1000*2000>30000);if(still&&settled++>2){requestAnimationFrame(frame);return}if(!still)settled=0;sized=sz;lastStep=step;
 if(!lastMs)lastMs=now;const dt=Math.min(.1,(now-lastMs)/1000);lastMs=now;
 if(!reduce&&!lock)simT+=dt;
 W=innerWidth;H=innerHeight;cx=W/2;cy=H/2;updateCam(now);
 const g=lock?gmst(lock.t):gmst(simT);const t=lock?lock.t:simT;
 pGrat.setAttribute('d',GR.map(r=>lonlatPath(r,g)).join(''));
 pCoast.setAttribute('d',window.COAST.map(r=>lonlatPath(r,g)).join(''));
 cDisc.setAttribute('cx',cx);cDisc.setAttribute('cy',cy);cDisc.setAttribute('r',cam.R);orbitPaths();
 gOrb.style.opacity=step<=2?1:.75;
 const v=view([0,0,RE]);gPole.setAttribute('transform',`translate(${v.x.toFixed(2)} ${v.y.toFixed(2)})`);gPole.setAttribute('display',v.z<0?'none':'');
 const rv=rx?eciOf(rx.lon,rx.lat,g):null,rs=rv?view(rv):null;let u=0,vis=0,usable=[];
 const lockIds=lock?lock.set.map(o=>o.s.id):[];
 sats.forEach(s=>{const p=satPos(s,t),q=view(p);const occ=q.z<0&&Math.hypot(q.x-cx,q.y-cy)<cam.R;s.g.setAttribute('transform',`translate(${q.x.toFixed(2)} ${q.y.toFixed(2)})`);
  if(occ){s.path.setAttribute('fill','none');s.path.setAttribute('stroke-dasharray','2 2');s.text.setAttribute('opacity',.55);s.path.setAttribute('stroke-opacity',.55)}else{s.path.setAttribute('fill','var(--paper)');s.path.removeAttribute('stroke-dasharray');s.text.setAttribute('opacity',1);s.path.setAttribute('stroke-opacity',1)}
  const li=lockIds.indexOf(s.id);s.text.textContent=li>=0&&step>=3?s.id+'·'+(li+1):s.id;
  let line='',op=0;if(rv){const E=elev(rv,p);if(E>=0){vis++;if(E>=5){u++;usable.push(p)}if(step===2){line=`M${rs.x.toFixed(1)} ${rs.y.toFixed(1)}L${q.x.toFixed(1)} ${q.y.toFixed(1)}`;op=E>=5?.7:.4}}}
  s.line.setAttribute('d',line);s.line.setAttribute('opacity',op)});
 gRx.setAttribute('display',rx?'':'none');if(rx){gRx.setAttribute('transform',`translate(${rs.x.toFixed(2)} ${rs.y.toFixed(2)})`);tF4.setAttribute('display',step>=5?'':'none');rxRing.setAttribute('display',step>=4?'':'none');rxDot.setAttribute('display',step>=4?'none':'')}
 if(step===2){const a=$('#u'),b=$('#v');if(a){a.textContent=u;b.textContent=vis}}
 /* rings */
 const K=cam.R/RE;
 ringEls.forEach((r,i)=>{if(!lock||step<3){r.g.setAttribute('display','none');return}r.g.setAttribute('display','');const o=lock.set[i],c=col(o.s.k);r.g.setAttribute('stroke',c);r.fill.setAttribute('fill',c);const sp=o.p,q=view(sp),d=lock.ds[i];
  let rho=d;if(step===3){const ela=(now-tl3)/1000;rho=reduce?d:Math.max(0,Math.min(d,ela*2000))}
  else if(step===4)rho=d+lock.cb;
  const showSph=step===3;for(const e of[r.sph,r.w1,r.w2])e.setAttribute('display',showSph?'':'none');
  if(showSph){const px=rho*K;r.sph.setAttribute('cx',q.x);r.sph.setAttribute('cy',q.y);r.sph.setAttribute('r',px);r.w1.setAttribute('cx',q.x);r.w1.setAttribute('cy',q.y);r.w1.setAttribute('rx',px);r.w1.setAttribute('ry',px*.34);r.w2.setAttribute('cx',q.x);r.w2.setAttribute('cy',q.y);r.w2.setAttribute('rx',px*.34);r.w2.setAttribute('ry',px)}
  const pts=ringPts(sp,rho);if(pts)drawRing(r,pts,step===4&&i===3,step>=4&&!(step===4&&i===3));else{r.ground.setAttribute('d','');r.fill.setAttribute('d','')}
  r.link.setAttribute('d',`M${rs.x.toFixed(1)} ${rs.y.toFixed(1)}L${q.x.toFixed(1)} ${q.y.toFixed(1)}`);r.link.setAttribute('display',step>=4?'':'none');
  const gh=view(satPos(o.s,t,-2.6*D2R));r.ghost.setAttribute('transform',`translate(${gh.x.toFixed(1)} ${gh.y.toFixed(1)})`);r.glink.setAttribute('d',`M${gh.x.toFixed(1)} ${gh.y.toFixed(1)}L${q.x.toFixed(1)} ${q.y.toFixed(1)}`);const arrived=rho>=d;r.ghost.setAttribute('display',arrived?'':'none');r.glink.setAttribute('display',arrived?'':'none')});
 gFx.setAttribute('display',lock&&step===4?'':'none');if(lock&&step===4){const fs=view(eciOf(lock.fl.lon,lock.fl.lat,g));gFx.setAttribute('transform',`translate(${fs.x.toFixed(1)} ${fs.y.toFixed(1)})`);tFx.textContent='FIX/3 · OFF '+lock.off.toFixed(0)+' KM'}
 /* telemetry */
 if((tickRow++)%6===0){const P=rx?fmtPos(rx.lat,rx.lon):'—';$('#b2').textContent=`POSITION    ${P}\nSIM OFFSET  ${rx?'+'+(bias*1e6).toFixed(1)+' µS':'—'}\nTRACKING    ${u}/${vis} ≥5°/HORIZON`;
  const D=rx?(lock&&step>=3?lock.D:dop(rv,usable)):null,n=lock&&step>=3?4:usable.length;const fx3=lock&&step>=4?fmtPos(lock.fl.lat,lock.fl.lon):'—',fx4=lock&&step>=5?P+' · 0.0 M':'—',ck=lock&&step>=5?'+'+(bias*1e6).toFixed(1)+' µS · +'+(lock.cb).toFixed(1)+' KM':'—';
  $('#b4').textContent=`FIX/3    ${fx3}\nFIX/4    ${fx4}\nCLOCK/4  ${ck}\nGEOMETRY/${rx?n:'—'} ${D?'GDOP '+D.g.toFixed(1)+' · PDOP '+D.p.toFixed(1):'—'}`;table();
  $('#scale').textContent='1 PX = '+Math.round(RE/cam.R)+' KM'}
 requestAnimationFrame(frame)}
renderStep();cam.R=ZOOM[1]*RF();requestAnimationFrame(frame);
window.__gps={place,go,reset,freeze:(t)=>{simT=t}};
})();
