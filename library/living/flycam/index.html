<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>求职飞行</title>
<style>
  :root{
    --yellow:#f2e33a;
    --orange:#e8833a;
    --red:#c0392b;
    --green:#2e9e5b;
    --ink:#17181c;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
    background:#101013; color:#e8e6e0; overflow:hidden;
  }
  #app{ height:100vh; display:flex; flex-direction:column; }

  /* 窗口条 */
  #chrome{
    height:38px; flex:none; background:#1b1b1f;
    display:flex; align-items:center; padding:0 14px; gap:8px;
    border-bottom:1px solid #2a2a30;
  }
  #chrome .dot{ width:12px; height:12px; border-radius:50%; }
  #chrome .title{ margin:0 auto; font-size:12.5px; color:#8b8b93; letter-spacing:.06em; }

  /* 两窗格 */
  #panes{ flex:1; display:flex; min-height:0; }
  .pane{ position:relative; width:50%; min-width:0; }
  #rig{ background:#2e2e31; border-right:1px solid #3a3a3f; }
  #rig svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .pane-tag{
    position:absolute; top:10px; left:12px; font-size:11px; letter-spacing:.14em;
    color:rgba(255,255,255,.34); z-index:5; pointer-events:none;
  }

  /* 右窗格：真透视 */
  #flight{
    overflow:hidden; perspective:900px;
    background:#faf8f3;
    background-image:radial-gradient(#eae5d8 1px, transparent 1.4px);
    background-size:24px 24px;
  }
  #sky{
    position:absolute; inset:0; z-index:0; opacity:0;
    background:linear-gradient(198deg, #b9d8f3 0%, #dcebf9 32%, rgba(250,248,243,0) 60%);
  }
  #scene{
    position:absolute; inset:0; transform-style:preserve-3d; will-change:transform;
  }
  .c3d{
    position:absolute; left:50%; top:50%;
    box-shadow:0 8px 22px rgba(25,22,15,.12);
    will-change:transform,opacity;
  }
  .pane-tag.dark{ color:rgba(40,36,26,.4); }

  .card{ border-radius:12px; padding:20px 22px; }
  .card .kicker{
    font-size:12px; letter-spacing:.18em; font-weight:600; margin-bottom:10px;
  }
  .card .body{ font-size:19px; line-height:1.5; font-weight:600; }

  /* —— 站 1：简历卡 —— */
  .resume{
    background:#fff; color:#2c2a26; width:340px; height:230px;
    border-radius:6px; padding:30px 28px 22px;
  }
  .resume .r-line{ height:11px; border-radius:5px; background:#dcd9d0; margin-bottom:14px; }
  .resume .r-line.l1{ width:62%; }
  .resume .r-line.l2{ width:44%; }
  .resume .r-line.l3{ width:53%; }
  .resume .r-tag{ margin-top:20px; font-size:14px; font-weight:700; letter-spacing:.16em; color:#8a8478; }
  .resume .r-clip{ position:absolute; top:-16px; right:32px; }

  /* 图钉（红绳端点） */
  .pin{ position:absolute; }
  .resume .pin{ top:-10px; left:282px; }
  .postcard .pin{ top:-18px; left:100px; }

  /* —— 站 2：深圳明信片 + 车票卡 —— */
  .postcard{
    background:#fff; width:300px; height:210px;
    border-radius:4px; padding:10px 10px 6px;
  }
  .postcard .pc-cap{ font-size:12px; line-height:17px; color:#9aa3ad; text-align:right; padding-right:4px; letter-spacing:.3em; }

  .ticket{
    background:#2f6bb0; color:#fff; width:190px; height:92px;
    border-radius:8px; padding:0 14px;
    display:flex; align-items:center; gap:10px;
  }
  .ticket .t-main{ font-size:19px; font-weight:800; letter-spacing:.02em; white-space:nowrap; }
  .ticket .t-sub{ font-size:10.5px; opacity:.85; letter-spacing:.14em; margin-top:5px; }
  .ticket .t-tear{ align-self:stretch; margin:12px 0; border-left:2px dashed rgba(255,255,255,.45); }
  .ticket .t-qr{ margin-left:auto; background:#fff; border-radius:4px; padding:4px; flex:none; }

  /* —— 站 3：面试日历卡 —— */
  .cal{
    background:#fffdf7; color:#3c3a33; width:250px; height:230px;
    border-radius:6px; padding:40px 22px 18px;
  }
  .cal .cal-head{ font-size:12px; letter-spacing:.22em; font-weight:700; color:#b04a3a; margin-bottom:12px; }
  .cal .typed{ font-size:17.5px; line-height:1.7; font-weight:600; min-height:2.2em; }
  .cal .typed .caret{
    display:inline-block; width:2px; height:1.05em; background:#3c3a33;
    vertical-align:-0.18em; margin-left:2px;
  }
  .cal .coffee{
    position:absolute; right:10px; bottom:12px; width:72px; height:72px;
    border-radius:50%; border:6px solid rgba(122,84,48,.26);
  }
  .cal .coffee::after{
    content:""; position:absolute; inset:7px; border-radius:50%;
    border:2px solid rgba(122,84,48,.18);
  }
  .cal .tape{
    position:absolute; top:-11px; left:-20px; width:78px; height:24px;
    background:rgba(250,247,235,.62); transform:rotate(-38deg);
    box-shadow:0 1px 3px rgba(60,50,30,.12);
  }
  .cal .ring{ position:absolute; top:-8px; width:9px; height:17px; border:2.5px solid #9a958a; border-radius:5px; }
  .cal .ring.a{ left:56px; }
  .cal .ring.b{ left:98px; }

  /* —— 站 4：牛皮纸信封（末帧焦点） —— */
  .envelope{
    background:linear-gradient(180deg,#cfa872,#c29a63); color:#43301a;
    width:440px; height:300px; border-radius:10px;
    text-align:center; overflow:hidden;
  }
  .envelope::before{
    content:""; position:absolute; top:0; left:0; width:0; height:0;
    border-left:220px solid transparent; border-right:220px solid transparent;
    border-top:130px solid rgba(87,62,30,.14);
  }
  .envelope .e-big{ font-size:46px; font-weight:800; letter-spacing:.08em; margin-top:146px; color:#3f2d15; }
  .envelope .e-sub{ margin-top:16px; font-size:14px; letter-spacing:.26em; color:#6b5432; }
  .envelope .e-stamp{
    position:absolute; top:16px; right:18px; width:52px; height:62px;
    border:2px solid rgba(255,255,255,.8); border-radius:2px;
    background:linear-gradient(#cfe3f4 55%, #b9cfe2 55%);
  }
  .envelope .e-stamp i{
    position:absolute; left:9px; bottom:8px; width:8px; height:15px; background:#8fa3b8;
    box-shadow:14px -5px 0 -1px #8fa3b8, 25px 3px 0 -3px #8fa3b8;
  }

  #strings{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3; }
  #strings line{ stroke:var(--red); stroke-width:2; stroke-linecap:round; opacity:.85; }

  #replay{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    z-index:8; border:0; cursor:pointer; border-radius:999px;
    background:rgba(23,24,28,.88); color:#f2f0ea;
    font-size:14px; letter-spacing:.2em; padding:13px 30px 13px 34px;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 10px 30px rgba(20,18,12,.35);
  }
  #replay[hidden]{ display:none; }

  /* 底部时间轴 */
  #timeline{
    flex:none; height:78px; background:#1d1d21; border-top:1px solid #2c2c32;
    display:flex; align-items:center; gap:16px; padding:0 18px;
  }
  #playbtn{
    flex:none; width:38px; height:38px; border-radius:50%; border:1px solid #3a3a42;
    background:#26262c; color:#e8e6e0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #playbtn:hover{ background:#303038; }
  .tc{ flex:none; font-family:ui-monospace,Menlo,monospace; font-size:12.5px; color:#9a9aa2; min-width:86px; }
  .tc b{ color:#e8e6e0; font-weight:600; }
  #track{
    flex:1; position:relative; height:34px; cursor:pointer; touch-action:none;
  }
  #track .rail{
    position:absolute; left:0; right:0; top:50%; height:6px; transform:translateY(-50%);
    background:#3a3a41; border-radius:99px;
  }
  #fill{
    position:absolute; left:0; top:50%; height:6px; transform:translateY(-50%);
    background:var(--orange); border-radius:99px; width:0;
  }
  #head{
    position:absolute; top:2px; bottom:2px; width:3px; margin-left:-1.5px;
    background:#5b8def; border-radius:2px; left:0;
  }
  #head::before{
    content:""; position:absolute; top:-2px; left:50%; transform:translateX(-50%);
    border:5px solid transparent; border-top-color:#5b8def; border-bottom:0;
  }
  .dia{
    position:absolute; top:50%; width:13px; height:13px; margin:-6.5px 0 0 -6.5px;
    background:#f4f2ec; transform:rotate(45deg); border-radius:2.5px;
    border:0; padding:0; cursor:pointer;
  }
  .dia::after{
    content:""; position:absolute; inset:3px; background:#1d1d21; border-radius:1.5px;
  }
  .dia.passed::after{ background:var(--orange); }
  #kej{
    flex:none; font-size:11px; letter-spacing:.22em; color:#55555e;
    border:1px solid #33333b; border-radius:6px; padding:4px 9px;
  }
  @media (prefers-reduced-motion: reduce){
    #playbtn{ display:none; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="chrome">
    <span class="dot" style="background:#ff5f57"></span>
    <span class="dot" style="background:#febc2e"></span>
    <span class="dot" style="background:#28c840"></span>
    <span class="title">求职飞行</span>
  </header>

  <main id="panes">
    <section class="pane" id="rig" aria-label="编辑视图">
      <span class="pane-tag">编辑视图</span>
      <svg id="rigsvg" viewBox="0 0 720 760" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <pattern id="gdots" width="26" height="26" patternUnits="userSpaceOnUse">
            <circle cx="1.2" cy="1.2" r="1.2" fill="#3c3c42"/>
          </pattern>
        </defs>
        <rect width="720" height="760" fill="#2e2e31"/>
        <rect width="720" height="760" fill="url(#gdots)"/>
        <g id="wall"></g>
        <g id="pathline" fill="none" stroke="#f2e33a" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"></g>
        <g id="frustum" fill="none" stroke="#f2e33a" stroke-width="2" stroke-linejoin="round"></g>
        <g id="wpts"></g>
      </svg>
    </section>

    <section class="pane" id="flight" aria-label="相机渲染">
      <div id="sky"></div>
      <span class="pane-tag dark">相机渲染</span>
      <div id="scene"></div>
      <svg id="strings" aria-hidden="true"></svg>
      <button id="replay" hidden>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 7a5 5 0 1 1-1.7-3.75"/><path d="M12 1v3h-3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>重播
      </button>
    </section>
  </main>

  <footer id="timeline">
    <button id="playbtn" aria-label="播放或暂停">
      <svg id="icon-play" width="14" height="14" viewBox="0 0 14 14"><path d="M3 1.5 12 7 3 12.5Z" fill="currentColor"/></svg>
      <svg id="icon-pause" width="14" height="14" viewBox="0 0 14 14" style="display:none"><path d="M3 1.5h3v11H3zM8 1.5h3v11H8z" fill="currentColor"/></svg>
      <svg id="icon-re" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none"><path d="M12 7a5 5 0 1 1-1.7-3.75"/><path d="M12 1v3h-3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="tc"><b id="tc-now">0:00.0</b> / 0:12.0</span>
    <div id="track">
      <div class="rail"></div>
      <div id="fill"></div>
      <div id="head"></div>
    </div>
    <span id="kej">可拆</span>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var clamp = function(v,a,b){ return Math.min(b, Math.max(a, v)); };
  var lerp = function(a,b,u){ return a + (b-a)*u; };

  var RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DURATION = 12;          // 全程秒数
  var PERSP = 900;            // 右窗格透视距离
  var FADE_START = 320;       // z' 超过此值开始淡出
  var FADE_END = 560;         // z' 超过此值隐藏（即将掠过相机）
  var TYPE_START = 0.42, TYPE_END = 0.62;

  /* —— 参数区：航线（相机世界坐标 x, y, z）与段节奏 —— */
  var WPTS = [
    [   0, -20,   950],   // 远景，整面物件墙
    [   0, -20,  -300],   // 站 1 · 简历卡
    [   0,-140,  -700],   // 站 2 · 明信片 + 车票
    [ 330,  40, -1500],   // 站 3 · 面试日历
    [   0, -10, -2650]    // 站 4 · 信封（末帧焦点）
  ];
  var SEGS = [0.22, 0.16, 0.28, 0.34]; // 段间节奏不同，末段放慢给信封

  /* —— 卡片（世界坐标，z 越负越深） —— */
  var PIN = '<svg class="pin" width="22" height="26" viewBox="0 0 22 26">' +
    '<line x1="11" y1="9" x2="11" y2="24" stroke="#7d2f27" stroke-width="2"/>' +
    '<circle cx="11" cy="8" r="7" fill="#c0392b"/>' +
    '<circle cx="8.6" cy="5.6" r="2.2" fill="#e88a80"/></svg>';
  var CLIP = '<svg class="r-clip" width="34" height="52" viewBox="0 0 34 52" fill="none" stroke="#8a8a92" stroke-width="3"><path d="M10 14v24a7 7 0 0 0 14 0V10a10 10 0 0 0-20 0v30" stroke-linecap="round"/></svg>';
  var QR = '<svg width="22" height="22" viewBox="0 0 20 20"><g fill="#24466e"><rect width="6" height="6"/><rect x="14" width="6" height="6"/><rect y="14" width="6" height="6"/><rect x="8" y="8" width="4" height="4"/><rect x="15" y="14" width="4" height="4"/><rect x="8" y="1" width="3" height="2"/><rect x="1" y="8" width="2" height="3"/><rect x="14" y="8" width="2" height="3"/></g></svg>';

  var CARDS = [
    { id:"resume", x:0, y:-20, z:0, w:340, h:230, ry:2, cls:"resume",
      html: CLIP + PIN +
        '<div class="r-line l1"></div><div class="r-line l2"></div><div class="r-line l3"></div>' +
        '<div class="r-tag">2026 届 · AI 产品</div>' },
    { id:"postcard", x:0, y:-140, z:-500, w:300, h:210, ry:-5, rz:-2.5, cls:"postcard",
      html: PIN +
        '<svg class="pc-art" width="280" height="166" viewBox="0 0 280 166">' +
          '<rect width="280" height="104" fill="#cfe3f4"/>' +
          '<g fill="#8fa3b8">' +
            '<rect x="16" y="52" width="15" height="52"/><rect x="40" y="34" width="20" height="70"/>' +
            '<rect x="68" y="56" width="13" height="48"/><rect x="89" y="22" width="24" height="82"/>' +
            '<rect x="130" y="30" width="17" height="74"/><polygon points="138.5,4 145,30 132,30"/>' +
            '<rect x="156" y="48" width="15" height="56"/><rect x="180" y="36" width="20" height="68"/>' +
            '<rect x="209" y="54" width="13" height="50"/><rect x="231" y="40" width="18" height="64"/>' +
            '<rect x="257" y="58" width="12" height="46"/>' +
          '</g>' +
          '<rect y="104" width="280" height="62" fill="#b9cfe2"/>' +
          '<rect y="104" width="280" height="8" fill="#a5c0d6"/>' +
          '<rect y="120" width="280" height="7" fill="#c7daeb"/>' +
          '<rect y="136" width="280" height="7" fill="#adc7dc"/>' +
          '<rect y="152" width="280" height="14" fill="#cbdcec"/>' +
        '</svg><div class="pc-cap">深圳湾</div>' },
    { id:"ticket", x:-160, y:-150, z:-470, w:190, h:92, ry:9, rz:3, cls:"ticket",
      html:'<div><div class="t-main">→ 深圳北</div><div class="t-sub">高铁 · 二等座</div></div>' +
        '<div class="t-tear"></div><div class="t-qr">' + QR + '</div>' },
    { id:"cal", x:300, y:60, z:-1200, w:250, h:230, ry:-9, cls:"cal", typed:true,
      html:'<i class="ring a"></i><i class="ring b"></i><i class="tape"></i>' +
        '<div class="cal-head">面试</div><div class="typed"></div><div class="coffee"></div>' },
    { id:"envelope", x:0, y:-10, z:-2350, w:440, h:300, ry:0, cls:"envelope",
      html:'<div class="e-stamp"><i></i></div><div class="e-big">深圳见。</div><div class="e-sub">AI 产品经理 · 在路上</div>' }
  ];
  var NOTE_TEXT = "周四 14:00 复试";

  var CHIPS = [];

  /* 红绳：图钉钉住，连简历卡与明信片 */
  var STRINGS = [
    { a:[ 123, -137,    0], b:[ -44, -245, -500] }
  ];

  /* —— 构建右窗格 DOM —— */
  var scene = $("#scene"), flight = $("#flight");
  CARDS.forEach(function(c){
    var el = document.createElement("div");
    el.className = "c3d " + c.cls;
    el.style.width = c.w + "px";
    el.style.height = c.h + "px";
    el.style.marginLeft = (-c.w/2) + "px";
    el.style.marginTop = (-c.h/2) + "px";
    el.innerHTML = c.html;
    if (c.typed) el.id = "typenote";
    scene.appendChild(el);
    c.el = el;
    if (c.typed) c.typedEl = el.querySelector(".typed");
  });
  CHIPS.forEach(function(ch){
    var el = document.createElement("div");
    el.className = "c3d chip";
    el.innerHTML = "<em>来源</em>" + ch.t;
    scene.appendChild(el);
    ch.el = el;
  });

  var stringsSvg = $("#strings");
  stringsSvg.innerHTML = STRINGS.map(function(){ return '<line/>'; }).join("");
  var stringEls = Array.prototype.slice.call(stringsSvg.querySelectorAll("line"));

  /* —— 左窗格（编辑视图）：斜投影 —— */
  function eproj(x,y,z){
    return [360 + x*0.5 + z*0.058, 320 + y*0.5 + z*0.026];
  }
  function poly(pts){
    return pts.map(function(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
  }
  var wallG = $("#wall"), wptsG = $("#wpts"), frG = $("#frustum"), pathG = $("#pathline");

  // 照片墙装饰：灰白调迷你照片（白框 + 灰阶简笔 + 胶带 + 微旋转）
  var PHOTOS = [
    { x:-390, y: 150, z: -260, w:130, h:150, r:-6, k:"mount"  },
    { x: 410, y:-150, z: -430, w:150, h:110, r: 5, k:"coast"  },
    { x: -60, y: 225, z: -680, w:110, h: 90, r: 3, k:"coast"  },
    { x:-420, y:-120, z: -880, w:120, h:145, r: 4, k:"bldg"   },
    { x: 430, y: 160, z:-1150, w:140, h:110, r:-5, k:"street" },
    { x:-360, y: 170, z:-1560, w:120, h:150, r: 7, k:"coast"  },
    { x: 400, y:-165, z:-1900, w:150, h:115, r:-4, k:"mount"  },
    { x:-410, y: -55, z:-2260, w:125, h:145, r: 6, k:"bldg"   },
    { x: 360, y: 170, z:-2520, w:135, h:105, r:-7, k:"street" }
  ];
  function photoArt(k, iw, ih){
    var hw = iw/2, hh = ih/2;
    if (k === "mount") return (
      '<rect x="'+(-hw)+'" y="'+(-hh)+'" width="'+iw+'" height="'+ih+'" fill="#d6d8dc"/>' +
      '<circle cx="'+(hw*0.5)+'" cy="'+(-hh*0.45)+'" r="'+(iw/8).toFixed(1)+'" fill="#f4f4f6"/>' +
      '<path d="M'+(-hw)+','+hh+' L'+(-hw*0.35)+','+(-hh*0.15)+' L'+(hw*0.18)+','+hh+' Z" fill="#71757e"/>' +
      '<path d="M'+(-hw*0.1)+','+hh+' L'+(hw*0.42)+','+(-hh*0.5)+' L'+hw+','+hh+' Z" fill="#5a5e66"/>');
    if (k === "coast") return (
      '<rect x="'+(-hw)+'" y="'+(-hh)+'" width="'+iw+'" height="'+hh+'" fill="#dadde2"/>' +
      '<rect x="'+(-hw)+'" y="0" width="'+iw+'" height="'+hh+'" fill="#9ba3ae"/>' +
      '<path d="M'+(-hw)+','+(hh/3)+' H'+hw+'" stroke="#e6e9ee" stroke-width="2" fill="none"/>' +
      '<path d="M'+(-hw*0.6)+','+(hh*0.66)+' q'+(hw*0.25)+',-7 '+(hw*0.5)+',0" stroke="#c9cfd7" stroke-width="2" fill="none"/>' +
      '<path d="M'+(hw*0.05)+','+(hh*0.85)+' q'+(hw*0.25)+',-7 '+(hw*0.5)+',0" stroke="#c9cfd7" stroke-width="2" fill="none"/>');
    if (k === "bldg") return (
      '<rect x="'+(-hw)+'" y="'+(-hh)+'" width="'+iw+'" height="'+ih+'" fill="#d3d5da"/>' +
      '<rect x="'+(-hw+6)+'" y="'+(-hh+ih*0.34)+'" width="'+(iw*0.2)+'" height="'+(ih*0.66)+'" fill="#6d717a"/>' +
      '<rect x="'+(-hw+iw*0.28)+'" y="'+(-hh+ih*0.16)+'" width="'+(iw*0.24)+'" height="'+(ih*0.84)+'" fill="#585c64"/>' +
      '<rect x="'+(-hw+iw*0.6)+'" y="'+(-hh+ih*0.44)+'" width="'+(iw*0.28)+'" height="'+(ih*0.56)+'" fill="#7d818a"/>' +
      '<rect x="'+(-hw+iw*0.33)+'" y="'+(-hh+ih*0.24)+'" width="4" height="4" fill="#e8eaee"/>' +
      '<rect x="'+(-hw+iw*0.42)+'" y="'+(-hh+ih*0.24)+'" width="4" height="4" fill="#e8eaee"/>' +
      '<rect x="'+(-hw+iw*0.33)+'" y="'+(-hh+ih*0.36)+'" width="4" height="4" fill="#e8eaee"/>');
    return ( // street
      '<rect x="'+(-hw)+'" y="'+(-hh)+'" width="'+iw+'" height="'+ih+'" fill="#d3d5da"/>' +
      '<rect x="'+(-hw+4)+'" y="'+(-hh+ih*0.1)+'" width="'+(iw*0.26)+'" height="'+(ih*0.55)+'" fill="#6d717a"/>' +
      '<rect x="'+(hw*0.45)+'" y="'+(-hh+ih*0.2)+'" width="'+(iw*0.3)+'" height="'+(ih*0.48)+'" fill="#7d818a"/>' +
      '<path d="M'+(-hw)+','+hh+' L'+(-hw*0.3)+','+(-hh*0.35)+' L'+(hw*0.3)+','+(-hh*0.35)+' L'+hw+','+hh+' Z" fill="#83878f"/>' +
      '<rect x="-2.5" y="'+(ih*0.08)+'" width="5" height="'+(ih*0.15)+'" fill="#eceef0"/>' +
      '<rect x="-2" y="'+(ih*0.34)+'" width="4" height="'+(ih*0.13)+'" fill="#eceef0"/>');
  }
  function photoSvg(p){
    var c = eproj(p.x, p.y, p.z);
    var iw = p.w-14, ih = p.h-14;
    return '<g transform="translate('+c[0].toFixed(1)+','+c[1].toFixed(1)+') rotate('+p.r+')">' +
      '<rect x="'+(-p.w/2)+'" y="'+(-p.h/2)+'" width="'+p.w+'" height="'+p.h+'" rx="2" fill="#eae8e2" stroke="#c8c6bf"/>' +
      photoArt(p.k, iw, ih) +
      '<rect x="-25" y="'+(-p.h/2-7)+'" width="50" height="14" rx="2" fill="rgba(252,250,242,.42)" stroke="rgba(185,183,173,.55)" stroke-width=".5" transform="rotate(-4)"/>' +
      '</g>';
  }
  wallG.innerHTML = PHOTOS.map(photoSvg).join("");

  // 航线虚线
  pathG.innerHTML = '<polyline points="' + WPTS.map(function(w){ return eproj(w[0],w[1],w[2]).map(function(v){return v.toFixed(1);}).join(","); }).join(" ") + '"/>';

  // 路径点（六边形，空心→实心）
  function hexPts(cx,cy,r){
    var s = "";
    for (var i=0;i<6;i++){
      var a = Math.PI/6 + i*Math.PI/3;
      s += (cx+r*Math.cos(a)).toFixed(1) + "," + (cy+r*Math.sin(a)).toFixed(1) + " ";
    }
    return s.trim();
  }
  var TI = [0]; // 各路径点到达时刻
  var acc = 0;
  SEGS.forEach(function(w){ acc += w; TI.push(acc); });
  wptsG.innerHTML = WPTS.map(function(w){
    var e = eproj(w[0],w[1],w[2]);
    return '<polygon points="' + hexPts(e[0], e[1], 8) + '" fill="none" stroke="#f2e33a" stroke-width="2.5"/>';
  }).join("");
  var wptEls = Array.prototype.slice.call(wptsG.querySelectorAll("polygon"));

  // 视锥：apex + 四角 + 正面三角 + 机身六边形
  frG.innerHTML = '<line/><line/><line/><line/><line/><line/>' +
    '<polygon fill="none"/>' +
    '<polygon fill="#f2e33a" stroke="none"/>' +
    '<polygon fill="#f2e33a" stroke="none"/>';
  var frLines = Array.prototype.slice.call(frG.querySelectorAll("line"));
  var frPolys = frG.querySelectorAll("polygon");
  var frFace = frPolys[0];
  var frTri = frPolys[1];
  var frBody = frPolys[2];

  /* —— 状态 —— */
  var t = 0, playing = false, ended = false, dragging = false;
  var DEMO = null;
  try {
    var q = new URLSearchParams(location.search);
    var dv = q.get("demo");
    if (dv != null){
      var nested = new URLSearchParams(dv.indexOf("=") >= 0 ? dv : "progress=" + dv);
      var pv = nested.get("progress") != null ? nested.get("progress") : q.get("progress");
      if (pv != null && isFinite(parseFloat(pv))) DEMO = clamp(parseFloat(pv), 0, 1);
    } else {
      var pv2 = q.get("progress");
      if (pv2 != null && isFinite(parseFloat(pv2))) DEMO = clamp(parseFloat(pv2), 0, 1);
    }
  } catch(e){ DEMO = null; }

  /* —— 相机：段内 smoothstep（reduced-motion 线性） —— */
  function camAt(tt){
    var a = 0;
    for (var i=0;i<SEGS.length;i++){
      var w = SEGS[i];
      if (tt <= a + w || i === SEGS.length-1){
        var u = clamp((tt - a)/w, 0, 1);
        if (!RM) u = u*u*(3-2*u);
        var A = WPTS[i], B = WPTS[i+1];
        return [lerp(A[0],B[0],u), lerp(A[1],B[1],u), lerp(A[2],B[2],u)];
      }
      a += w;
    }
    return WPTS[WPTS.length-1].slice();
  }

  /* —— 右窗格投影（与 CSS perspective 同式） —— */
  var paneW = 720, paneH = 760;
  function measure(){
    var r = flight.getBoundingClientRect();
    paneW = r.width; paneH = r.height;
  }
  window.addEventListener("resize", measure);
  measure();

  function rproj(wx,wy,wz,cam){
    var zp = wz - cam[2];
    var den = PERSP - zp;
    if (den < 80) return null;
    var k = PERSP/den;
    return [paneW/2 + (wx-cam[0])*k, paneH/2 + (wy-cam[1])*k, k];
  }

  /* —— 渲染 —— */
  var sky = $("#sky");
  function render(tt){
    measure();                      // 每帧重取窗格尺寸，红绳投影与 CSS 3D 中心严格对齐
    var cam = camAt(tt);
    var eyeZ = cam[2] + PERSP;

    scene.style.transform = "translate3d(" + (-cam[0]) + "px," + (-cam[1]) + "px," + (-cam[2]) + "px)";
    sky.style.opacity = clamp((tt - 0.8)/0.18, 0, 1).toFixed(3);

    CARDS.forEach(function(c){
      var zp = c.z - cam[2];
      if (zp > FADE_END || zp < -PERSP*6){
        c.el.style.visibility = "hidden";
        return;
      }
      c.el.style.visibility = "visible";
      var op = zp <= FADE_START ? 1 : 1 - (zp - FADE_START)/(FADE_END - FADE_START);
      c.el.style.opacity = op.toFixed(3);
      var dist = PERSP - zp;                       // 眼到卡距离
      var tiltF = clamp((dist - 650)/750, 0, 1);   // 远处倾斜飞入，临近摆正
      var dir = (c.x + c.y) >= 0 ? -1 : 1;
      var ryv = c.ry + dir*tiltF*11;
      var rxv = -6*tiltF;
      c.el.style.transform = "translate3d(" + c.x + "px," + c.y + "px," + c.z + "px) rotateY(" + ryv.toFixed(2) + "deg) rotateX(" + rxv.toFixed(2) + "deg)" +
        (c.rz ? " rotate(" + c.rz + "deg)" : "");
      if (c.typed){
        var n = Math.floor(clamp((tt - TYPE_START)/(TYPE_END - TYPE_START), 0, 1) * NOTE_TEXT.length + 0.0001);
        var done = n >= NOTE_TEXT.length;
        c.typedEl.innerHTML = NOTE_TEXT.slice(0, n) + (done ? "" : '<span class="caret"></span>');
      }
    });

    CHIPS.forEach(function(ch){
      var zp = ch.z - cam[2];
      if (zp > FADE_END || zp < -PERSP*6){ ch.el.style.visibility = "hidden"; return; }
      ch.el.style.visibility = "visible";
      ch.el.style.opacity = (zp <= FADE_START ? 1 : 1 - (zp - FADE_START)/(FADE_END - FADE_START)).toFixed(3);
      ch.el.style.transform = "translate3d(" + ch.x + "px," + ch.y + "px," + ch.z + "px)";
    });

    STRINGS.forEach(function(s, i){
      var p1 = rproj(s.a[0], s.a[1], s.a[2], cam);
      var p2 = rproj(s.b[0], s.b[1], s.b[2], cam);
      var el = stringEls[i];
      // 太远（k 小）或太近（将掠过）时不画，避免浮空短线
      var kOk = function(p){ return p && p[2] > 0.55 && p[2] < 1.85; };
      if (!kOk(p1) || !kOk(p2)){ el.style.display = "none"; return; }
      el.style.display = "";
      el.setAttribute("x1", p1[0].toFixed(1)); el.setAttribute("y1", p1[1].toFixed(1));
      el.setAttribute("x2", p2[0].toFixed(1)); el.setAttribute("y2", p2[1].toFixed(1));
    });

    renderRig(cam);
    renderTimeline(tt);
  }

  /* —— 左窗格 rig —— */
  function renderRig(cam){
    var apex = eproj(cam[0], cam[1], cam[2]);
    var FL = 560, FW = 310, FH = 190;
    var base = [
      eproj(cam[0]-FW, cam[1]-FH, cam[2]-FL),
      eproj(cam[0]+FW, cam[1]-FH, cam[2]-FL),
      eproj(cam[0]+FW, cam[1]+FH, cam[2]-FL),
      eproj(cam[0]-FW, cam[1]+FH, cam[2]-FL)
    ];
    for (var i=0;i<4;i++){
      frLines[i].setAttribute("x1", apex[0]); frLines[i].setAttribute("y1", apex[1]);
      frLines[i].setAttribute("x2", base[i][0]); frLines[i].setAttribute("y2", base[i][1]);
    }
    frFace.setAttribute("points", poly(base));
    // 对角线（源片正面有交叉线）
    frLines[4].setAttribute("x1", base[0][0]); frLines[4].setAttribute("y1", base[0][1]);
    frLines[4].setAttribute("x2", base[2][0]); frLines[4].setAttribute("y2", base[2][1]);
    frLines[5].setAttribute("x1", base[1][0]); frLines[5].setAttribute("y1", base[1][1]);
    frLines[5].setAttribute("x2", base[3][0]); frLines[5].setAttribute("y2", base[3][1]);

    // 朝向小三角：正面顶边中点，指向飞行方向
    var topMid = eproj(cam[0], cam[1]-FH, cam[2]-FL);
    var bcx = (base[0][0]+base[1][0]+base[2][0]+base[3][0])/4;
    var bcy = (base[0][1]+base[1][1]+base[2][1]+base[3][1])/4;
    var dx = bcx-apex[0], dy = bcy-apex[1];
    var dl = Math.hypot(dx,dy) || 1; dx/=dl; dy/=dl;
    var px = -dy, py = dx;
    frTri.setAttribute("points",
      (topMid[0]+dx*16).toFixed(1)+","+(topMid[1]+dy*16).toFixed(1)+" "+
      (topMid[0]+px*9).toFixed(1)+","+(topMid[1]+py*9).toFixed(1)+" "+
      (topMid[0]-px*9).toFixed(1)+","+(topMid[1]-py*9).toFixed(1));

    frBody.setAttribute("points", hexPts(apex[0], apex[1], 10));

    wptEls.forEach(function(el, i){
      var passed = t >= TI[i] - 0.001;
      el.setAttribute("fill", passed ? "#f2e33a" : "none");
    });
  }

  /* —— 时间轴 —— */
  var track = $("#track"), fill = $("#fill"), head = $("#head");
  var tcNow = $("#tc-now");
  TI.forEach(function(tt){
    var b = document.createElement("button");
    b.className = "dia"; b.style.left = (tt*100) + "%";
    b.setAttribute("aria-label", "跳到 " + Math.round(tt*100) + "%");
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      t = tt; ended = false; setEnded(false);
      render(t);
    });
    track.appendChild(b);
  });
  var dias = Array.prototype.slice.call(track.querySelectorAll(".dia"));

  function fmt(tt){
    var s = tt * DURATION;
    return "0:" + (s < 10 ? "0" : "") + s.toFixed(1);
  }
  function renderTimeline(tt){
    fill.style.width = (tt*100) + "%";
    head.style.left = (tt*100) + "%";
    tcNow.textContent = fmt(tt);
    dias.forEach(function(d, i){
      d.classList.toggle("passed", tt >= TI[i] - 0.001);
    });
  }

  function setEnded(v){
    ended = v;
    $("#replay").hidden = !v;
    $("#icon-play").style.display = (v || playing) ? "none" : "";
    $("#icon-pause").style.display = (!v && playing) ? "" : "none";
    $("#icon-re").style.display = v ? "" : "none";
  }

  var playbtn = $("#playbtn");
  playbtn.addEventListener("click", function(){
    if (RM) return;
    if (ended){ t = 0; setEnded(false); playing = true; setEnded(false); render(t); return; }
    playing = !playing;
    setEnded(false);
  });
  $("#replay").addEventListener("click", function(){
    t = 0; playing = true; setEnded(false); render(t);
  });

  function seekFromEvent(e){
    var r = track.getBoundingClientRect();
    t = clamp((e.clientX - r.left)/r.width, 0, 1);
    if (ended && t < 1) setEnded(false);
    render(t);
  }
  track.addEventListener("pointerdown", function(e){
    dragging = true;
    try { track.setPointerCapture(e.pointerId); } catch(err){}
    wasPlaying = playing; playing = false;
    seekFromEvent(e);
  });
  track.addEventListener("pointermove", function(e){ if (dragging) seekFromEvent(e); });
  track.addEventListener("pointerup", function(e){
    if (!dragging) return;
    dragging = false;
    if (wasPlaying && !ended && !RM) playing = true;
    setEnded(ended);
  });
  var wasPlaying = false;

  /* —— 启动 —— */
  if (DEMO != null){
    t = DEMO; playing = false;
    (function dloop(){ render(t); requestAnimationFrame(dloop); })(); // 定帧循环重渲染（render 为 t 的纯函数），供无头截图
    return;
  }
  if (RM){
    t = 1; playing = false;         // 终帧布局，无自动运镜
    setEnded(false);
    render(t);
  } else {
    playing = true;
    setEnded(false);
    render(t);
  }
  var last = performance.now();
  function loop(now){
    if (playing && !dragging){
      t += (now - last)/1000/DURATION;
      if (t >= 1){ t = 1; playing = false; setEnded(true); }
      render(t);
    }
    last = now;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
