<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coffee Zine</title><link rel="icon" href="data:,">
<style>
:root{--u:min(calc(100vw/1200),calc(100vh/1000))}
*{box-sizing:border-box}
html,body{margin:0;background:#E4E4E4;color:#222;font:14px/1.7 ui-monospace,Menlo,monospace}
#stage{position:relative;width:calc(var(--u)*1200);height:calc(var(--u)*1000);margin:0 auto;background:#E4E4E4;overflow:hidden;cursor:e-resize;user-select:none}
#paper{position:absolute;left:calc(var(--u)*80);top:calc(var(--u)*119);width:calc(var(--u)*1031);height:calc(var(--u)*763);background:#F3EFEB;box-shadow:0 calc(var(--u)*46) calc(var(--u)*84) calc(var(--u)*-8) rgba(0,0,0,.12)}
#paper img{position:absolute;inset:0;width:100%;height:100%;display:block;visibility:hidden}
#paper img.on{visibility:visible}
#bar{position:absolute;right:0;top:0;bottom:0;width:calc(var(--u)*7);background:#FAFAFA}
#bar i{position:absolute;left:calc(var(--u)*1);right:calc(var(--u)*1);top:calc(var(--u)*3);height:calc(var(--u)*276);border-radius:calc(var(--u)*3);background:#C1C1C1}
#tail{max-width:720px;margin:0 auto;padding:32px 20px 70px;background:transparent}
#tail h3{font-size:15px;margin:0 0 8px}#tail dt{margin-top:10px}#tail dd{margin:2px 0 0}#tail code{font-size:13px}
</style></head><body>
<div id="stage" role="img" aria-label="六个跨页的咖啡杂志，每约 0.89 秒硬切一页">
  <div id="paper">
    <img class="on" src="source-assets/spread-1.jpg" alt="">
    <img src="source-assets/spread-2.jpg" alt="">
    <img src="source-assets/spread-3.jpg" alt="">
    <img src="source-assets/spread-4.jpg" alt="">
    <img src="source-assets/spread-5.jpg" alt="">
    <img src="source-assets/spread-6.jpg" alt="">
  </div>
  <div id="bar"><i></i></div>
</div>
<section id="tail"><h3>可拆</h3><dl>
<dt><code>#stage</code></dt><dd>硬切翻页：没有过渡，每 885 毫秒直接换一张跨页，循环。点击画面或按左右键换页，空格暂停。</dd>
<dt><code>#paper</code></dt><dd>一张平放的纸：灰底上单向下落的大软阴影，上方没有阴影。</dd>
</dl></section>
<script>
const imgs=[...document.querySelectorAll('#paper img')],STEP=885;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let i=0,paused=reduce,last=performance.now();
function show(n){imgs[i].classList.remove('on');i=(n+imgs.length)%imgs.length;imgs[i].classList.add('on');last=performance.now()}
(function tick(t){if(!paused&&!document.hidden&&t-last>=STEP)show(i+1);requestAnimationFrame(tick)})(last);
document.getElementById('stage').onclick=()=>show(i+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(i+1);else if(e.key==='ArrowLeft')show(i-1);else if(e.key===' '){e.preventDefault();paused=!paused;last=performance.now()}});
const q=new URLSearchParams(location.search);if(q.has('p')){paused=true;show(+q.get('p'))}
</script></body></html>
