 if(n.kind==='cl'){return `<div class="n cl ${n.c}" id="n-${id}" data-id="${id}" style="left:${n.x}px;top:${n.y}px;height:${n.h}px"><i class="hd l" style="top:159px"></i><span class="tl">${I(n.ic)}</span><span class="a">${n.a}</span><span class="b">${n.b}</span><div class="box"><div class="bx x1"><b>${n.v[0][0]}</b>${n.v[0][1]}</div><div class="bx x2"><b>${n.v[1][0]}</b>${n.v[1][1]}</div><div class="bl">${I('branch')}${n.l}</div></div><div class="ln" style="top:212px"></div><div class="rw" style="top:227px"><span>${I('pin')}EU West</span><span>${I('layers')}${n.m}</span></div><div class="opn"><span>Open cluster</span>${I('up')}</div></div>`}
 const ed=n.kind==='edge';
 return `<div class="n ${n.c}" id="n-${id}" data-id="${id}" style="left:${n.x}px;top:${n.y}px"><i class="hd l"></i><i class="hd r"></i><span class="tl">${I(n.ic)}</span><span class="a">${n.a}</span><span class="b">${n.b}</span><div class="rw" style="top:80px">${ed?'<span>Load balancing</span><b>Round robin</b>':'<b>2 vCPU · 2 GB</b><code>:3000</code>'}</div><div class="ln" style="top:112px"></div><div class="rw" style="top:127px"><span>${I('pin')}EU West</span><span>${ed?I('shield')+'HTTPS':'Stateless'}</span></div></div>`};
world.insertAdjacentHTML('beforeend',Object.entries(G.nodes).map(([id,n])=>nodeHTML(id,n)).join(''));
let Z=G.z;const W=view==='light'?230:284,H=n=>n.h||(view==='light'?104:166);
function setZ(z){Z=Math.max(.3,Math.min(1.5,z));world.style.transform=`scale(${Z})`;document.getElementById('zv').textContent=Math.round(Z*100)+'%'}
const round=(pts,r)=>{let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length-1;i++){const [a,b,c]=[pts[i-1],pts[i],pts[i+1]];const u=Math.hypot(b[0]-a[0],b[1]-a[1]),v=Math.hypot(c[0]-b[0],c[1]-b[1]),k=Math.min(r,u/2,v/2);if(k<.5){d+=`L${b[0]} ${b[1]}`;continue}d+=`L${b[0]-(b[0]-a[0])/u*k} ${b[1]-(b[1]-a[1])/u*k}Q${b[0]} ${b[1]} ${b[0]+(c[0]-b[0])/v*k} ${b[1]+(c[1]-b[1])/v*k}`}return d+`L${pts.at(-1)[0]} ${pts.at(-1)[1]}`};
function route(e){const [s,t,o={}]=e,a=G.nodes[s],b=G.nodes[t];const sx=a.x+W,sy=a.y+H(a)/2,tx=b.x-5,ty=b.h?b.y+159:b.y+H(b)/2;
 if(tx>sx+8){const mx=sx+(o.rx||G.rx);return [[sx,sy],[mx,sy],[mx,ty],[tx,ty]]}
 const ox=o.ox||23,my=o.ly??(sy+ty)/2,lx=tx-18;return [[sx,sy],[sx+ox,sy],[sx+ox,my],[lx,my],[lx,ty],[tx,ty]]}
function draw(){svg.innerHTML=G.edges.map((e,i)=>{const p=route(e),end=p.at(-1),hot=sel&&(e[0]===sel||e[1]===sel),off=G.nodes[e[0]].st==='stopped'||G.nodes[e[1]].st==='stopped';return `<path class="e${hot?' hot':''}${off?' off':''}" d="${round(p,view==="dark"?13:9)}"/><path class="h" d="M${end[0]-8} ${end[1]-5}L${end[0]} ${end[1]}L${end[0]-8} ${end[1]+5}Z" style="${hot?'fill:var(--hot)':''}"/>`}).join('')}
let sel=null;
/* drag + click */
const pop=document.createElement('div');pop.id='pop';canvas.append(pop);
let drag=null;
world.addEventListener('pointerdown',e=>{const el=e.target.closest('.n');if(!el)return;const n=G.nodes[el.dataset.id];drag={el,n,sx:e.clientX,sy:e.clientY,x:n.x,y:n.y,moved:false};el.setPointerCapture(e.pointerId)});
world.addEventListener('pointermove',e=>{if(!drag)return;const dx=(e.clientX-drag.sx)/Z,dy=(e.clientY-drag.sy)/Z;if(Math.hypot(dx,dy)*Z>4)drag.moved=true;if(!drag.moved)return;closePop();drag.n.x=drag.x+dx;drag.n.y=drag.y+dy;G.edges.forEach(ed=>{if(ed[2]&&(ed[0]===drag.el.dataset.id||ed[1]===drag.el.dataset.id))delete ed[2].ly});drag.el.style.left=drag.n.x+'px';drag.el.style.top=drag.n.y+'px';draw()});
world.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;if(!d.moved)openPop(d.el.dataset.id)});
function closePop(){pop.className='';if(sel){document.getElementById('n-'+sel)?.classList.remove('sel');sel=null;draw()}}
function setStatus(id,st){const n=G.nodes[id],el=document.getElementById('n-'+id),s=el.querySelector('.stt');n.st=st;el.classList.toggle('stopped',st==='stopped');if(s)s.textContent=st==='stopped'?'Stopped':st==='restarting'?'Restarting':(n.s||'Running');draw()}
function openPop(id){if(sel===id){closePop();return}closePop();sel=id;const n=G.nodes[id],el=document.getElementById('n-'+id);el.classList.add('sel');draw();
 pop.innerHTML=`<header><span>${n.a}</span><em id="pst">${n.st==='stopped'?'Stopped':'Running'}</em></header><div class="kv">${n.b}<br>${n.k}</div><button data-a="inspect">${I('eye')}Inspect</button><button data-a="restart">${I('refresh')}Restart</button><button data-a="stop" class="warn">${n.st==='stopped'?I('play')+'Start':I('stop')+'Stop'}</button>`;
 const cr=canvas.getBoundingClientRect(),r=el.getBoundingClientRect();let x=r.right-cr.left+10,y=r.top-cr.top;if(x+206>cr.width-8)x=r.left-cr.left-216;y=Math.min(y,cr.height-190);pop.style.left=x+'px';pop.style.top=Math.max(8,y)+'px';pop.classList.add('show')}
pop.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=sel,a=b.dataset.a,pst=document.getElementById('pst');
 if(a==='inspect')pop.classList.toggle('ins');
 if(a==='restart'){setStatus(id,'restarting');pst.textContent='Restarting';setTimeout(()=>{setStatus(id,'running');const p=document.getElementById('pst');if(p&&sel===id)p.textContent='Running'},1200)}
 if(a==='stop'){const stopped=G.nodes[id].st==='stopped';setStatus(id,stopped?'running':'stopped');closePop()}});
canvas.addEventListener('pointerdown',e=>{if(!e.target.closest('.n,#pop'))closePop()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
document.getElementById('zoom').addEventListener('click',e=>{const b=e.target.closest('[data-z]');if(!b)return;const v=+b.dataset.z;setZ(v===0?G.z:Z+v*.1)});
setZ(G.z);draw();
</script></body></html>
