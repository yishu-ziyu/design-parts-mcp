<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relief Invite</title>
<style>
@font-face{font-family:"Alegreya Sans";src:url(fonts/alegreya-sans.woff2) format("woff2");font-display:block}
@font-face{font-family:"Marcellus";src:url(fonts/marcellus.woff2) format("woff2");font-display:block}
:root{--u:1px;--bg:#dcdad5;--blue:#2255bb;--edge:rgba(255,255,255,.34)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--blue);font-family:"Alegreya Sans",system-ui,sans-serif;overflow-x:hidden}
#page{position:relative;width:calc(var(--u)*1468);height:calc(var(--u)*1270);overflow:hidden}
#hero{position:absolute;left:0;top:0;width:calc(var(--u)*1468);height:calc(var(--u)*492);overflow:hidden;background:url(source-assets/hero.jpg) 0 0/100% 100% no-repeat;border-bottom:1px solid var(--edge)}
#vase{position:absolute;left:calc(var(--u)*609.5);top:calc(var(--u)*42.5);width:calc(var(--u)*248);height:calc(var(--u)*412.5);transform-origin:50% 50%;cursor:grab;transition:transform .5s cubic-bezier(.42,1.32,.5,1);z-index:2;background:url(source-assets/vase.png) 0 0/100% 100% no-repeat;-webkit-user-drag:none}
#vase.tilt{transform:translate(calc(var(--u)*56),calc(var(--u)*-6)) rotate(-127deg)}
#pour{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#facts{position:absolute;left:calc(var(--u)*18);top:calc(var(--u)*498);width:calc(var(--u)*450);height:calc(var(--u)*488);background:#e9e9e7}
#facts .in{position:absolute;left:calc(var(--u)*26);top:calc(var(--u)*24);width:calc(var(--u)*397);height:calc(var(--u)*440);background:#e7e7e7;border:1px solid #c6cbd0}
#facts h2{position:absolute;left:0;right:0;top:calc(var(--u)*20);text-align:center;font:400 calc(var(--u)*34)/1 "Alegreya Sans";letter-spacing:-.01em}
.r{position:absolute;left:calc(var(--u)*26);right:calc(var(--u)*25);display:flex;justify-content:space-between;font-size:calc(var(--u)*20.6);line-height:calc(var(--u)*20.5);font-variant-numeric:lining-nums}
.r span:last-child{text-align:right}
.col{position:absolute;left:0;top:calc(var(--u)*497);width:calc(var(--u)*485);height:calc(var(--u)*490);border:1px solid var(--edge);border-left:0}
#relief{position:absolute;left:calc(var(--u)*491);top:calc(var(--u)*498);width:calc(var(--u)*975);height:calc(var(--u)*545);background:url(source-assets/relief.jpg) 0 0/100% 100% no-repeat;cursor:default}
#relief canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#row3{position:absolute;left:0;top:calc(var(--u)*986);width:calc(var(--u)*491);height:calc(var(--u)*57);background:url(source-assets/row3-left.jpg) 0 0/100% 100% no-repeat}
.cell{position:absolute;top:calc(var(--u)*1043);height:calc(var(--u)*220);border:1px solid var(--edge);border-top:0}
#foot{position:relative;max-width:720px;margin:0 auto;padding:60px 24px 80px;font-size:14px;line-height:1.6;color:#334}
#foot h3{font-size:15px;color:#112}#foot dt{margin-top:12px}#foot code{color:var(--blue)}#foot dd{margin:2px 0 0}
</style></head><body>
<main id="page">
  <section id="hero" aria-label="WILD WEEK">
    <svg id="pour" viewBox="0 0 1468 492" preserveAspectRatio="none" aria-hidden="true">
      <path id="pH" d="M668 300C672 370 652 420 664 560" fill="none" stroke="#efefed" stroke-linecap="round"/>
      <path id="pB" d="M668 300C672 370 652 420 664 560" fill="none" stroke="#2255bb" stroke-linecap="round"/>
    </svg>
    <div id="vase" role="img" aria-label="Wild Week Athens 2026 vase"></div>
  </section>
  <div class="col"></div>
  <section id="facts"><div class="in">
    <h2>THE FACTS</h2>
    <div class="r" style="top:calc(var(--u)*135)"><span>D.</span><span>April 31 – 32, 2026</span></div>
    <div class="r" style="top:calc(var(--u)*182)"><span>P.</span><span>Vivien<br>and her 5 friends.</span></div>
    <div class="r" style="top:calc(var(--u)*249)"><span>H.</span><span>The backyard of<br>Kongxi's villa.</span></div>
    <div class="r" style="top:calc(var(--u)*316)"><span>I.</span><span>No work. Mostly wandering.</span></div>
  </div></section>
  <section id="relief" aria-label="Relief frieze"><canvas id="rc"></canvas></section>
  <div id="row3"></div>
  <div class="cell" style="left:0;width:calc(var(--u)*485)"></div><div class="cell" style="left:calc(var(--u)*491);width:calc(var(--u)*484)"></div><div class="cell" style="left:calc(var(--u)*981);width:calc(var(--u)*487)"></div>
</main>
<section id="foot">
<h3>可拆</h3>
<dl>
<dt><code>#vase</code></dt><dd>鼠标移上去，瓶子整个倒下来，带着白边的贴纸外形压住字母；移开再立回去。</dd>
<dt><code>#pour</code></dt><dd>瓶子倒下后淌出一条同色液体，先变长，再变细收尾，超出首屏边界的部分被裁掉。</dd>
<dt><code>#relief</code></dt><dd>鼠标划过石膏浮雕，人物沿划过的范围慢慢变成深灰，背景不变，几秒后淡回去。</dd>
<dt><code>#facts</code></dt><dd>四行事实，左字母右内容，靠大段留白和细框撑出请柬的正式感。</dd>
</dl>
</section>
<script>
(()=>{
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,qs=new URLSearchParams(location.search);
const fit=()=>document.documentElement.style.setProperty('--u',innerWidth/1468+'px');addEventListener('resize',()=>{fit();sizeC()});fit();
// 倒液体：长度、粗细都由时间决定
const vase=document.getElementById('vase'),pB=document.getElementById('pB'),pH=document.getElementById('pH'),LEN=pB.getTotalLength();
let t0=null,raf=0;
function pose(s){ // s: 秒。0.35s 开始流，1.25s 到底，1.5s 后变细，2.4s 结束
 const g=Math.min(1,Math.max(0,(s-.3)/.95)),e=1-Math.pow(1-g,2),len=LEN*e;
 const th=Math.max(0,Math.min(1,(s-1.5)/.9));const w=38*(1-th*.95);
 const show=s>.3&&th<1;
 [pB,pH].forEach(p=>{p.style.display=show?'':'none';p.setAttribute('stroke-dasharray',len+' 1000')});
 pB.setAttribute('stroke-width',w);pH.setAttribute('stroke-width',w+30)}
function run(now){if(t0==null)t0=now;const s=(now-t0)/1000;pose(s);if(s<2.5)raf=requestAnimationFrame(run)}
function enter(){if(vase.classList.contains('tilt'))return;vase.classList.add('tilt');if(reduce){pose(1.3);return}cancelAnimationFrame(raf);t0=null;raf=requestAnimationFrame(run)}
function leave(){vase.classList.remove('tilt');cancelAnimationFrame(raf);pose(0)}
pose(0);
vase.addEventListener('pointerenter',enter);
document.getElementById('hero').addEventListener('pointermove',e=>{if(!vase.classList.contains('tilt'))return;const r=vase.getBoundingClientRect(),m=30;if(e.clientX<r.left-m||e.clientX>r.right+m||e.clientY<r.top-m||e.clientY>r.bottom+m)leave()});
document.getElementById('hero').addEventListener('pointerleave',leave);
// 浮雕：遮罩画布记录鼠标走过的范围，每帧慢慢衰减，再用它裁出深色层
const rel=document.getElementById('relief'),cv=document.getElementById('rc'),ctx=cv.getContext('2d');
const dark=new Image();dark.src='source-assets/relief-dark.jpg';
const mk=document.createElement('canvas'),mc=mk.getContext('2d');
const MW=975,MH=545,RAD=92,HOLD=2.6,FADE=4.2;mk.width=MW;mk.height=MH;
let lastN=0,lastStamp=-9,fadeAcc=0;
function sizeC(){cv.width=rel.clientWidth*Math.min(devicePixelRatio||1,2);cv.height=rel.clientHeight*Math.min(devicePixelRatio||1,2);compose()}
function stamp(x,y){const g=mc.createRadialGradient(x,y,0,x,y,RAD);g.addColorStop(0,'rgba(0,0,0,.34)');g.addColorStop(.62,'rgba(0,0,0,.22)');g.addColorStop(1,'rgba(0,0,0,0)');mc.fillStyle=g;mc.fillRect(x-RAD,y-RAD,RAD*2,RAD*2)}
function compose(){if(!dark.complete)return;ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(mk,0,0,cv.width,cv.height);ctx.globalCompositeOperation='source-in';ctx.drawImage(dark,0,0,cv.width,cv.height)}
function loop(now){const dt=Math.min(.05,(now-lastN)/1000);lastN=now;
 const idle=now/1000-lastStamp;fadeAcc+=dt;
 // 画布只有 8 位透明度，每帧减得太少会被舍入成不变，所以攒够 0.25 秒减一次；淡到底直接清空
 if(idle>HOLD&&fadeAcc>=.25){fadeAcc=0;mc.globalCompositeOperation='destination-out';mc.fillStyle='rgba(0,0,0,'+(.25/FADE*1.5)+')';mc.fillRect(0,0,MW,MH);mc.globalCompositeOperation='source-over';if(idle>HOLD+FADE*1.6&&idle<1e6)mc.clearRect(0,0,MW,MH)}
 compose();requestAnimationFrame(loop)}
let px=null,py=null;
rel.addEventListener('pointermove',e=>{const r=rel.getBoundingClientRect(),x=(e.clientX-r.left)*MW/r.width,y=(e.clientY-r.top)*MH/r.height;
 const n=px==null?1:Math.max(1,Math.ceil(Math.hypot(x-px,y-py)/14));for(let i=1;i<=n;i++)stamp((px==null?x:px+(x-px)*i/n),(py==null?y:py+(y-py)*i/n));px=x;py=y;lastStamp=performance.now()/1000});
rel.addEventListener('pointerleave',()=>{px=py=null});
dark.onload=()=>{sizeC();requestAnimationFrame(t=>{lastN=t;loop(t)})};
window.__w={enter,leave,pose,stamp,sweep(a,b){for(let x=a;x<=b;x+=10)for(const y of [90,190,290,390])for(let k=0;k<5;k++)stamp(x,y);lastStamp=1e9}};
if(qs.get('demo')==='pour'){vase.style.transition='none';vase.classList.add('tilt');pose(parseFloat(qs.get('s')||'1.25'))}
if(qs.get('demo')==='trail'){addEventListener('load',()=>{scrollTo(0,243*innerWidth/1468);setTimeout(()=>window.__w.sweep(parseFloat(qs.get('a')||'90'),parseFloat(qs.get('b')||'530')),200)})}
})();
</script></body></html>
