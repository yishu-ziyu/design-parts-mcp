<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Press feedback button · Design parts</title>
  <link rel="stylesheet" href="./press-feedback.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#27272a;font:13px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:28px 24px}.wrap{max-width:380px;margin:auto}.card{min-height:332px;padding:28px 24px 20px;background:white;border:1px solid #e1e1e5;border-radius:16px}.eyebrow{margin:0 0 12px;color:#85858e;font-size:10px;letter-spacing:.08em}h1{font-size:22px;line-height:1.35;letter-spacing:-.035em;margin:0 0 8px}p{margin:0}.description{color:#71717a;font-size:12px}.article{display:flex;gap:14px;align-items:center;border-top:1px solid #eeeef1;border-bottom:1px solid #eeeef1;padding:15px 0;margin:20px 0}.number{font:12px ui-monospace,monospace;color:#a1a1aa}h2{font-size:13px;line-height:1.5;font-weight:550;margin:0}.article p{font-size:10px;color:#85858e}.actions{display:flex;gap:8px;align-items:center}.press-feedback{font-size:12px!important;--pf-padding:10px 12px}.secondary{--pf-background:#f3f3f5;--pf-color:#52525b;--pf-border:#e4e4e7}#feedback{min-height:19px;margin-top:14px;font-size:11px;color:#71717a}.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 4px 0;font-size:10px;color:#71717a}.controls label{display:flex;align-items:center;gap:5px}.controls input{margin:0}.spec{white-space:nowrap;font:10px ui-monospace,monospace}@media(max-width:340px){body{padding:20px 12px}.card{padding:24px 18px 18px}.controls{margin-top:12px}}
    #save[aria-pressed=true]{--pf-background:#f0f0f2;--pf-hover:#e8e8eb;--pf-color:#27272a;--pf-border:#d4d4d8}
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card" id="buttons">
      <p class="eyebrow" data-text="eyebrow">NATIVE BUTTON / CSS</p>
      <h1 data-text="title">Reading list</h1>
      <p class="description" data-text="description">Save this article for later.</p>
      <div class="article"><span class="number" aria-hidden="true">01</span><div><h2 data-text="article">Light on the desk</h2><p data-text="sample">A reading sample</p></div></div>
      <div class="actions">
        <button class="press-feedback" id="save" type="button" aria-pressed="false" data-text="save">Save article</button>
        <button class="press-feedback secondary" id="disabled" type="button" disabled data-text="disabled">Disabled</button>
      </div>
      <p id="feedback" role="status" aria-live="polite" data-text="initial">Nothing saved in this example.</p>
    </main>
    <div class="controls"><label><input id="reduce" type="checkbox"><span data-text="reduce">Reduce motion</span></label><span class="spec">100ms · 0.97</span></div>
  </div>
  <script>
    const language=new URL(location.href).searchParams.get("lang")==="zh"?"zh":"en";
    const copy={
      en:{eyebrow:"NATIVE BUTTON / CSS",title:"Reading list",description:"Save this article for later.",article:"Light on the desk",sample:"A reading sample",save:"Save article",saved:"Saved",disabled:"Disabled",initial:"Nothing saved in this example.",added:"Saved in this example only.",removed:"Removed from this example.",reduce:"Reduce motion"},
      zh:{eyebrow:"原生按钮 / CSS",title:"阅读列表",description:"把这篇文章留到稍后阅读。",article:"光落在桌面的方式",sample:"一篇阅读示例",save:"收藏文章",saved:"已收藏",disabled:"不可用",initial:"本页示例尚未收藏。",added:"已收藏，仅保存在本页。",removed:"已从本页示例中移除。",reduce:"减少动态效果"}
    }[language];
    document.documentElement.lang=language==="zh"?"zh-CN":"en";
    document.querySelectorAll("[data-text]").forEach(element=>element.textContent=copy[element.dataset.text]);
    document.getElementById("save").addEventListener("click",event=>{
      const saved=event.currentTarget.getAttribute("aria-pressed")!=="true";
      event.currentTarget.setAttribute("aria-pressed",String(saved));
      document.getElementById("feedback").textContent=saved?copy.added:copy.removed;
    });
    document.getElementById("reduce").addEventListener("change",event=>{
      document.querySelectorAll("button.press-feedback").forEach(button=>button.toggleAttribute("data-reduced-motion",event.target.checked));
    });
  </script>
</body>
</html>
